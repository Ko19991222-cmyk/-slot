<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>COUNTDOWN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

body{
  color:white;
  user-select:none;
}

/* =========================
   STAGE
========================= */

#stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  background:
    radial-gradient(circle at 50% 42%,
      #111 0%,
      #050505 45%,
      #000 75%);
}

/* subtle background */
#bgGlow{
  position:absolute;
  width:130vw;
  height:130vw;
  border-radius:50%;

  background:
    radial-gradient(circle,
      rgba(255,255,255,.05),
      rgba(255,255,255,.015) 35%,
      transparent 65%);

  animation:bgPulse 2.5s ease-in-out infinite;
}

@keyframes bgPulse{
  0%,100%{
    transform:scale(.9);
    opacity:.3;
  }
  50%{
    transform:scale(1.08);
    opacity:.7;
  }
}


/* =========================
   NUMBER
========================= */

#number{
  position:relative;
  z-index:5;

  font-size:min(60vw,360px);
  line-height:1;
  font-weight:1000;

  text-shadow:
    0 0 12px white,
    0 0 35px rgba(255,255,255,.4);

  transform:scale(1);
}

#number.show{
  animation:numberShow .5s cubic-bezier(.1,1,.2,1);
}

@keyframes numberShow{
  0%{
    opacity:0;
    transform:scale(1.35);
    filter:blur(8px);
  }

  60%{
    opacity:1;
    transform:scale(.97);
    filter:blur(0);
  }

  100%{
    transform:scale(1);
  }
}


/* =========================
   START
========================= */

#start{
  position:absolute;
  bottom:8%;
  z-index:20;

  padding:17px 48px;

  border-radius:100px;

  border:1px solid rgba(255,255,255,.4);

  background:rgba(0,0,0,.7);

  color:white;

  font-size:17px;
  font-weight:900;

  letter-spacing:.15em;
}

#test{
  position:absolute;
  top:max(20px,env(safe-area-inset-top));
  z-index:10;

  font-size:10px;
  letter-spacing:.2em;
  opacity:.25;
}


/* =========================
   BLACKOUT
========================= */

#black{
  position:fixed;
  inset:0;
  z-index:50;

  background:#000;

  display:none;
}


/* =========================
   SLASH
========================= */

#slashLayer{
  position:fixed;
  inset:0;

  z-index:70;

  pointer-events:none;

  display:none;

  overflow:hidden;
}

#slashLayer.show{
  display:block;
}

.slash{
  position:absolute;

  left:-30%;
  top:50%;

  width:160%;
  height:8px;

  background:white;

  box-shadow:
    0 0 12px white,
    0 0 30px white,
    0 0 70px rgba(255,255,255,.8);

  transform:
    rotate(-18deg)
    scaleX(0);

  transform-origin:center;
}

#slashLayer.go .slash{
  animation:slash .22s ease-out forwards;
}

@keyframes slash{
  0%{
    transform:
      rotate(-18deg)
      scaleX(0);

    opacity:0;
  }

  20%{
    opacity:1;
  }

  100%{
    transform:
      rotate(-18deg)
      scaleX(1);

    opacity:1;
  }
}


/* =========================
   FLASH
========================= */

#flash{
  position:fixed;
  inset:0;

  z-index:90;

  background:white;

  opacity:0;

  pointer-events:none;
}

#flash.go{
  animation:flash .5s ease-out;
}

@keyframes flash{
  0%{opacity:0;}
  8%{opacity:1;}
  20%{opacity:.25;}
  32%{opacity:1;}
  100%{opacity:0;}
}


/* =========================
   HIT
========================= */

#hit{
  position:fixed;
  inset:0;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;

  background:
    radial-gradient(circle,
      #7b1600 0%,
      #310000 32%,
      #080000 65%,
      #000 100%);

  overflow:hidden;
}

#hit.show{
  display:flex;
}

#hitGlow{
  position:absolute;

  width:150vw;
  height:150vw;

  border-radius:50%;

  background:
    conic-gradient(
      transparent,
      rgba(255,150,0,.35),
      transparent,
      rgba(255,0,0,.4),
      transparent);

  animation:rotate 3s linear infinite;
}

@keyframes rotate{
  to{
    transform:rotate(360deg);
  }
}

#hitText{
  position:relative;
  z-index:5;

  font-size:min(24vw,150px);

  font-weight:1000;

  opacity:0;

  transform:scale(.25);

  text-shadow:
    0 0 10px white,
    0 0 25px #ffdc00,
    0 0 60px #ff4d00,
    0 0 100px red;
}

#hit.show #hitText{
  animation:hitText .65s cubic-bezier(.05,1.4,.2,1) forwards;
}

@keyframes hitText{

  0%{
    opacity:0;
    transform:scale(.25);
    filter:blur(12px);
  }

  65%{
    opacity:1;
    transform:scale(1.18);
    filter:blur(0);
  }

  100%{
    opacity:1;
    transform:scale(1);
  }
}


/* =========================
   CONGRATS
========================= */

#congrats{
  position:absolute;

  bottom:20%;

  font-size:15px;

  letter-spacing:.25em;

  font-weight:800;

  opacity:0;
}

#hit.show #congrats{
  animation:congrats 1s 1s forwards;
}

@keyframes congrats{
  to{
    opacity:.9;
  }
}


/* =========================
   NEXT
========================= */

#next{
  position:absolute;

  bottom:7%;

  z-index:10;

  padding:15px 42px;

  border-radius:100px;

  border:1px solid rgba(255,255,255,.45);

  background:rgba(0,0,0,.65);

  color:white;

  font-size:15px;

  font-weight:900;

  opacity:0;

  pointer-events:none;
}

#hit.show #next{
  animation:nextShow .5s 2.5s forwards;
}

@keyframes nextShow{
  to{
    opacity:1;
    pointer-events:auto;
  }
}


/* =========================
   SHAKE
========================= */

.shake{
  animation:shake .3s linear;
}

@keyframes shake{
  0%{transform:translate(0,0);}
  15%{transform:translate(-9px,5px);}
  30%{transform:translate(10px,-6px);}
  45%{transform:translate(-7px,-5px);}
  60%{transform:translate(8px,6px);}
  80%{transform:translate(-4px,2px);}
  100%{transform:translate(0,0);}
}
</style>
</head>

<body>

<div id="stage">

  <div id="bgGlow"></div>

  <div id="test">
    TEST MODE / 100% HIT
  </div>

  <div id="number">3</div>

  <button id="start">
    START
  </button>

</div>


<div id="black"></div>


<div id="slashLayer">
  <div class="slash"></div>
</div>


<div id="flash"></div>


<div id="hit">

  <div id="hitGlow"></div>

  <div id="hitText">
    当たり
  </div>

  <div id="congrats">
    CONGRATULATIONS
  </div>

  <button id="next">
    NEXT
  </button>

</div>


<!-- ★ 今回の当たり後の音 -->
<audio
  id="hitMusic"
  src="hit_music.mp3"
  preload="auto">
</audio>


<script>

const $ = s => document.querySelector(s);

const sleep = ms =>
  new Promise(resolve => setTimeout(resolve,ms));

let busy = false;


/* =========================
   HIT MUSIC
========================= */

const hitMusic = $("#hitMusic");

hitMusic.volume = 1;


/*
 iPhone Safari対策。

 STARTを押した瞬間に一度
 audioを再生可能状態にする。
*/
async function unlockHitMusic(){

  try{

    hitMusic.muted = true;

    await hitMusic.play();

    hitMusic.pause();

    hitMusic.currentTime = 0;

    hitMusic.muted = false;

  }catch(e){

    hitMusic.muted = false;

  }

}


function stopHitMusic(){

  hitMusic.pause();

  try{
    hitMusic.currentTime = 0;
  }catch(e){}

}


async function playHitMusic(){

  stopHitMusic();

  hitMusic.volume = 1;

  try{

    await hitMusic.play();

  }catch(e){

    console.log(
      "hit music play error",
      e
    );

  }

}


/* =========================
   SIMPLE COUNT SOUND
========================= */

let audioCtx = null;


function startAudio(){

  if(!audioCtx){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(audioCtx.state === "suspended"){

    audioCtx.resume();

  }

}


/*
 今は仮のカウント音。

 後でここを
 本物の緊張BGMに交換できる。
*/
function countSound(n){

  if(!audioCtx) return;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  const now =
    audioCtx.currentTime;

  const frequency =
    n === 3 ? 82 :
    n === 2 ? 73 :
              65;

  osc.type = "sine";

  osc.frequency.setValueAtTime(
    frequency,
    now
  );

  gain.gain.setValueAtTime(
    .12,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now + .7
  );

  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  osc.start(now);

  osc.stop(
    now + .75
  );

}


/* =========================
   NUMBER
========================= */

function showNumber(n){

  const el = $("#number");

  el.className = "";

  el.textContent = n;

  void el.offsetWidth;

  el.className = "show";

  countSound(n);

}


/* =========================
   FLASH
========================= */

function flash(){

  const el = $("#flash");

  el.className = "";

  void el.offsetWidth;

  el.className = "go";

}


/* =========================
   SHAKE
========================= */

function shake(){

  document.body.classList.remove(
    "shake"
  );

  void document.body.offsetWidth;

  document.body.classList.add(
    "shake"
  );

  setTimeout(()=>{

    document.body.classList.remove(
      "shake"
    );

  },350);

}


/* =========================
   SLASH HIT
========================= */

async function slashHit(){

  /*
   当たり直前は一瞬静かにする。
  */

  await sleep(300);


  $("#slashLayer").className =
    "show go";


  await sleep(180);


  flash();

  shake();


  await sleep(260);


  $("#slashLayer").className = "";


  /*
   ★ 当たり表示
  */

  $("#hit").className = "show";


  /*
   ★ ここで今回の音をスタート

   当たり表示とほぼ同時。
  */

  await sleep(120);

  playHitMusic();

}


/* =========================
   BLACKOUT HIT
========================= */

async function blackoutHit(){

  $("#black").style.display =
    "block";


  /*
   この無音時間を長めにして
   「え？」を作る。
  */

  await sleep(1400);


  $("#black").style.display =
    "none";


  await slashHit();

}


/* =========================
   NORMAL HIT
========================= */

async function normalHit(){

  /*
   1の後にちょっと溜める
  */

  await sleep(650);

  await slashHit();

}


/* =========================
   REVIVAL HIT
========================= */

async function revivalHit(){

  /*
   一回終わったように見せる。
  */

  $("#number").textContent = "";

  await sleep(1300);


  $("#black").style.display =
    "block";


  await sleep(850);


  $("#black").style.display =
    "none";


  await slashHit();

}


/* =========================
   PLAY
========================= */

async function play(){

  if(busy) return;

  busy = true;


  startAudio();

  await unlockHitMusic();


  stopHitMusic();


  $("#start").style.display =
    "none";


  $("#hit").className = "";


  /*
   今は100%当たり。

   当たり方だけランダム。
  */

  const pattern =
    Math.floor(
      Math.random() * 6
    );


  /* =================
     3
  ================= */

  showNumber(3);


  if(pattern === 0){

    await sleep(1450);

    return slashHit();

  }


  await sleep(2100);


  /* =================
     2
  ================= */

  showNumber(2);


  if(pattern === 1){

    await sleep(1550);

    return slashHit();

  }


  await sleep(2250);


  /* =================
     1
  ================= */

  showNumber(1);


  if(pattern === 2){

    await sleep(1750);

    return slashHit();

  }


  await sleep(2450);


  $("#number").textContent = "";


  /* =================
     AFTER 1
  ================= */

  if(pattern === 3){

    await normalHit();

  }

  else if(pattern === 4){

    await blackoutHit();

  }

  else{

    await revivalHit();

  }

}


/* =========================
   RESET
========================= */

function reset(){

  stopHitMusic();


  $("#hit").className = "";

  $("#black").style.display =
    "none";

  $("#slashLayer").className =
    "";

  $("#number").textContent =
    "3";

  $("#number").className =
    "";

  $("#start").style.display =
    "block";

  busy = false;

}


$("#start").addEventListener(
  "click",
  play
);


$("#next").addEventListener(
  "click",
  reset
);

</script>

</body>
</html>
