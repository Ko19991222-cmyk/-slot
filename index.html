<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<title>COUNTDOWN LOTTERY</title>

<style>

/* =========================================================
   BASIC
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;

  background:#120008;
  color:#fff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

body{
  position:fixed;
  inset:0;
}


/* =========================================================
   BACKGROUND
========================================================= */

#bg{
  position:fixed;
  inset:0;
  z-index:0;

  background-color:#120008;

  background-image:
    url("./9E28B31B-C619-4F41-AB55-91C025168D02.png");

  background-size:auto 100%;
  background-position:center top;
  background-repeat:no-repeat;
}

#shade{
  position:fixed;
  inset:0;
  z-index:1;

  pointer-events:none;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.01),
      rgba(0,0,0,.04) 45%,
      rgba(0,0,0,.14)
    );
}


/* =========================================================
   GAME
========================================================= */

#game{
  position:fixed;
  inset:0;

  z-index:10;
}


/* =========================================================
   START
========================================================= */

#startScreen{
  position:absolute;
  inset:0;

  z-index:30;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;

  padding-bottom:max(8vh,55px);
}

#startInfo{
  text-align:center;

  margin-bottom:18px;

  font-weight:900;
  letter-spacing:.14em;

  text-shadow:
    0 3px 7px rgba(0,0,0,.85);
}

#startInfo .main{
  font-size:18px;
}

#startInfo .sub{
  margin-top:5px;

  font-size:11px;

  opacity:.85;
}

#startButton{
  width:min(78vw,330px);
  height:72px;

  border:
    2px solid rgba(255,255,255,.9);

  border-radius:18px;

  color:#fff;

  font-size:27px;
  font-weight:1000;

  letter-spacing:.16em;

  background:
    linear-gradient(
      180deg,
      rgba(255,105,178,.97),
      rgba(218,0,99,.97)
    );

  box-shadow:
    0 7px 0 #790037,
    0 12px 25px rgba(0,0,0,.5),
    inset 0 2px 0 rgba(255,255,255,.45);
}

#startButton:active{
  transform:
    translateY(4px);

  box-shadow:
    0 3px 0 #790037,
    0 8px 18px rgba(0,0,0,.5);
}


/* =========================================================
   NUMBER

   ★45vw → 52vw
========================================================= */

#number{
  position:absolute;

  left:50%;
  top:61%;

  transform:
    translate(-50%,-50%);

  z-index:20;

  font-size:min(52vw,255px);

  line-height:.8;

  font-weight:1000;

  font-family:
    Impact,
    "Arial Black",
    sans-serif;

  color:#fff7fb;

  -webkit-text-stroke:
    clamp(5px,1.6vw,9px)
    #ff4b9d;

  text-shadow:
    0 6px 0 #d82779,
    0 12px 0 #a80052,
    0 18px 8px rgba(60,0,28,.72);

  opacity:0;

  pointer-events:none;
  user-select:none;
}

#number.show{
  opacity:1;

  animation:
    numberIn .16s ease-out;
}

@keyframes numberIn{

  0%{
    transform:
      translate(-50%,-50%)
      scale(.86);
  }

  100%{
    transform:
      translate(-50%,-50%)
      scale(1);
  }

}

#number.red{
  color:#fff0f3;

  -webkit-text-stroke:
    8px #ff153e;

  text-shadow:
    0 6px 0 #d00029,
    0 12px 0 #830016,
    0 18px 8px rgba(0,0,0,.7);
}

#number.gold{
  color:#fffde6;

  -webkit-text-stroke:
    8px #ffd200;

  text-shadow:
    0 6px 0 #e59b00,
    0 12px 0 #9c5900,
    0 18px 8px rgba(0,0,0,.7);
}

#number.small{
  transform:
    translate(-50%,-50%)
    scale(.76);
}


/* =========================================================
   MESSAGE

   ★「…」25px → 50px
========================================================= */

#message{
  position:absolute;

  left:50%;
  top:63%;

  transform:
    translate(-50%,-50%);

  z-index:25;

  width:100%;

  text-align:center;

  font-size:50px;
  line-height:1;

  font-weight:1000;

  letter-spacing:.12em;

  text-shadow:
    0 4px 10px rgba(0,0,0,.95);

  pointer-events:none;
}


/* =========================================================
   BLACKOUT
========================================================= */

#blackout{
  position:fixed;
  inset:0;

  z-index:50;

  background:#000;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .06s linear;
}

#blackout.on{
  opacity:1;
}


/* =========================================================
   FLASH
========================================================= */

#flash{
  position:fixed;
  inset:0;

  z-index:75;

  background:#fff;

  opacity:0;

  pointer-events:none;
}

#flash.on{
  animation:
    flashAnim .34s ease-out;
}

@keyframes flashAnim{

  0%{
    opacity:1;
  }

  100%{
    opacity:0;
  }

}


/* =========================================================
   SLASH
========================================================= */

#slashLayer{
  position:fixed;
  inset:0;

  z-index:70;

  overflow:hidden;

  pointer-events:none;
}

.slash{
  position:absolute;

  left:-40vw;
  top:50%;

  width:180vw;

  /*
    ★前より太く
  */
  height:18px;

  transform-origin:center;

  background:#fff;

  box-shadow:
    0 0 7px #fff,
    0 0 16px #fff,
    0 0 28px #ff3b96,
    0 0 55px #ff006e;

  animation:
    slashGo .40s
    cubic-bezier(.08,.85,.18,1)
    forwards;
}

.slash.two{
  animation:
    slashGo2 .40s
    cubic-bezier(.08,.85,.18,1)
    forwards;
}

@keyframes slashGo{

  0%{
    opacity:0;

    transform:
      translateY(-50%)
      rotate(-25deg)
      scaleX(0);
  }

  12%{
    opacity:1;
  }

  52%{
    opacity:1;

    transform:
      translateY(-50%)
      rotate(-25deg)
      scaleX(1);
  }

  100%{
    opacity:0;

    transform:
      translateY(-50%)
      rotate(-25deg)
      scaleX(1);
  }

}

@keyframes slashGo2{

  0%{
    opacity:0;

    transform:
      translateY(-50%)
      rotate(24deg)
      scaleX(0);
  }

  12%{
    opacity:1;
  }

  52%{
    opacity:1;

    transform:
      translateY(-50%)
      rotate(24deg)
      scaleX(1);
  }

  100%{
    opacity:0;

    transform:
      translateY(-50%)
      rotate(24deg)
      scaleX(1);
  }

}


/* =========================================================
   HIT SHAKE

   ★当たり時だけ一発
========================================================= */

body.hitShake{
  animation:
    hitShake .36s
    cubic-bezier(.2,.8,.3,1);
}

@keyframes hitShake{

  0%{
    transform:
      translate3d(0,0,0);
  }

  15%{
    transform:
      translate3d(-10px,5px,0);
  }

  30%{
    transform:
      translate3d(9px,-5px,0);
  }

  45%{
    transform:
      translate3d(-7px,4px,0);
  }

  60%{
    transform:
      translate3d(6px,-3px,0);
  }

  75%{
    transform:
      translate3d(-3px,2px,0);
  }

  100%{
    transform:
      translate3d(0,0,0);
  }

}


/* =========================================================
   HIT TEXT
========================================================= */

#hitText{
  position:fixed;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    scale(.15);

  z-index:90;

  font-size:min(25vw,125px);

  white-space:nowrap;

  font-weight:1000;

  font-family:
    Impact,
    "Arial Black",
    sans-serif;

  color:#fff;

  -webkit-text-stroke:
    6px #ff2486;

  text-shadow:
    0 6px 0 #d00064,
    0 12px 0 #780032,
    0 0 18px #fff,
    0 0 38px #ff1680;

  opacity:0;

  pointer-events:none;
}

#hitText.on{
  animation:
    hitPop .72s
    cubic-bezier(.12,.88,.12,1)
    forwards;
}

@keyframes hitPop{

  0%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.15);
  }

  30%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1.28);
  }

  50%{
    transform:
      translate(-50%,-50%)
      scale(.91);
  }

  68%{
    transform:
      translate(-50%,-50%)
      scale(1.07);
  }

  100%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }

}


/* =========================================================
   TREASURE
========================================================= */

#treasureScreen{
  position:fixed;
  inset:0;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  padding:
    30px 14px;

  background:
    radial-gradient(
      circle at 50% 38%,
      rgba(255,20,130,.42),
      rgba(28,0,16,.92) 55%,
      rgba(0,0,0,.97)
    );
}

#treasureScreen.show{
  display:flex;
}

#treasureIntro{
  font-size:14px;
  font-weight:800;

  letter-spacing:.12em;

  margin-bottom:8px;
}

#treasureTitle{
  text-align:center;

  font-size:27px;
  font-weight:1000;

  text-shadow:
    0 0 15px #ff1680;
}

#treasureSub{
  margin-top:8px;

  font-size:13px;

  opacity:.88;

  text-align:center;
}

#chests{
  width:100%;
  max-width:500px;

  display:flex;

  justify-content:center;
  align-items:flex-end;

  gap:8px;

  margin-top:42px;
}

.chestWrap{
  flex:1;

  max-width:150px;
  min-width:0;

  text-align:center;
}

.chest{
  position:relative;

  width:100%;

  aspect-ratio:
    1.08 / 1;

  cursor:pointer;

  transform-origin:
    center bottom;
}

.chestLid{
  position:absolute;

  left:7%;
  top:16%;

  width:86%;
  height:34%;

  border-radius:
    18px 18px 7px 7px;

  background:
    linear-gradient(
      180deg,
      #ffdd79 0%,
      #d78a17 20%,
      #754008 22%,
      #b85b16 40%,
      #6f2b08 100%
    );

  border:
    3px solid #ffd96b;

  box-shadow:
    inset 0 4px 4px rgba(255,255,255,.3),
    0 5px 8px rgba(0,0,0,.5);

  transform-origin:
    center bottom;

  transition:
    transform .45s ease;
}

.chestBody{
  position:absolute;

  left:7%;
  bottom:7%;

  width:86%;
  height:52%;

  border-radius:
    5px 5px 14px 14px;

  background:
    linear-gradient(
      90deg,
      #5f2107,
      #c26a1c 22%,
      #7b2b08 50%,
      #c36c1d 77%,
      #5d2007
    );

  border:
    3px solid #ffc94f;

  box-shadow:
    inset 0 0 12px rgba(0,0,0,.6),
    0 8px 14px rgba(0,0,0,.6);
}

.chestLock{
  position:absolute;

  left:50%;
  top:43%;

  transform:
    translateX(-50%);

  width:25%;
  height:30%;

  border-radius:5px;

  background:
    linear-gradient(
      #fff1a3,
      #d49315
    );

  border:
    2px solid #704000;

  z-index:3;
}

.chest.open .chestLid{
  transform:
    translateY(-24%)
    rotateX(72deg);
}

.chest.shake{
  animation:
    chestShake .48s linear;
}

@keyframes chestShake{

  0%,
  100%{
    transform:
      translateX(0)
      rotate(0);
  }

  20%{
    transform:
      translateX(-6px)
      rotate(-3deg);
  }

  40%{
    transform:
      translateX(6px)
      rotate(3deg);
  }

  60%{
    transform:
      translateX(-5px)
      rotate(-2deg);
  }

  80%{
    transform:
      translateX(5px)
      rotate(2deg);
  }

}

.rankLabel{
  margin-top:9px;

  min-height:29px;

  font-size:22px;
  font-weight:1000;

  opacity:0;
}

.rankLabel.show{
  opacity:1;
}

.rank1{
  color:#ffe36b;

  text-shadow:
    0 0 12px #ffb300;
}

.rank2{
  color:#f4f4f4;

  text-shadow:
    0 0 10px #aab6c7;
}

.rank3{
  color:#ff9c4a;

  text-shadow:
    0 0 10px #c94d00;
}


/* =========================================================
   RANK RESULT
========================================================= */

#rankResult{
  position:fixed;
  inset:0;

  z-index:130;

  display:none;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:
    rgba(0,0,0,.77);
}

#rankResult.show{
  display:flex;
}

#rankBig{
  font-size:
    min(24vw,120px);

  font-weight:1000;

  line-height:1;

  text-align:center;
}

#rankWin{
  margin-top:15px;

  font-size:31px;
  font-weight:1000;
}

#nextButton{
  display:none;

  margin-top:32px;

  width:min(72vw,300px);
  height:60px;

  border:
    2px solid #fff;

  border-radius:16px;

  color:#fff;

  background:
    linear-gradient(
      #ff5fa8,
      #bc0055
    );

  font-size:22px;
  font-weight:1000;

  letter-spacing:.12em;
}

</style>
</head>

<body>

<div id="bg"></div>

<div id="shade"></div>


<div id="game">

  <div id="startScreen">

    <div id="startInfo">

      <div class="main">
        完全抽選 1/30
      </div>

      <div class="sub">
        毎回独立抽選
      </div>

    </div>


    <button id="startButton">
      START
    </button>

  </div>


  <div id="number"></div>

  <div id="message"></div>

</div>


<div id="slashLayer"></div>

<div id="blackout"></div>

<div id="flash"></div>


<div id="hitText">
  当たり
</div>


<div id="treasureScreen">

  <div id="treasureIntro">
    ここからが本番。
  </div>


  <div id="treasureTitle">
    運命の宝箱を選べ！
  </div>


  <div id="treasureSub">
    この一箱が、結果を決める。
  </div>


  <div id="chests">

    <div class="chestWrap">

      <div
        class="chest"
        data-index="0"
      >

        <div class="chestLid"></div>

        <div class="chestBody"></div>

        <div class="chestLock"></div>

      </div>

      <div class="rankLabel"></div>

    </div>


    <div class="chestWrap">

      <div
        class="chest"
        data-index="1"
      >

        <div class="chestLid"></div>

        <div class="chestBody"></div>

        <div class="chestLock"></div>

      </div>

      <div class="rankLabel"></div>

    </div>


    <div class="chestWrap">

      <div
        class="chest"
        data-index="2"
      >

        <div class="chestLid"></div>

        <div class="chestBody"></div>

        <div class="chestLock"></div>

      </div>

      <div class="rankLabel"></div>

    </div>

  </div>


  <button id="nextButton">
    NEXT
  </button>

</div>


<div id="rankResult">

  <div id="rankBig"></div>

  <div id="rankWin">
    当選！
  </div>

</div>


<script>

/* =========================================================
   BASIC
========================================================= */

const sleep =
  ms =>
    new Promise(
      resolve =>
        setTimeout(resolve,ms)
    );


const number =
  document.getElementById(
    "number"
  );

const message =
  document.getElementById(
    "message"
  );

const startScreen =
  document.getElementById(
    "startScreen"
  );

const startButton =
  document.getElementById(
    "startButton"
  );

const blackout =
  document.getElementById(
    "blackout"
  );

const flash =
  document.getElementById(
    "flash"
  );

const hitText =
  document.getElementById(
    "hitText"
  );

const treasureScreen =
  document.getElementById(
    "treasureScreen"
  );

const treasureTitle =
  document.getElementById(
    "treasureTitle"
  );

const treasureSub =
  document.getElementById(
    "treasureSub"
  );

const nextButton =
  document.getElementById(
    "nextButton"
  );

const rankResult =
  document.getElementById(
    "rankResult"
  );

const rankBig =
  document.getElementById(
    "rankBig"
  );


let playing=false;

let selectedRank=null;

let chestRanks=[];

let treasureLocked=false;


/* =========================================================
   AUDIO ENGINE

   ★MP3再生専用
   ★電子音生成なし
========================================================= */

let audioCtx=null;

let tensionBuffer=null;

let hitBuffer=null;

let tensionSource=null;

let hitSource=null;

let audioLoaded=false;

let audioLoadingPromise=null;


/* =========================================================
   LOAD AUDIO
========================================================= */

async function loadAudioFile(url){

  const response =
    await fetch(
      url,
      {
        cache:"force-cache"
      }
    );


  if(!response.ok){

    throw new Error(
      "Audio load failed: " +
      url
    );

  }


  const arrayBuffer =
    await response.arrayBuffer();


  return await audioCtx
    .decodeAudioData(
      arrayBuffer
    );

}


/* =========================================================
   PREPARE AUDIO
========================================================= */

async function prepareAudio(){

  if(audioLoaded){
    return;
  }


  if(audioLoadingPromise){
    return audioLoadingPromise;
  }


  audioLoadingPromise =
    (async()=>{

      const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;


      if(!AudioContextClass){

        throw new Error(
          "Web Audio unsupported"
        );

      }


      if(!audioCtx){

        audioCtx =
          new AudioContextClass();

      }


      const results =
        await Promise.all([

          loadAudioFile(
            "./Tension.mp3"
          ),

          loadAudioFile(
            "./hit_music_final.mp3"
          )

        ]);


      tensionBuffer =
        results[0];


      hitBuffer =
        results[1];


      audioLoaded=true;

    })();


  try{

    await audioLoadingPromise;

  }

  catch(error){

    console.error(
      "Audio preparation error:",
      error
    );


    audioLoadingPromise=null;

  }

}


/*
  データだけ先読み
*/

prepareAudio();


/* =========================================================
   UNLOCK AUDIO
========================================================= */

async function unlockAudio(){

  if(!audioLoaded){

    await prepareAudio();

  }


  if(
    audioCtx &&
    audioCtx.state !== "running"
  ){

    try{

      await audioCtx.resume();

    }

    catch(error){

      console.error(
        "Audio resume failed:",
        error
      );

    }

  }

}


/* =========================================================
   SOURCE STOP
========================================================= */

function stopSource(source){

  if(!source){
    return;
  }


  try{

    source.stop();

  }

  catch(e){}

}


/* =========================================================
   TENSION
========================================================= */

function startTension(){

  if(
    !audioCtx ||
    !tensionBuffer
  ){
    return;
  }


  stopSource(
    tensionSource
  );


  const source =
    audioCtx.createBufferSource();


  source.buffer =
    tensionBuffer;


  source.loop=true;


  const gain =
    audioCtx.createGain();


  gain.gain.value=.72;


  source.connect(
    gain
  );


  gain.connect(
    audioCtx.destination
  );


  source.start(0);


  tensionSource =
    source;


  source.onended=()=>{

    if(
      tensionSource===source
    ){

      tensionSource=null;

    }

  };

}


/* =========================================================
   STOP TENSION
========================================================= */

function stopTension(){

  stopSource(
    tensionSource
  );


  tensionSource=null;

}


/* =========================================================
   HIT MUSIC

   ★本当の当たり専用
========================================================= */

function playHitMusic(){

  if(
    !audioCtx ||
    !hitBuffer
  ){

    console.error(
      "Hit audio is not ready."
    );

    return;

  }


  stopSource(
    hitSource
  );


  const source =
    audioCtx.createBufferSource();


  source.buffer =
    hitBuffer;


  source.loop=false;


  const gain =
    audioCtx.createGain();


  gain.gain.value=1;


  source.connect(
    gain
  );


  gain.connect(
    audioCtx.destination
  );


  source.start(0);


  hitSource=
    source;


  source.onended=()=>{

    if(
      hitSource===source
    ){

      hitSource=null;

    }

  };

}


/* =========================================================
   STOP HIT MUSIC
========================================================= */

function stopHitMusic(){

  stopSource(
    hitSource
  );


  hitSource=null;

}


/* =========================================================
   NUMBER
========================================================= */

function clearNumberStyle(){

  number.classList.remove(
    "red",
    "gold",
    "small"
  );

}


function showNumber(n){

  clearNumberStyle();


  number.textContent=n;


  number.classList.remove(
    "show"
  );


  void number.offsetWidth;


  number.classList.add(
    "show"
  );

}


function hideNumber(){

  number.classList.remove(
    "show"
  );

}


/* =========================================================
   NORMAL COUNT
========================================================= */

async function normalCount(){

  showNumber(3);

  await sleep(1850);


  showNumber(2);

  await sleep(2050);


  showNumber(1);

  await sleep(2250);

}


/* =========================================================
   FLASH
========================================================= */

function doFlash(){

  flash.classList.remove(
    "on"
  );


  void flash.offsetWidth;


  flash.classList.add(
    "on"
  );

/* =========================================================

========================================================= */

function slash(
  fake=false,
  double=false
){

  const layer =
    document.getElementById(
      "slashLayer"
    );


  const s =
    document.createElement(
      "div"
    );


  s.className=
    "slash";


  layer.appendChild(
    s
  );


  if(double){

    setTimeout(()=>{

      const s2 =
        document.createElement(
          "div"
        );


      s2.className=
        "slash two";


      layer.appendChild(
        s2
      );


      setTimeout(()=>{

        s2.remove();

      },600);

    },110);

  }


  if(!fake){

    doFlash();

  }


  setTimeout(()=>{

    s.remove();

  },600);

}

/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(arr){

  const a=[
    ...arr
  ];


  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i+1)
      );


    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];

  }


  return a;

}


/* =========================================================
   CHEST CLICK
========================================================= */

document
  .querySelectorAll(
    ".chest"
  )
  .forEach(chest=>{

    chest.addEventListener(
      "click",
      async()=>{

        if(treasureLocked){
          return;
        }


        treasureLocked=true;


        const chosen =
          Number(
            chest.dataset.index
          );


        chestRanks=[
          null,
          null,
          null
        ];


        /*
          選択した箱 =
          事前抽選した結果
        */

        chestRanks[chosen] =
          selectedRank;


        /*
          残り2等級
        */

        const remainingRanks =
          shuffle(
            [1,2,3].filter(
              rank =>
                rank !== selectedRank
            )
          );


        /*
          残り2箱
        */

        const otherIndexes =
          shuffle(
            [0,1,2].filter(
              i =>
                i !== chosen
            )
          );


        chestRanks[
          otherIndexes[0]
        ] =
          remainingRanks[0];


        chestRanks[
          otherIndexes[1]
        ] =
          remainingRanks[1];


        /*
          選択箱を揺らす
        */

        chest.classList.add(
          "shake"
        );


        await sleep(600);


        chest.classList.remove(
          "shake"
        );


        /*
          OPEN
        */

        chest.classList.add(
          "open"
        );


        doFlash();


        await sleep(550);


        showRankLabel(
          chosen,
          selectedRank
        );


        await sleep(450);


        /*
          大きく結果表示
        */

        await showBigRank(
          selectedRank
        );


        treasureTitle.textContent=
          "残りの宝箱は…";


        treasureSub.textContent=
          "選ばなかった箱もオープン";


        /*
          残り開封順もランダム
        */

        const revealOrder =
          shuffle(
            otherIndexes
          );


        await sleep(650);


        for(
          const index
          of revealOrder
        ){

          const otherChest =
            document.querySelector(
              `.chest[data-index="${index}"]`
            );


          otherChest
            .classList
            .add(
              "shake"
            );


          await sleep(420);


          otherChest
            .classList
            .remove(
              "shake"
            );


          otherChest
            .classList
            .add(
              "open"
            );


          doFlash();


          await sleep(300);


          showRankLabel(
            index,
            chestRanks[index]
          );


          await sleep(650);

        }


        nextButton.style.display=
          "block";

      }
    );

  });
