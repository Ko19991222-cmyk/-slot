<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COUNTDOWN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

body{
  user-select:none;
}

button{
  font-family:inherit;
}

/* =========================
   メイン
========================= */

#stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 45%,#171717 0%,#050505 48%,#000 82%);
}

#number{
  font-size:min(60vw,360px);
  font-weight:1000;
  line-height:1;
  text-shadow:
    0 0 15px #fff,
    0 0 40px rgba(255,255,255,.45);
}

#number.show{
  animation:numberIn .45s ease-out;
}

@keyframes numberIn{
  0%{
    opacity:0;
    transform:scale(1.35);
    filter:blur(8px);
  }
  100%{
    opacity:1;
    transform:scale(1);
    filter:blur(0);
  }
}

#start,#next{
  position:absolute;
  bottom:8%;
  padding:17px 46px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.75);
  color:#fff;
  font-size:17px;
  font-weight:900;
  letter-spacing:.12em;
  z-index:300;
}

#test{
  position:absolute;
  top:max(25px,env(safe-area-inset-top));
  font-size:10px;
  letter-spacing:.2em;
  opacity:.28;
}

/* =========================
   暗転
========================= */

#black{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  background:#000;
}

/* =========================
   切り裂き
========================= */

#slash{
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  overflow:hidden;
  pointer-events:none;
}

#slash.go{
  display:block;
}

#line{
  position:absolute;
  left:-30%;
  top:50%;
  width:160%;
  height:9px;
  background:#fff;
  box-shadow:
    0 0 15px #fff,
    0 0 40px #fff,
    0 0 90px #fff;
  transform:rotate(-18deg) scaleX(0);
}

#slash.go #line{
  animation:slashAnim .2s ease-out forwards;
}

@keyframes slashAnim{
  to{
    transform:rotate(-18deg) scaleX(1);
  }
}

/* =========================
   フラッシュ
========================= */

#flash{
  position:fixed;
  inset:0;
  z-index:250;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

#flash.go{
  animation:flashAnim .45s ease-out;
}

@keyframes flashAnim{
  0%{opacity:0}
  10%{opacity:1}
  28%{opacity:.2}
  40%{opacity:1}
  100%{opacity:0}
}

/* =========================
   当たり画面
========================= */

#hit{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(circle,#8b1a00 0%,#390000 35%,#090000 68%,#000 100%);
}

#hit.show{
  display:flex;
}

#glow{
  position:absolute;
  width:150vw;
  height:150vw;
  border-radius:50%;
  background:
    conic-gradient(
      transparent,
      rgba(255,180,0,.35),
      transparent,
      rgba(255,0,0,.42),
      transparent
    );
  animation:spin 3s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

#hitText{
  position:relative;
  z-index:5;
  font-size:min(24vw,150px);
  font-weight:1000;
  text-align:center;
  text-shadow:
    0 0 12px #fff,
    0 0 30px #ffe100,
    0 0 70px #ff4500,
    0 0 110px red;
  animation:hitIn .55s cubic-bezier(.05,1.4,.2,1);
}

@keyframes hitIn{
  0%{
    opacity:0;
    transform:scale(.25);
    filter:blur(10px);
  }
  70%{
    opacity:1;
    transform:scale(1.18);
    filter:blur(0);
  }
  100%{
    transform:scale(1);
  }
}

#subText{
  position:absolute;
  bottom:25%;
  z-index:5;
  font-size:15px;
  font-weight:900;
  letter-spacing:.16em;
}

/* =========================
   宝箱選択画面
========================= */

#treasureScreen{
  position:fixed;
  inset:0;
  z-index:140;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 42%,#202020 0%,#090909 48%,#000 100%);
}

#treasureScreen.show{
  display:flex;
}

#treasureTitle{
  position:absolute;
  top:12%;
  width:100%;
  text-align:center;
  font-size:clamp(24px,8vw,48px);
  font-weight:1000;
  letter-spacing:.14em;
  text-shadow:
    0 0 12px #fff,
    0 0 30px rgba(255,255,255,.35);
}

#treasureSub{
  position:absolute;
  top:20%;
  width:100%;
  text-align:center;
  font-size:13px;
  letter-spacing:.14em;
  opacity:.72;
}

#chests{
  width:min(94vw,700px);
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:10px;
  padding:0 10px;
}

.chest{
  appearance:none;
  border:none;
  background:transparent;
  width:31%;
  padding:0;
  color:#fff;
  cursor:pointer;
  position:relative;
  transition:transform .18s ease,filter .18s ease;
}

.chest:active{
  transform:scale(.94);
}

.chest.disabled{
  pointer-events:none;
}

.chestWrap{
  position:relative;
  width:100%;
  aspect-ratio:1 / .88;
  animation:chestFloat 1.5s ease-in-out infinite;
}

.chest:nth-child(2) .chestWrap{
  animation-delay:.15s;
}

.chest:nth-child(3) .chestWrap{
  animation-delay:.3s;
}

@keyframes chestFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

/* 箱本体 */

.chestBody{
  position:absolute;
  left:10%;
  bottom:7%;
  width:80%;
  height:48%;
  border-radius:8px 8px 18px 18px;
  background:
    linear-gradient(
      90deg,
      #6e2f07 0%,
      #b75b10 18%,
      #7d3406 50%,
      #bf6618 82%,
      #642905 100%
    );
  border:4px solid #dca62f;
  box-shadow:
    inset 0 0 18px rgba(0,0,0,.5),
    0 12px 22px rgba(0,0,0,.7),
    0 0 20px rgba(255,190,60,.2);
}

/* 箱の蓋 */

.chestLid{
  position:absolute;
  left:7%;
  top:22%;
  width:86%;
  height:34%;
  border-radius:50% 50% 7px 7px;
  background:
    linear-gradient(
      90deg,
      #6b2a05,
      #c36813 25%,
      #813605 55%,
      #c9741a 82%,
      #652705
    );
  border:4px solid #e0ad36;
  transform-origin:50% 100%;
  transition:transform .6s cubic-bezier(.2,.9,.2,1);
  box-shadow:
    inset 0 0 15px rgba(0,0,0,.45),
    0 0 18px rgba(255,184,43,.22);
}

.chestBand{
  position:absolute;
  left:44%;
  top:18%;
  width:12%;
  height:64%;
  background:
    linear-gradient(#ffe27a,#b37b13,#ffdd65);
  border-radius:4px;
  z-index:4;
  box-shadow:0 0 8px rgba(255,220,90,.5);
}

.chestLock{
  position:absolute;
  left:40%;
  bottom:26%;
  width:20%;
  aspect-ratio:1;
  border-radius:6px;
  background:
    linear-gradient(#ffe98a,#a87511);
  border:2px solid #fff1a5;
  z-index:6;
  box-shadow:0 0 10px rgba(255,210,50,.5);
}

.chestNum{
  margin-top:8px;
  font-size:12px;
  font-weight:900;
  letter-spacing:.12em;
  opacity:.75;
}

/* 選択された宝箱 */

.chest.selected .chestWrap{
  animation:chestShake .12s linear infinite;
}

@keyframes chestShake{
  0%{transform:translate(-3px,0) rotate(-1deg)}
  25%{transform:translate(3px,-2px) rotate(1deg)}
  50%{transform:translate(-2px,2px) rotate(-1deg)}
  75%{transform:translate(2px,-1px) rotate(1deg)}
  100%{transform:translate(-3px,0) rotate(-1deg)}
}

.chest.open .chestWrap{
  animation:none;
}

.chest.open .chestLid{
  transform:rotateX(145deg) translateY(-4px);
}

.chest.open{
  transform:scale(1.15);
  filter:brightness(1.35);
}

.chest.dim{
  opacity:.3;
  filter:grayscale(.8);
}

/* 宝箱から出る光 */

.chestLight{
  position:absolute;
  left:26%;
  bottom:26%;
  width:48%;
  height:15%;
  opacity:0;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 20px #fff,
    0 0 50px #ffe66a,
    0 0 100px #ffb300;
  z-index:2;
  transition:opacity .2s;
}

.chest.open .chestLight{
  opacity:1;
  animation:lightBurst .7s ease-out forwards;
}

@keyframes lightBurst{
  from{
    transform:scale(.3);
    opacity:1;
  }
  to{
    transform:scale(4.5);
    opacity:0;
  }
}

/* =========================
   最終結果
========================= */

#prizeBox{
  position:fixed;
  inset:0;
  z-index:180;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  overflow:hidden;
}

#prizeBox.show{
  display:flex;
}

#prizeBox.first{
  background:
    radial-gradient(circle,#fff7a0 0%,#d99b00 25%,#5c2500 60%,#000 100%);
}

#prizeBox.second{
  background:
    radial-gradient(circle,#fff 0%,#a9b2be 28%,#272d35 62%,#000 100%);
}

#prizeBox.third{
  background:
    radial-gradient(circle,#ffd2a8 0%,#b75a22 30%,#4c1e08 62%,#000 100%);
}

#prizeBurst{
  position:absolute;
  width:160vw;
  height:160vw;
  border-radius:50%;
  background:
    repeating-conic-gradient(
      rgba(255,255,255,.22) 0deg 4deg,
      transparent 4deg 11deg
    );
  animation:spin 6s linear infinite;
}

#prizeLabel{
  position:relative;
  z-index:3;
  font-size:clamp(72px,28vw,180px);
  font-weight:1000;
  line-height:1;
  text-align:center;
  text-shadow:
    0 0 12px #fff,
    0 0 40px rgba(255,255,255,.7),
    0 0 90px rgba(255,180,0,.7);
  animation:prizeIn .7s cubic-bezier(.05,1.5,.2,1);
}

#prizeWon{
  position:relative;
  z-index:3;
  margin-top:20px;
  font-size:clamp(20px,6vw,38px);
  font-weight:1000;
  letter-spacing:.15em;
}

@keyframes prizeIn{
  0%{
    transform:scale(.15) rotate(-8deg);
    opacity:0;
    filter:blur(14px);
  }
  70%{
    transform:scale(1.18) rotate(2deg);
    opacity:1;
    filter:blur(0);
  }
  100%{
    transform:scale(1) rotate(0);
  }
}
</style>
</head>

<body>

<div id="stage">
  <div id="test">TEST MODE / 100% HIT</div>
  <div id="number">3</div>
  <button id="start">START</button>
</div>

<div id="black"></div>

<div id="slash">
  <div id="line"></div>
</div>

<div id="flash"></div>

<div id="hit">
  <div id="glow"></div>
  <div id="hitText">当たり</div>
  <div id="subText">CONGRATULATIONS</div>
</div>

<!-- 宝箱 -->
<div id="treasureScreen">

  <div id="treasureTitle">宝箱を1つ選べ！</div>
  <div id="treasureSub">タップして宝箱を開けてください</div>

  <div id="chests">

    <button class="chest" data-chest="1">
      <div class="chestWrap">
        <div class="chestLight"></div>
        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestBand"></div>
        <div class="chestLock"></div>
      </div>
      <div class="chestNum">CHEST 1</div>
    </button>

    <button class="chest" data-chest="2">
      <div class="chestWrap">
        <div class="chestLight"></div>
        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestBand"></div>
        <div class="chestLock"></div>
      </div>
      <div class="chestNum">CHEST 2</div>
    </button>

    <button class="chest" data-chest="3">
      <div class="chestWrap">
        <div class="chestLight"></div>
        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestBand"></div>
        <div class="chestLock"></div>
      </div>
      <div class="chestNum">CHEST 3</div>
    </button>

  </div>

</div>

<!-- 等級結果 -->
<div id="prizeBox">
  <div id="prizeBurst"></div>
  <div id="prizeLabel">3等</div>
  <div id="prizeWon">当選！</div>
  <button id="next">NEXT</button>
</div>

<audio
  id="hitMusic"
  src="./hit_music_final.mp3?v=20260912-400"
  preload="auto"
  playsinline>
</audio>

<script>

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r,ms));

let busy = false;
let chestBusy = false;
let selectedPrize = null;

let audioCtx = null;

let tensionOsc1 = null;
let tensionOsc2 = null;
let tensionGain = null;
let pulseTimer = null;

const hitMusic = $("#hitMusic");


/* =========================
   WebAudio
========================= */

function initAudio(){

  if(!audioCtx){

    audioCtx = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}


/* =========================
   iPhone用 音楽解禁
========================= */

async function unlockHitMusic(){

  try{

    hitMusic.pause();
    hitMusic.currentTime = 0;
    hitMusic.muted = false;
    hitMusic.volume = 0.001;

    await hitMusic.play();

    await sleep(60);

    hitMusic.pause();
    hitMusic.currentTime = 0;
    hitMusic.volume = 1;

  }catch(e){

    console.log("unlock error:",e);
    hitMusic.volume = 1;

  }
}


/* =========================
   緊張音
========================= */

function startTension(){

  initAudio();
  stopTension();

  const now = audioCtx.currentTime;

  tensionGain = audioCtx.createGain();

  tensionGain.gain.setValueAtTime(.0001,now);

  tensionGain.gain.exponentialRampToValueAtTime(
    .08,
    now + .8
  );

  tensionOsc1 = audioCtx.createOscillator();
  tensionOsc2 = audioCtx.createOscillator();

  tensionOsc1.type = "sine";
  tensionOsc2.type = "triangle";

  tensionOsc1.frequency.value = 52;
  tensionOsc2.frequency.value = 78;

  tensionOsc1.connect(tensionGain);
  tensionOsc2.connect(tensionGain);
  tensionGain.connect(audioCtx.destination);

  tensionOsc1.start();
  tensionOsc2.start();

  pulseTimer = setInterval(() => {

    if(!tensionGain) return;

    const t = audioCtx.currentTime;

    tensionGain.gain.cancelScheduledValues(t);

    tensionGain.gain.setValueAtTime(.04,t);

    tensionGain.gain.exponentialRampToValueAtTime(
      .12,
      t + .08
    );

    tensionGain.gain.exponentialRampToValueAtTime(
      .04,
      t + .48
    );

  },650);
}


function stopTension(){

  if(pulseTimer){
    clearInterval(pulseTimer);
    pulseTimer = null;
  }

  try{ tensionOsc1?.stop(); }catch(e){}
  try{ tensionOsc2?.stop(); }catch(e){}

  tensionOsc1 = null;
  tensionOsc2 = null;
  tensionGain = null;
}


/* =========================
   カウント音
========================= */

function countSound(number){

  initAudio();

  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";

  const frequencies = {
    3:115,
    2:98,
    1:80
  };

  osc.frequency.setValueAtTime(
    frequencies[number],
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    45,
    now + .45
  );

  gain.gain.setValueAtTime(.0001,now);

  gain.gain.exponentialRampToValueAtTime(
    .55,
    now + .015
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now + .55
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + .6);
}


/* =========================
   切り裂きSE
========================= */

function slashSound(){

  initAudio();

  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sawtooth";

  osc.frequency.setValueAtTime(1600,now);

  osc.frequency.exponentialRampToValueAtTime(
    170,
    now + .15
  );

  gain.gain.setValueAtTime(.32,now);

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now + .18
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + .2);


  const bass = audioCtx.createOscillator();
  const bassGain = audioCtx.createGain();

  bass.type = "sine";

  bass.frequency.setValueAtTime(95,now);

  bass.frequency.exponentialRampToValueAtTime(
    32,
    now + .5
  );

  bassGain.gain.setValueAtTime(.75,now);

  bassGain.gain.exponentialRampToValueAtTime(
    .0001,
    now + .5
  );

  bass.connect(bassGain);
  bassGain.connect(audioCtx.destination);

  bass.start(now);
  bass.stop(now + .55);
}


/* =========================
   宝箱選択音
========================= */

function chestSelectSound(){

  initAudio();

  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sawtooth";

  osc.frequency.setValueAtTime(170,now);

  osc.frequency.exponentialRampToValueAtTime(
    80,
    now + .55
  );

  gain.gain.setValueAtTime(.2,now);

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now + .6
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + .65);
}


/* =========================
   宝箱開封音
========================= */

function chestOpenSound(){

  initAudio();

  const now = audioCtx.currentTime;

  const osc1 = audioCtx.createOscillator();
  const gain1 = audioCtx.createGain();

  osc1.type = "triangle";

  osc1.frequency.setValueAtTime(250,now);
  osc1.frequency.exponentialRampToValueAtTime(
    900,
    now + .3
  );

  gain1.gain.setValueAtTime(.3,now);

  gain1.gain.exponentialRampToValueAtTime(
    .0001,
    now + .45
  );

  osc1.connect(gain1);
  gain1.connect(audioCtx.destination);

  osc1.start(now);
  osc1.stop(now + .5);


  const osc2 = audioCtx.createOscillator();
  const gain2 = audioCtx.createGain();

  osc2.type = "sine";

  osc2.frequency.setValueAtTime(85,now);

  osc2.frequency.exponentialRampToValueAtTime(
    38,
    now + .5
  );

  gain2.gain.setValueAtTime(.55,now);

  gain2.gain.exponentialRampToValueAtTime(
    .0001,
    now + .55
  );

  osc2.connect(gain2);
  gain2.connect(audioCtx.destination);

  osc2.start(now);
  osc2.stop(now + .6);
}


/* =========================
   当たり曲
========================= */

async function playHitMusic(){

  try{

    hitMusic.pause();
    hitMusic.currentTime = 0;
    hitMusic.muted = false;
    hitMusic.volume = 1;

    await hitMusic.play();

  }catch(e){

    console.log("HIT MUSIC ERROR:",e);

  }
}


/* =========================
   等級抽選

   ★確率はこれで固定★

   1等 10%
   2等 30%
   3等 60%
========================= */

function drawPrize(){

  const r = Math.random();

  if(r < .10){

    return {
      label:"1等",
      className:"first"
    };

  }

  if(r < .40){

    return {
      label:"2等",
      className:"second"
    };

  }

  return {
    label:"3等",
    className:"third"
  };
}


/* =========================
   数字表示
========================= */

function showNumber(n){

  const el = $("#number");

  el.className = "";
  el.textContent = n;

  void el.offsetWidth;

  el.className = "show";

  countSound(n);
}


/* =========================
   フラッシュ
========================= */

function flash(){

  const el = $("#flash");

  el.className = "";

  void el.offsetWidth;

  el.className = "go";
}


/* =========================
   宝箱画面
========================= */

async function showTreasureScreen(){

  /*
    この時点で等級を1回だけ抽選

    宝箱をどれ選んでも
    この結果が出る

    ↓

    だから確率は
    1等10%
    2等30%
    3等60%
    のまま
  */

  selectedPrize = drawPrize();

  chestBusy = false;

  $$(".chest").forEach(chest => {

    chest.classList.remove(
      "selected",
      "open",
      "dim",
      "disabled"
    );

  });

  $("#treasureScreen").className = "show";
}


/* =========================
   宝箱を選ぶ
========================= */

async function chooseChest(chest){

  if(chestBusy) return;

  chestBusy = true;


  /*
    全部タップ不可
  */

  $$(".chest").forEach(c => {
    c.classList.add("disabled");
  });


  /*
    選んだ箱だけ強調
  */

  chest.classList.add("selected");

  $$(".chest").forEach(c => {

    if(c !== chest){
      c.classList.add("dim");
    }

  });


  chestSelectSound();


  /*
    ガタガタ演出
  */

  await sleep(1100);


  chest.classList.remove("selected");


  /*
    一瞬溜め
  */

  await sleep(350);


  /*
    宝箱OPEN
  */

  chest.classList.add("open");

  chestOpenSound();


  await sleep(350);


  /*
    強フラッシュ
  */

  flash();


  await sleep(550);


  /*
    等級表示
  */

  showPrizeResult();
}


/* =========================
   最終結果
========================= */

function showPrizeResult(){

  $("#treasureScreen").className = "";

  const prizeBox = $("#prizeBox");

  prizeBox.className =
    "show " + selectedPrize.className;

  $("#prizeLabel").textContent =
    selectedPrize.label;

  $("#prizeWon").textContent =
    "当選！";

  flash();
}


/* =========================
   当たり
========================= */

async function showHit(){

  $("#hit").className = "show";

  playHitMusic();


  /*
    当たり画面を見せる
  */

  await sleep(2200);


  /*
    宝箱へ
  */

  $("#hit").className = "";

  await showTreasureScreen();
}


/* =========================
   切り裂き
========================= */

async function slashHit(){

  stopTension();

  await sleep(180);

  slashSound();

  $("#slash").className = "go";

  await sleep(170);

  flash();

  await sleep(300);

  $("#slash").className = "";

  await showHit();
}


/* =========================
   暗転
========================= */

async function blackoutHit(){

  stopTension();

  $("#black").style.display = "block";

  await sleep(1300);

  $("#black").style.display = "none";

  await slashHit();
}


/* =========================
   復活
========================= */

async function revivalHit(){

  $("#number").textContent = "";

  await sleep(1200);

  stopTension();

  $("#black").style.display = "block";

  await sleep(900);

  $("#black").style.display = "none";

  await slashHit();
}


/* =========================
   START
========================= */

async function play(){

  if(busy) return;

  busy = true;


  initAudio();

  await unlockHitMusic();


  $("#start").style.display = "none";


  startTension();


  /*
    今はテスト用なので
    毎回100%当たり

    0 = 3途中
    1 = 2途中
    2 = 1途中
    3 = 1後
    4 = 暗転
    5 = 復活
  */

  const pattern =
    Math.floor(Math.random() * 6);


  /* 3 */

  showNumber(3);

  if(pattern === 0){

    await sleep(1450);

    await slashHit();

    return;
  }

  await sleep(2100);


  /* 2 */

  showNumber(2);

  if(pattern === 1){

    await sleep(1550);

    await slashHit();

    return;
  }

  await sleep(2250);


  /* 1 */

  showNumber(1);

  if(pattern === 2){

    await sleep(1750);

    await slashHit();

    return;
  }

  await sleep(2450);


  $("#number").textContent = "";


  if(pattern === 3){

    await sleep(700);

    await slashHit();

  }

  else if(pattern === 4){

    await blackoutHit();

  }

  else{

    await revivalHit();

  }

}


/* =========================
   RESET
========================= */

function reset(){

  stopTension();


  hitMusic.pause();

  try{
    hitMusic.currentTime = 0;
  }catch(e){}


  selectedPrize = null;
  chestBusy = false;


  $("#hit").className = "";
  $("#treasureScreen").className = "";
  $("#prizeBox").className = "";

  $("#slash").className = "";

  $("#black").style.display = "none";


  $$(".chest").forEach(chest => {

    chest.classList.remove(
      "selected",
      "open",
      "dim",
      "disabled"
    );

  });


  $("#number").textContent = "3";
  $("#number").className = "";


  $("#start").style.display = "block";


  busy = false;
}


/* =========================
   ボタン
========================= */

$("#start").addEventListener(
  "click",
  play
);


$$(".chest").forEach(chest => {

  chest.addEventListener(
    "click",
    () => chooseChest(chest)
  );

});


$("#next").addEventListener(
  "click",
  reset
);

</script>

</body>
</html>
