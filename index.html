<head>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;

/* =========================
   BACKGROUND
========================= */

#stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  background:
    linear-gradient(rgba(0,0,0,.06),rgba(0,0,0,.12)),
    url("./9E28B31B-C619-4F41-AB55-91C025168D02.png");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

#stage::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:1;
  pointer-events:none;

  background:
    radial-gradient(
      circle at 50% 58%,
      transparent 0%,
      rgba(0,0,0,.03) 45%,
      rgba(0,0,0,.22) 100%
    );
}

/* =========================
   NUMBER
========================= */

#number{
  position:absolute;
  z-index:20;

  left:50%;
  top:57%;

  transform:translate(-50%,-50%);

  font-family:
    "Arial Rounded MT Bold",
    "Arial Black",
    sans-serif;

  font-size:min(64vw,390px);
  font-weight:1000;
  line-height:.8;

  color:#fff7fc;

  -webkit-text-stroke:
    3px rgba(255,205,235,.95);

  text-shadow:
    0 3px 0 #e950a0,
    0 6px 0 #a70a5c,
    0 9px 3px rgba(70,0,35,.65),
    0 0 8px #fff,
    0 0 18px #fff,
    0 0 35px #ff8dca,
    0 0 65px #ff198d,
    0 0 105px rgba(255,0,120,.9);

  filter:
    drop-shadow(0 15px 12px rgba(50,0,25,.5));

  transition:
    color .15s,
    opacity .15s,
    filter .15s,
    text-shadow .15s;
}

#number::after{
  content:"";
}

#number.pop{
  animation:numberPop .42s cubic-bezier(.12,1.3,.3,1);
}

@keyframes numberPop{
  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(1.35);
    filter:
      blur(7px)
      brightness(2);
  }

  65%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(.95);
  }

  100%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1);
  }
}

#number.red{
  color:#fff0f0;
  -webkit-text-stroke:3px #ff5959;

  text-shadow:
    0 3px 0 #ff2020,
    0 7px 0 #840000,
    0 0 12px #fff,
    0 0 35px #ff2020,
    0 0 85px #ff0000;
}

#number.gold{
  color:#fff9c5;
  -webkit-text-stroke:3px #ffe56a;

  text-shadow:
    0 3px 0 #e9a900,
    0 7px 0 #855400,
    0 0 12px #fff,
    0 0 30px #fff38a,
    0 0 70px #ffc400,
    0 0 110px #ff9d00;
}

#number.small{

}

#number.big{

}

========================= */

#startInfo{

  right:0;

  letter-spacing:.08em;
}

#independent{

}

#start{

  letter-spacing:.18em;
}

#start:active{

/* =========================
   BLACK / FLASH
========================= */

#black{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:#000;
}

#flash{
  position:fixed;
  inset:0;
  z-index:300;

  pointer-events:none;

  background:#fff;
  opacity:0;
}

#flash.go{
  animation:flash .5s ease-out;
}

@keyframes flash{
  0%{opacity:0}
  8%{opacity:1}
  22%{opacity:.25}
  32%{opacity:1}
  100%{opacity:0}
}

/* =========================
   SLASH
========================= */

#slash{
  position:fixed;
  inset:0;
  z-index:200;
  display:none;
  overflow:hidden;
  pointer-events:none;
}

#slash.go{
  display:block;
}

#slashLine{
  position:absolute;

  left:-30%;
  top:50%;

  width:160%;
  height:9px;

  transform:
    rotate(-18deg)
    scaleX(0);

  background:#fff;

  box-shadow:
    0 0 8px #fff,
    0 0 20px #fff,
    0 0 45px #ff6eb7,
    0 0 100px #ff007c;
}

#slash.go #slashLine{
  animation:slash .2s ease-out forwards;
}

#slash.reverse #slashLine{
  transform:
    rotate(18deg)
    scaleX(0);

  animation:slashReverse .2s ease-out forwards;
}

@keyframes slash{
  to{
    transform:
      rotate(-18deg)
      scaleX(1);
  }
}

@keyframes slashReverse{
  to{
    transform:
      rotate(18deg)
      scaleX(1);
  }
}

/* =========================
   HIT
========================= */

#hit{
  position:fixed;
  inset:0;
  z-index:250;

  display:none;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  overflow:hidden;

      #e50078 25%,
      #65002f 58%,

}

#hit.show{

}

#hitGlow{

  width:150vw;
  height:150vw;

  border-radius:50%;

  background:
    repeating-conic-gradient(
      rgba(255,255,255,.25) 0deg 3deg,
      transparent 3deg 10deg
    );

  animation:spin 5s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

#hitMain{
  position:relative;
  z-index:2;

  font-size:clamp(65px,23vw,150px);
  font-weight:1000;

  text-shadow:
    0 0 10px #fff,
    0 0 25px #fff,
    0 0 60px #ff70b7,
    0 0 110px #ff0076;

  animation:hitIn .55s cubic-bezier(.1,1.5,.25,1);
}

#hitSub{
  position:relative;
  z-index:2;

  margin-top:15px;

  font-size:15px;
  font-weight:1000;
  letter-spacing:.18em;
}

@keyframes hitIn{
  0%{
    opacity:0;
    transform:scale(.2);
  }

  75%{
    opacity:1;
    transform:scale(1.15);
  }

  100%{
    transform:scale(1);

<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r,ms));

let busy = false;
let chestBusy = false;

let selectedPrize = null;
let chestResults = [];

let audioCtx = null;
let tensionOsc1 = null;
let tensionOsc2 = null;
let tensionOsc3 = null;
let tensionOsc4 = null;
let tensionGain = null;
let tensionCompressor = null;
let pulseTimer = null;
let tensionLevel = 1;

const hitMusic = $("#hitMusic");

/* =========================
   AUDIO
========================= */

function initAudio(){

  if(!audioCtx){
    audioCtx = new(
      window.AudioContext ||
      window.webkitAudioContext
    )();
  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}

async function unlockHitMusic(){

  try{
    hitMusic.pause();
    hitMusic.currentTime = 0;
    hitMusic.muted = false;
    hitMusic.volume = .001;

    await hitMusic.play();
    await sleep(60);

    hitMusic.pause();
    hitMusic.currentTime = 0;
    hitMusic.volume = 1;
  }
  catch(e){
    hitMusic.volume = 1;
  }
}

function startTension(){

  initAudio();
  stopTension();

  tensionLevel = 1;

  tensionGain =
    audioCtx.createGain();

  tensionCompressor =
    audioCtx.createDynamicsCompressor();

  tensionCompressor.threshold.value = -14;
  tensionCompressor.knee.value = 12;
  tensionCompressor.ratio.value = 5;
  tensionCompressor.attack.value = .005;
  tensionCompressor.release.value = .18;

  tensionOsc1 =
    audioCtx.createOscillator();

  tensionOsc2 =
    audioCtx.createOscillator();

  tensionOsc3 =
    audioCtx.createOscillator();

  tensionOsc4 =
    audioCtx.createOscillator();

  tensionOsc1.type = "sine";
  tensionOsc2.type = "triangle";
  tensionOsc3.type = "sawtooth";
  tensionOsc4.type = "triangle";

  tensionOsc1.frequency.value = 92;
  tensionOsc2.frequency.value = 184;
  tensionOsc3.frequency.value = 276;
  tensionOsc4.frequency.value = 368;

  const g1 = audioCtx.createGain();
  const g2 = audioCtx.createGain();
  const g3 = audioCtx.createGain();
  const g4 = audioCtx.createGain();

  g1.gain.value = .72;
  g2.gain.value = .34;
  g3.gain.value = .055;
  g4.gain.value = .035;

  tensionOsc1.connect(g1);
  tensionOsc2.connect(g2);
  tensionOsc3.connect(g3);
  tensionOsc4.connect(g4);

  g1.connect(tensionGain);
  g2.connect(tensionGain);
  g3.connect(tensionGain);
  g4.connect(tensionGain);

  tensionGain.connect(tensionCompressor);
  tensionCompressor.connect(audioCtx.destination);

  tensionOsc1.start();
  tensionOsc2.start();
  tensionOsc3.start();
  tensionOsc4.start();

  startPulse();
}

function startPulse(){

  if(pulseTimer){
    clearTimeout(pulseTimer);
  }

  function pulse(){

    if(!tensionGain){
      return;
    }

    const t = audioCtx.currentTime;

    let base = .12;
    let peak = .34;
    let speed = 620;

    if(tensionLevel === 2){
      base = .14;
      peak = .40;
      speed = 500;
    }

    if(tensionLevel === 3){
      base = .16;
      peak = .48;
      speed = 390;
    }

    tensionGain.gain.cancelScheduledValues(t);
    tensionGain.gain.setValueAtTime(base,t);

    tensionGain.gain.exponentialRampToValueAtTime(
      peak,
      t + .045
    );

    tensionGain.gain.exponentialRampToValueAtTime(
      base,
      t + .25
    );

    pulseTimer =
      setTimeout(pulse,speed);
  }

  pulse();
}

function raiseTension(level){

  tensionLevel = level;

  if(!audioCtx){
    return;
  }

  const t = audioCtx.currentTime;

  try{

    if(level === 1){
      tensionOsc1?.frequency.linearRampToValueAtTime(92,t+.3);
      tensionOsc2?.frequency.linearRampToValueAtTime(184,t+.3);
    }

    if(level === 2){
      tensionOsc1?.frequency.linearRampToValueAtTime(104,t+.3);
      tensionOsc2?.frequency.linearRampToValueAtTime(208,t+.3);
    }

    if(level === 3){
      tensionOsc1?.frequency.linearRampToValueAtTime(118,t+.3);
      tensionOsc2?.frequency.linearRampToValueAtTime(236,t+.3);
    }

  }catch(e){}
}

function stopTension(){

  if(pulseTimer){
    clearTimeout(pulseTimer);
    pulseTimer = null;
  }

  try{ tensionOsc1?.stop(); }catch(e){}
  try{ tensionOsc2?.stop(); }catch(e){}
  try{ tensionOsc3?.stop(); }catch(e){}
  try{ tensionOsc4?.stop(); }catch(e){}

  tensionOsc1 = null;
  tensionOsc2 = null;
  tensionOsc3 = null;
  tensionOsc4 = null;
  tensionGain = null;
  tensionCompressor = null;
}

function countSound(n){

  initAudio();

  const now = audioCtx.currentTime;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  const freq = {
    3:160,
    2:145,
    1:128,
    0:110
  };

  osc.type = "triangle";

  osc.frequency.setValueAtTime(
    freq[n] || 140,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    65,
    now+.45
  );

  gain.gain.setValueAtTime(.0001,now);
  gain.gain.exponentialRampToValueAtTime(.72,now+.012);
  gain.gain.exponentialRampToValueAtTime(.0001,now+.52);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+.55);
}

function puchunSound(){

  initAudio();

  const now = audioCtx.currentTime;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type = "square";

  osc.frequency.setValueAtTime(330,now);
  osc.frequency.exponentialRampToValueAtTime(32,now+.12);

  gain.gain.setValueAtTime(.5,now);
  gain.gain.exponentialRampToValueAtTime(.0001,now+.13);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+.14);
}

function slashSound(){

  initAudio();

  const now = audioCtx.currentTime;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type = "sawtooth";

  osc.frequency.setValueAtTime(1800,now);
  osc.frequency.exponentialRampToValueAtTime(180,now+.15);

  gain.gain.setValueAtTime(.45,now);
  gain.gain.exponentialRampToValueAtTime(.0001,now+.18);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+.2);

  const bass =
    audioCtx.createOscillator();

  const bg =
    audioCtx.createGain();

  bass.type = "triangle";

  bass.frequency.setValueAtTime(120,now);
  bass.frequency.exponentialRampToValueAtTime(42,now+.5);

  bg.gain.setValueAtTime(.9,now);
  bg.gain.exponentialRampToValueAtTime(.0001,now+.5);

  bass.connect(bg);
  bg.connect(audioCtx.destination);

  bass.start(now);
  bass.stop(now+.55);
}

function chestOpenSound(){

  initAudio();

  const now = audioCtx.currentTime;

  const osc =
    audioCtx.createOscillator();

  const gain =

  osc.type = "triangle";

}

/*
  選んだ箱 = 抽選された等級

  残り2箱 = 残り2等級

  残りの左右配置は
  毎回ランダム
*/

function buildChestResults(selectedIndex){

  const all = [
    "1等",
    "2等",
    "3等"
  ];

  const remaining =
    all.filter(
      x => x !== selectedPrize.label
    );

  if(Math.random() < .5){
    remaining.reverse();
  }

  chestResults =
    new Array(3);

  chestResults[selectedIndex] =
    selectedPrize.label;

  const others =
    [0,1,2].filter(
      i => i !== selectedIndex
    );

  chestResults[others[0]] =
    remaining[0];

  chestResults[others[1]] =
    remaining[1];
}

function showTreasure(){

  selectedPrize =
    drawPrize();

  chestBusy = false;

  chestResults = [];

  $("#treasureTitle").textContent =
    "運命の宝箱を選べ！";

  $("#treasureSub").textContent =
    "この一箱が、結果を決める。";

  $("#next").style.display =
    "none";

  $$(".chest").forEach(chest=>{

    chest.classList.remove(
      "selected",
      "open",
      "dim",
      "disabled"
    );

    const result =
      chest.querySelector(".chestResult");

    result.textContent = "";
    result.className = "chestResult";
  });

  $("#treasure").className =
    "show";
}

function showChestResult(chest,label){

async function chooseChest(chest){

  if(chestBusy){
    return;
  }

  chestBusy = true;

  const chests = $$(".chest");

  const selectedIndex =
    chests.indexOf(chest);

  buildChestResults(selectedIndex);

  chests.forEach(c=>{

    c.classList.add("disabled");

    if(c !== chest){
      c.classList.add("dim");
    }
  });

  chest.classList.add("selected");

  await sleep(1000);

  chest.classList.remove("selected");
  chest.classList.add("open");

  chestOpenSound();

  doFlash();

  showChestResult(
    chest,
    selectedPrize.label
  );

  await sleep(750);

  await showSelectedPrize();

  await sleep(300);

  $("#treasureTitle").textContent =
    "残りの宝箱は…";

  $("#treasureSub").textContent =
    "選ばなかった箱もオープン";

  chests.forEach(
    c => c.classList.remove("dim")
  );

  let others =
    chests
      .map((c,i)=>({
        chest:c,
        index:i
      }))
      .filter(
        x => x.index !== selectedIndex
      );

  /*
    箱を開く順番もランダム
  */

  if(Math.random() < .5){
    others.reverse();
  }

  await sleep(500);

  for(const item of others){

    item.chest.classList.add("open");

    chestOpenSound();

    doFlash();

    showChestResult(
      item.chest,
      chestResults[item.index]
    );

    await sleep(950);
  }

  $("#treasureTitle").textContent =
    selectedPrize.label +
    " 当選！";

  $("#treasureSub").textContent =
    "3つの宝箱の結果";

  $("#next").style.display =
    "block";
}

  $("#start").style.display =
    "none";

  $("#startInfo").style.display =
    "none";

  initAudio();

  await unlockHitMusic();

  startTension();

  /*
    STARTを押すたび
    ここで1回だけ抽選。

    前回の結果や
    演出は一切関係なし。
  */

  const win =
    Math.random() < (1 / 30);

  if(!win){

    await normalMiss();

    return;
  }

  /*
    1/30に当選した後に
    27演出から選択。

    演出選択は
    当選確率に影響しない。
  */

  await runRandomHit();
}

/* =========================
   RESET
========================= */

function reset(){

  stopTension();

  hitMusic.pause();

  try{
    hitMusic.currentTime = 0;
  }catch(e){}

  $("#hit").className = "";
  $("#treasureIntro").className = "";
  $("#treasure").className = "";
  $("#prize").className = "";
  $("#slash").className = "";

  $("#black").style.display =
    "none";

  $("#next").style.display =
    "none";

  resetNumberStyle();

  $("#number").textContent =
    "3";

  $$(".chest").forEach(c=>{

    c.classList.remove(
      "selected",
      "open",
      "dim",
      "disabled"
    );

    const result =
      c.querySelector(".chestResult");

    result.textContent = "";
    result.className = "chestResult";
  });

  selectedPrize = null;
  chestResults = [];

  chestBusy = false;
  busy = false;

  $("#startInfo").style.display =
    "block";

  $("#start").style.display =
    "block";
}

/* =========================
   EVENTS
========================= */

$("#start").addEventListener(
  "click",
  productionPlay
);

$$(".chest").forEach(chest=>{

  chest.addEventListener(
    "click",
    ()=>chooseChest(chest)
  );
});

$("#next").addEventListener(
  "click",
  reset
);
</script>
