<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>COUNTDOWN LOTTERY</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#120008;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

/* =========================
   BACKGROUND
========================= */

#bg{
  position:fixed;
  inset:0;
  z-index:0;

  background-color:#120008;

  background-image:
    url("./9E28B31B-C619-4F41-AB55-91C025168D02.png");

  background-size:auto 100%;
  background-position:center top;
  background-repeat:no-repeat;
}

#shade{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;

  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.02),
      rgba(0,0,0,.05) 45%,
      rgba(0,0,0,.16)
    );
}

/* =========================
   GAME
========================= */

#game{
  position:fixed;
  inset:0;
  z-index:10;
}

/* =========================
   START
========================= */

#startScreen{
  position:absolute;
  inset:0;
  z-index:30;

  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;

  padding-bottom:max(8vh,55px);
}

#startInfo{
  text-align:center;
  margin-bottom:18px;

  font-weight:900;
  letter-spacing:.14em;

  text-shadow:
    0 3px 7px rgba(0,0,0,.85);
}

#startInfo .main{
  font-size:18px;
}

#startInfo .sub{
  margin-top:5px;
  font-size:11px;
  opacity:.85;
}

#startButton{
  width:min(78vw,330px);
  height:72px;

  border:2px solid rgba(255,255,255,.9);
  border-radius:18px;

  color:#fff;

  font-size:27px;
  font-weight:1000;
  letter-spacing:.16em;

  background:
    linear-gradient(
      180deg,
      rgba(255,105,178,.97),
      rgba(218,0,99,.97)
    );

  box-shadow:
    0 7px 0 #790037,
    0 12px 25px rgba(0,0,0,.5),
    inset 0 2px 0 rgba(255,255,255,.45);
}

#startButton:active{
  transform:translateY(4px);

  box-shadow:
    0 3px 0 #790037,
    0 8px 18px rgba(0,0,0,.5);
}

/* =========================
   NUMBER
========================= */

#number{
  position:absolute;

  left:50%;
  top:61%;

  transform:translate(-50%,-50%);

  z-index:20;

  font-size:min(45vw,220px);
  line-height:.8;

  font-weight:1000;

  font-family:
    Impact,
    "Arial Black",
    sans-serif;

  color:#fff7fb;

  -webkit-text-stroke:
    clamp(4px,1.4vw,8px)
    #ff4b9d;

  text-shadow:
    0 5px 0 #d82779,
    0 10px 0 #a80052,
    0 15px 7px rgba(60,0,28,.72);

  opacity:0;

  pointer-events:none;
  user-select:none;
}

#number.show{
  opacity:1;
  animation:numberIn .16s ease-out;
}

@keyframes numberIn{
  0%{
    transform:
      translate(-50%,-50%)
      scale(.88);
  }

  100%{
    transform:
      translate(-50%,-50%)
      scale(1);
  }
}

#number.red{
  color:#fff0f3;

  -webkit-text-stroke:7px #ff153e;

  text-shadow:
    0 5px 0 #d00029,
    0 10px 0 #830016,
    0 15px 7px rgba(0,0,0,.7);
}

#number.gold{
  color:#fffde6;

  -webkit-text-stroke:7px #ffd200;

  text-shadow:
    0 5px 0 #e59b00,
    0 10px 0 #9c5900,
    0 15px 7px rgba(0,0,0,.7);
}

#number.small{
  transform:
    translate(-50%,-50%)
    scale(.76);
}

/* =========================
   MESSAGE
========================= */

#message{
  position:absolute;

  left:50%;
  top:74%;

  transform:translateX(-50%);

  z-index:21;

  width:100%;

  text-align:center;

  font-size:25px;
  font-weight:1000;

  text-shadow:
    0 3px 8px #000;

  pointer-events:none;
}

/* =========================
   BLACKOUT
========================= */

#blackout{
  position:fixed;
  inset:0;

  z-index:50;

  background:#000;

  opacity:0;

  pointer-events:none;

  transition:opacity .06s linear;
}

#blackout.on{
  opacity:1;
}

/* =========================
   FLASH
========================= */

#flash{
  position:fixed;
  inset:0;

  z-index:70;

  background:#fff;

  opacity:0;

  pointer-events:none;
}

#flash.on{
  animation:flashAnim .30s ease-out;
}

@keyframes flashAnim{
  0%{
    opacity:1;
  }

  100%{
    opacity:0;
  }
}

/* =========================
   SLASH
========================= */

#slashLayer{
  position:fixed;
  inset:0;

  z-index:65;

  overflow:hidden;

  pointer-events:none;
}

.slash{
  position:absolute;

  left:-35vw;
  top:50%;

  width:170vw;
  height:12px;

  transform-origin:center;

  background:#fff;

  box-shadow:
    0 0 7px #fff,
    0 0 18px #ff3b96,
    0 0 40px #ff006e;

  animation:
    slashGo .38s
    cubic-bezier(.1,.8,.2,1)
    forwards;
}

.slash.two{
  animation:
    slashGo2 .38s
    cubic-bezier(.1,.8,.2,1)
    forwards;
}

@keyframes slashGo{
  0%{
    opacity:0;

    transform:
      translateY(-50%)
      rotate(-25deg)
      scaleX(0);
  }

  20%{
    opacity:1;
  }

  55%{
    transform:
      translateY(-50%)
      rotate(-25deg)
      scaleX(1);
  }

  100%{
    opacity:0;

    transform:
      translateY(-50%)
      rotate(-25deg)
      scaleX(1);
  }
}

@keyframes slashGo2{
  0%{
    opacity:0;

    transform:
      translateY(-50%)
      rotate(24deg)
      scaleX(0);
  }

  20%{
    opacity:1;
  }

  55%{
    transform:
      translateY(-50%)
      rotate(24deg)
      scaleX(1);
  }

  100%{
    opacity:0;

    transform:
      translateY(-50%)
      rotate(24deg)
      scaleX(1);
  }
}

/* =========================
   HIT
========================= */

#hitText{
  position:fixed;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    scale(.4);

  z-index:80;

  font-size:min(22vw,110px);

  white-space:nowrap;

  font-weight:1000;

  font-family:
    Impact,
    "Arial Black",
    sans-serif;

  color:#fff;

  -webkit-text-stroke:5px #ff2486;

  text-shadow:
    0 5px 0 #d00064,
    0 10px 0 #780032,
    0 0 25px #ff1680;

  opacity:0;

  pointer-events:none;
}

#hitText.on{
  animation:
    hitPop .7s
    cubic-bezier(.12,.8,.15,1)
    forwards;
}

@keyframes hitPop{
  0%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.3);
  }

  35%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1.18);
  }

  55%{
    transform:
      translate(-50%,-50%)
      scale(.96);
  }

  100%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }
}

/* =========================
   TREASURE
========================= */

#treasureScreen{
  position:fixed;
  inset:0;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  padding:30px 14px;

  background:
    radial-gradient(
      circle at 50% 38%,
      rgba(255,20,130,.42),
      rgba(28,0,16,.92) 55%,
      rgba(0,0,0,.97)
    );
}

#treasureScreen.show{
  display:flex;
}

#treasureIntro{
  font-size:14px;
  font-weight:800;
  letter-spacing:.12em;

  margin-bottom:8px;
}

#treasureTitle{
  text-align:center;

  font-size:27px;
  font-weight:1000;

  text-shadow:
    0 0 15px #ff1680;
}

#treasureSub{
  margin-top:8px;

  font-size:13px;

  opacity:.88;

  text-align:center;
}

#chests{
  width:100%;
  max-width:500px;

  display:flex;

  justify-content:center;
  align-items:flex-end;

  gap:8px;

  margin-top:42px;
}

.chestWrap{
  flex:1;

  max-width:150px;
  min-width:0;

  text-align:center;
}

.chest{
  position:relative;

  width:100%;

  aspect-ratio:1.08 / 1;

  cursor:pointer;

  transform-origin:center bottom;
}

.chestLid{
  position:absolute;

  left:7%;
  top:16%;

  width:86%;
  height:34%;

  border-radius:
    18px 18px 7px 7px;

  background:
    linear-gradient(
      180deg,
      #ffdd79 0%,
      #d78a17 20%,
      #754008 22%,
      #b85b16 40%,
      #6f2b08 100%
    );

  border:3px solid #ffd96b;

  box-shadow:
    inset 0 4px 4px rgba(255,255,255,.3),
    0 5px 8px rgba(0,0,0,.5);

  transform-origin:center bottom;

  transition:transform .45s ease;
}

.chestBody{
  position:absolute;

  left:7%;
  bottom:7%;

  width:86%;
  height:52%;

  border-radius:
    5px 5px 14px 14px;

  background:
    linear-gradient(
      90deg,
      #5f2107,
      #c26a1c 22%,
      #7b2b08 50%,
      #c36c1d 77%,
      #5d2007
    );

  border:3px solid #ffc94f;

  box-shadow:
    inset 0 0 12px rgba(0,0,0,.6),
    0 8px 14px rgba(0,0,0,.6);
}

.chestLock{
  position:absolute;

  left:50%;
  top:43%;

  transform:translateX(-50%);

  width:25%;
  height:30%;

  border-radius:5px;

  background:
    linear-gradient(
      #fff1a3,
      #d49315
    );

  border:2px solid #704000;

  z-index:3;
}

.chest.open .chestLid{
  transform:
    translateY(-24%)
    rotateX(72deg);
}

.chest.shake{
  animation:chestShake .48s linear;
}

@keyframes chestShake{
  0%,100%{
    transform:translateX(0) rotate(0);
  }

  20%{
    transform:translateX(-6px) rotate(-3deg);
  }

  40%{
    transform:translateX(6px) rotate(3deg);
  }

  60%{
    transform:translateX(-5px) rotate(-2deg);
  }

  80%{
    transform:translateX(5px) rotate(2deg);
  }
}

.rankLabel{
  margin-top:9px;

  min-height:29px;

  font-size:22px;
  font-weight:1000;

  opacity:0;
}

.rankLabel.show{
  opacity:1;
}

.rank1{
  color:#ffe36b;

  text-shadow:
    0 0 12px #ffb300;
}

.rank2{
  color:#f4f4f4;

  text-shadow:
    0 0 10px #aab6c7;
}

.rank3{
  color:#ff9c4a;

  text-shadow:
    0 0 10px #c94d00;
}

/* =========================
   RANK RESULT
========================= */

#rankResult{
  position:fixed;
  inset:0;

  z-index:130;

  display:none;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:rgba(0,0,0,.77);
}

#rankResult.show{
  display:flex;
}

#rankBig{
  font-size:min(24vw,120px);

  font-weight:1000;

  line-height:1;

  text-align:center;
}

#rankWin{
  margin-top:15px;

  font-size:31px;
  font-weight:1000;
}

#nextButton{
  display:none;

  margin-top:32px;

  width:min(72vw,300px);
  height:60px;

  border:2px solid #fff;
  border-radius:16px;

  color:#fff;

  background:
    linear-gradient(
      #ff5fa8,
      #bc0055
    );

  font-size:22px;
  font-weight:1000;

  letter-spacing:.12em;
}
</style>
</head>

<body>

<div id="bg"></div>
<div id="shade"></div>

<div id="game">

  <div id="startScreen">

    <div id="startInfo">

      <div class="main">
        完全抽選 1/30
      </div>

      <div class="sub">
        毎回独立抽選
      </div>

    </div>

    <button id="startButton">
      START
    </button>

  </div>

  <div id="number"></div>

  <div id="message"></div>

</div>


<div id="slashLayer"></div>

<div id="blackout"></div>

<div id="flash"></div>


<div id="hitText">
  当たり
</div>


<div id="treasureScreen">

  <div id="treasureIntro">
    ここからが本番。
  </div>

  <div id="treasureTitle">
    運命の宝箱を選べ！
  </div>

  <div id="treasureSub">
    この一箱が、結果を決める。
  </div>


  <div id="chests">

    <div class="chestWrap">

      <div class="chest" data-index="0">
        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestLock"></div>
      </div>

      <div class="rankLabel"></div>

    </div>


    <div class="chestWrap">

      <div class="chest" data-index="1">
        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestLock"></div>
      </div>

      <div class="rankLabel"></div>

    </div>


    <div class="chestWrap">

      <div class="chest" data-index="2">
        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestLock"></div>
      </div>

      <div class="rankLabel"></div>

    </div>

  </div>


  <button id="nextButton">
    NEXT
  </button>

</div>


<div id="rankResult">

  <div id="rankBig"></div>

  <div id="rankWin">
    当選！
  </div>

</div>


<!-- カウントダウンBGM -->
<audio
  id="tensionMusic"
  src="./Tension.mp3"
  preload="auto"
  loop
  playsinline>
</audio>


<!-- 本当の当たり専用 -->
<audio
  id="hitMusic"
  src="./hit_music_final.mp3"
  preload="auto"
  playsinline>
</audio>


<script>

/* =========================
   BASIC
========================= */

const sleep =
  ms => new Promise(
    resolve =>
      setTimeout(resolve,ms)
  );


const number =
  document.getElementById("number");

const message =
  document.getElementById("message");

const startScreen =
  document.getElementById("startScreen");

const startButton =
  document.getElementById("startButton");

const blackout =
  document.getElementById("blackout");

const flash =
  document.getElementById("flash");

const hitText =
  document.getElementById("hitText");

const tensionMusic =
  document.getElementById("tensionMusic");

const hitMusic =
  document.getElementById("hitMusic");

const treasureScreen =
  document.getElementById("treasureScreen");

const treasureTitle =
  document.getElementById("treasureTitle");

const treasureSub =
  document.getElementById("treasureSub");

const nextButton =
  document.getElementById("nextButton");

const rankResult =
  document.getElementById("rankResult");

const rankBig =
  document.getElementById("rankBig");


let playing=false;

let selectedRank=null;

let chestRanks=[];

let treasureLocked=false;


/* =========================
   MUSIC
========================= */

function startTension(){

  try{

    tensionMusic.pause();

    tensionMusic.currentTime=0;

    tensionMusic.volume=.72;


    const p =
      tensionMusic.play();


    if(
      p &&
      typeof p.catch==="function"
    ){
      p.catch(()=>{});
    }

  }catch(e){}

}


function stopTension(
  reset=true
){

  try{

    tensionMusic.pause();


    if(reset){
      tensionMusic.currentTime=0;
    }

  }catch(e){}

}


async function fadeTension(
  duration=600
){

  const steps=12;

  const startVolume=
    tensionMusic.volume;


  for(
    let i=0;
    i<steps;
    i++
  ){

    tensionMusic.volume =
      Math.max(
        0,
        startVolume *
        (1-(i+1)/steps)
      );


    await sleep(
      duration/steps
    );

  }


  stopTension(true);


  tensionMusic.volume=.72;

}


/*
  ★この関数は本当の当たりからしか
  呼ばない
*/

function playHitMusic(){

  try{

    hitMusic.pause();

    hitMusic.currentTime=0;

    hitMusic.volume=1;


    const p =
      hitMusic.play();


    if(
      p &&
      typeof p.catch==="function"
    ){
      p.catch(()=>{});
    }

  }catch(e){}

}


/* =========================
   NUMBER
========================= */

function clearNumberStyle(){

  number.classList.remove(
    "red",
    "gold",
    "small"
  );

}


function showNumber(n){

  clearNumberStyle();

  number.textContent=n;

  number.classList.remove("show");

  void number.offsetWidth;

  number.classList.add("show");

}


function hideNumber(){

  number.classList.remove("show");

}


/* =========================
   NORMAL COUNT
========================= */

async function normalCount(){

  showNumber(3);

  await sleep(1850);


  showNumber(2);

  await sleep(2050);


  showNumber(1);

  await sleep(2250);

}


/* =========================
   FLASH
========================= */

function doFlash(){

  flash.classList.remove("on");

  void flash.offsetWidth;

  flash.classList.add("on");

}


/* =========================
   SLASH

   斬撃そのものは無音。
   当たり曲と役割を分ける。
========================= */

function slash(
  fake=false,
  double=false
){

  const layer =
    document.getElementById(
      "slashLayer"
    );


  const s =
    document.createElement("div");


  s.className="slash";

  layer.appendChild(s);


  if(double){

    setTimeout(()=>{

      const s2 =
        document.createElement("div");

      s2.className="slash two";

      layer.appendChild(s2);


      setTimeout(()=>{

        s2.remove();

      },600);

    },110);

  }


  if(!fake){

    doFlash();

  }


  setTimeout(()=>{

    s.remove();

  },600);

}


/* =========================
   REAL HIT

   Tension停止
   ↓
   無音
   ↓
   斬撃
   ↓
   当たり曲
========================= */

async function HIT(
  options={}
){

  hideNumber();

  message.textContent="";


  /*
    ★ここで緊張BGMを即停止
  */

  stopTension(true);


  /*
    当たり前の「間」
  */

  await sleep(
    options.silence || 350
  );


  /*
    斬撃
  */

  slash(
    false,
    !!options.doubleSlash
  );


  await sleep(160);


  /*
    当たり表示
  */

  hitText.classList.remove("on");

  void hitText.offsetWidth;

  hitText.classList.add("on");


  /*
    ★★★★★★★★★★★★★★★
       本物の当たりだけ
       当たり曲を再生
    ★★★★★★★★★★★★★★★
  */

  playHitMusic();


  await sleep(1850);


  hitText.classList.remove("on");


  await sleep(700);


  showTreasure();

}


/* =========================
   27 HIT ROUTES
========================= */

async function normalHitAt(point){

  showNumber(3);


  if(point===3){

    await sleep(1500);

    return HIT();

  }


  await sleep(1850);


  showNumber(2);


  if(point===2){

    await sleep(1650);

    return HIT();

  }


  await sleep(2050);


  showNumber(1);


  if(point===1){

    await sleep(1850);

    return HIT();

  }


  await sleep(2250);


  hideNumber();


  await sleep(700);


  return HIT({
    silence:300
  });

}


async function normalBlackout(){

  await normalCount();

  hideNumber();

  await sleep(300);

  blackout.classList.add("on");

  await sleep(1100);

  return HIT({
    silence:250
  });

}


async function freezeTwo(){

  showNumber(3);

  await sleep(1700);


  showNumber(2);

  await sleep(3900);


  return HIT({
    silence:200
  });

}


async function reverseCountdown(){

  showNumber(3);

  await sleep(1400);


  showNumber(2);

  await sleep(1400);


  showNumber(1);

  await sleep(1700);


  showNumber(2);

  await sleep(850);


  showNumber(1);

  await sleep(900);


  return HIT();

}


async function zeroPremium(){

  await normalCount();


  showNumber(0);

  number.classList.add("gold");


  await sleep(950);


  return HIT();

}


async function numberDisappear(){

  showNumber(3);

  await sleep(1700);


  hideNumber();

  await sleep(1000);


  showNumber(2);

  await sleep(1800);


  hideNumber();

  await sleep(900);


  return HIT();

}


async function soundStopPattern(){

  showNumber(3);

  await sleep(1800);


  showNumber(2);

  await sleep(1500);


  /*
    この当たりルートだけ
    Tensionが突然止まる
  */

  stopTension(false);


  hideNumber();


  await sleep(1600);


  return HIT({
    silence:400
  });

}


async function longOne(){

  showNumber(3);

  await sleep(1700);


  showNumber(2);

  await sleep(1900);


  showNumber(1);

  await sleep(4600);


  return HIT({
    silence:250
  });

}


async function recountSequence(){

  showNumber(3);

  await sleep(1300);


  showNumber(2);

  await sleep(1400);


  showNumber(1);

  await sleep(1700);


  hideNumber();

  await sleep(900);


  showNumber(3);

  await sleep(700);


  showNumber(2);

  await sleep(700);


  showNumber(1);

  await sleep(900);


  return HIT();

}


async function doubleCountdown(){

  showNumber(3);

/* =========================

========================= */

async function weakFake(){

  const type =
    Math.floor(
      Math.random()*10
    );


  showNumber(3);


  if(type===5){

    await sleep(3400);

  }

  else if(type===9){

    await sleep(650);

  }

  else{

    await sleep(1800);

  }


  showNumber(2);


  if(type===0){

    await sleep(3100);

  }

  else{

    await sleep(1950);

  }


  /*
    2が一瞬赤
  */

  if(type===6){

    number.classList.add("red");

    await sleep(420);

    number.classList.remove("red");

  }


  /*
    一瞬暗転
  */

  if(type===4){

    blackout.classList.add("on");

    await sleep(350);

    blackout.classList.remove("on");

  }


  /*
    一瞬0
  */

  if(type===7){

    showNumber(0);

    await sleep(300);

  }


  showNumber(1);


  /*
    1が赤
  */

  if(type===2){

    number.classList.add("red");

    await sleep(430);

    number.classList.remove("red");

  }


  /*
    1が小さい
  */

  if(type===8){

    number.classList.add("small");

  }


  /*
    BGMが一瞬止まるフェイク
  */

  if(type===3){

    stopTension(false);

    await sleep(650);

    /*
      iPhoneで再開が拒否される可能性があるため
      ここでは無理に再playしない。
      そのまま無音フェイクにする。
    */

    hideNumber();

    await sleep(480);

    showNumber(1);

  }


  if(type===1){

    await sleep(3500);

  }

  else{

    await sleep(2200);

  }


  hideNumber();


  message.textContent="…";


  await fadeTension(500);


  await sleep(600);


  message.textContent="";


  await sleep(350);


  resetGame();

}

/* =========================
   SHUFFLE
========================= */

function shuffle(arr){

  const a=[...arr];


  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i+1)
      );


    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];

  }


  return a;

}


/* =========================
   CHEST CLICK
========================= */

document
  .querySelectorAll(".chest")
  .forEach(chest=>{

    chest.addEventListener(
      "click",
      async()=>{

        if(treasureLocked){
          return;
        }


        treasureLocked=true;


        const chosen =
          Number(
            chest.dataset.index
          );


        chestRanks=[
          null,
          null,
          null
        ];


        /*
          選んだ箱には
          事前抽選した等級
        */

        chestRanks[chosen] =
          selectedRank;


        /*
          残りは他の2等級
        */

        const remainingRanks =
          shuffle(
            [1,2,3].filter(
              rank =>
                rank !== selectedRank
            )
          );


        const otherIndexes =
          shuffle(
            [0,1,2].filter(
              i =>
                i !== chosen
            )
          );


        chestRanks[
          otherIndexes[0]
        ] =
          remainingRanks[0];


        chestRanks[
          otherIndexes[1]
        ] =
          remainingRanks[1];


        /*
          選択箱を揺らす
        */

        chest.classList.add("shake");


        await sleep(600);


        chest.classList.remove("shake");


        /*
          OPEN
        */

        chest.classList.add("open");


        doFlash();


        await sleep(550);


        showRankLabel(
          chosen,
          selectedRank
        );


        await sleep(450);


        /*
          大きく結果
        */

        await showBigRank(
          selectedRank
        );


        treasureTitle.textContent=
          "残りの宝箱は…";


        treasureSub.textContent=
          "選ばなかった箱もオープン";


        /*
          残りの開封順もランダム
        */

        const revealOrder =
          shuffle(otherIndexes);


        await sleep(650);


        for(
          const index
          of revealOrder
        ){

          const otherChest =
            document.querySelector(
              `.chest[data-index="${index}"]`
            );


          otherChest
            .classList
            .add("shake");


          await sleep(420);


          otherChest
            .classList
            .remove("shake");


          otherChest
            .classList
            .add("open");


          doFlash();


          await sleep(300);


          showRankLabel(
            index,
            chestRanks[index]
          );


          await sleep(650);

        }


        nextButton.style.display="block";

      }
    );

  });

function showRankLabel(

){

  const wraps =

  label.classList.add(
    "show",
    `rank${rank}`
  );

}

async function showBigRank(rank){
