<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>COUNTDOWN LOTTERY</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#100008;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

/* ========================================
   BACKGROUND
======================================== */

#bg{
  position:fixed;
  inset:0;
  z-index:0;

  background-color:#16000c;

  background-image:
    url("./AAECEFCC-FDEB-4353-9E97-53CA100DE812.png");

  background-size:auto 100%;
  background-position:center top;
  background-repeat:no-repeat;
}

#shade{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;

  background:
    radial-gradient(
      circle at 50% 55%,
      rgba(255,20,130,.01),
      rgba(0,0,0,.20)
    );
}

/* ========================================
   FEATHERS
======================================== */

#featherLayer{
  position:fixed;
  inset:0;
  z-index:5;
  overflow:hidden;
  pointer-events:none;
}

.feather{
  position:absolute;
  top:-130px;

  display:block;

  width:auto;
  height:auto;

  object-fit:contain;

  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;

  /*
    黒っぽい背景を目立たなくする
  */
  mix-blend-mode:screen;

  /*
    filterを重くしすぎない
  */
  filter:brightness(1.05);

  will-change:transform,opacity;
}

/* ========================================
   GAME
======================================== */

#game{
  position:fixed;
  inset:0;
  z-index:10;
}

/* ========================================
   START
======================================== */

#startScreen{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;

  padding-bottom:max(8vh,55px);

  z-index:30;
}

#startInfo{
  text-align:center;
  margin-bottom:18px;

  font-weight:800;
  letter-spacing:.14em;

  text-shadow:
    0 2px 5px #000;
}

#startInfo .main{
  font-size:18px;
}

#startInfo .sub{
  margin-top:5px;
  font-size:11px;
  opacity:.82;
}

#startButton{
  width:min(78vw,330px);
  height:72px;

  border:
    2px solid rgba(255,255,255,.85);

  border-radius:18px;

  color:#fff;

  font-size:27px;
  font-weight:900;
  letter-spacing:.16em;

  background:
    linear-gradient(
      180deg,
      rgba(255,105,178,.96),
      rgba(218,0,99,.96)
    );

  box-shadow:
    0 7px 0 #790037,
    0 12px 25px rgba(0,0,0,.5),
    inset 0 2px 0 rgba(255,255,255,.45);
}

#startButton:active{
  transform:translateY(4px);

  box-shadow:
    0 3px 0 #790037,
    0 8px 18px rgba(0,0,0,.5);
}

/* ========================================
   COUNTDOWN NUMBER
======================================== */

#number{
  position:absolute;

  left:50%;
  top:61%;

  transform:
    translate(-50%,-50%);

  z-index:20;

  font-size:min(45vw,220px);
  line-height:.8;

  font-weight:1000;
  font-family:
    Impact,
    "Arial Black",
    sans-serif;

  color:#fff7fb;

  -webkit-text-stroke:
    clamp(4px,1.4vw,8px)
    #ff4b9d;

  text-shadow:
    0 5px 0 #d82779,
    0 10px 0 #a80052,
    0 15px 7px rgba(60,0,28,.72);

  opacity:0;

  pointer-events:none;
  user-select:none;
}

#number.show{
  opacity:1;

  animation:
    numberIn .16s ease-out;
}

@keyframes numberIn{

  0%{
    transform:
      translate(-50%,-50%)
      scale(.88);
  }

  100%{
    transform:
      translate(-50%,-50%)
      scale(1);
  }

}

#number.red{
  color:#fff0f3;

  -webkit-text-stroke:
    7px #ff153e;

  text-shadow:
    0 5px 0 #d00029,
    0 10px 0 #830016,
    0 15px 7px rgba(0,0,0,.7);
}

#number.gold{
  color:#fffde6;

  -webkit-text-stroke:
    7px #ffd200;

  text-shadow:
    0 5px 0 #e59b00,
    0 10px 0 #9c5900,
    0 15px 7px rgba(0,0,0,.7);
}

#number.small{
  transform:
    translate(-50%,-50%)
    scale(.76);
}

/* ========================================
   MESSAGE
======================================== */

#message{
  position:absolute;

  left:50%;
  top:73%;

  transform:
    translateX(-50%);

  z-index:21;

  width:100%;

  text-align:center;

  font-size:24px;
  font-weight:900;

  text-shadow:
    0 3px 8px #000;

  pointer-events:none;
}

/* ========================================
   BLACKOUT
======================================== */

#blackout{
  position:fixed;
  inset:0;

  z-index:50;

  background:#000;

  opacity:0;

  pointer-events:none;

  transition:
    opacity .06s linear;
}

#blackout.on{
  opacity:1;
}

/* ========================================
   FLASH
======================================== */

#flash{
  position:fixed;
  inset:0;

  z-index:70;

  background:#fff;

  opacity:0;

  pointer-events:none;
}

#flash.on{
  animation:
    flashAnim .30s ease-out;
}

@keyframes flashAnim{

  0%{
    opacity:1;
  }

  100%{
    opacity:0;
  }

}

/* ========================================
   SLASH
======================================== */

#slashLayer{
  position:fixed;
  inset:0;

  z-index:65;

  overflow:hidden;

  pointer-events:none;
}

.slash{
  position:absolute;

  left:-35vw;
  top:50%;

  width:170vw;
  height:12px;

  transform-origin:center;

  background:#fff;

  box-shadow:
    0 0 7px #fff,
    0 0 18px #ff3b96,
    0 0 40px #ff006e;

  animation:
    slashGo .38s
    cubic-bezier(.1,.8,.2,1)
    forwards;
}

.slash.two{
  animation:
    slashGo2 .38s
    cubic-bezier(.1,.8,.2,1)
    forwards;
}

@keyframes slashGo{

  0%{
    opacity:0;

    transform:
      translateY(-50%)
      rotate(-25deg)
      scaleX(0);
  }

  20%{
    opacity:1;
  }

  55%{
    transform:
      translateY(-50%)
      rotate(-25deg)
      scaleX(1);
  }

  100%{
    opacity:0;

    transform:
      translateY(-50%)
      rotate(-25deg)
      scaleX(1);
  }

}

@keyframes slashGo2{

  0%{
    opacity:0;

    transform:
      translateY(-50%)
      rotate(24deg)
      scaleX(0);
  }

  20%{
    opacity:1;
  }

  55%{
    transform:
      translateY(-50%)
      rotate(24deg)
      scaleX(1);
  }

  100%{
    opacity:0;

    transform:
      translateY(-50%)
      rotate(24deg)
      scaleX(1);
  }

}

/* ========================================
   HIT
======================================== */

#hitText{
  position:fixed;

  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    scale(.4);

  z-index:80;

  font-size:min(22vw,110px);

  white-space:nowrap;

  font-weight:1000;

  font-family:
    Impact,
    "Arial Black",
    sans-serif;

  color:#fff;

  -webkit-text-stroke:
    5px #ff2486;

  text-shadow:
    0 5px 0 #d00064,
    0 10px 0 #780032,
    0 0 25px #ff1680;

  opacity:0;

  pointer-events:none;
}

#hitText.on{
  animation:
    hitPop .7s
    cubic-bezier(.12,.8,.15,1)
    forwards;
}

@keyframes hitPop{

  0%{
    opacity:0;

    transform:
      translate(-50%,-50%)
      scale(.3);
  }

  35%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1.18);
  }

  55%{
    transform:
      translate(-50%,-50%)
      scale(.96);
  }

  100%{
    opacity:1;

    transform:
      translate(-50%,-50%)
      scale(1);
  }

}

/* ========================================
   TREASURE
======================================== */

#treasureScreen{
  position:fixed;
  inset:0;

  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  padding:
    30px 14px;

  background:
    radial-gradient(
      circle at 50% 38%,
      rgba(255,20,130,.42),
      rgba(28,0,16,.92) 55%,
      rgba(0,0,0,.97)
    );
}

#treasureScreen.show{
  display:flex;
}

#treasureIntro{
  font-size:14px;
  font-weight:800;
  letter-spacing:.12em;

  margin-bottom:8px;
}

#treasureTitle{
  text-align:center;

  font-size:27px;
  font-weight:1000;

  text-shadow:
    0 0 15px #ff1680;
}

#treasureSub{
  margin-top:8px;

  font-size:13px;

  opacity:.88;

  text-align:center;
}

#chests{
  width:100%;
  max-width:500px;

  display:flex;

  justify-content:center;
  align-items:flex-end;

  gap:8px;

  margin-top:42px;
}

.chestWrap{
  flex:1;

  max-width:150px;
  min-width:0;

  text-align:center;
}

.chest{
  position:relative;

  width:100%;

  aspect-ratio:
    1.08 / 1;

  cursor:pointer;

  transform-origin:
    center bottom;
}

.chestLid{
  position:absolute;

  left:7%;
  top:16%;

  width:86%;
  height:34%;

  border-radius:
    18px 18px 7px 7px;

  background:
    linear-gradient(
      180deg,
      #ffdd79 0%,
      #d78a17 20%,
      #754008 22%,
      #b85b16 40%,
      #6f2b08 100%
    );

  border:
    3px solid #ffd96b;

  box-shadow:
    inset 0 4px 4px rgba(255,255,255,.3),
    0 5px 8px rgba(0,0,0,.5);

  transform-origin:
    center bottom;

  transition:
    transform .45s ease;
}

.chestBody{
  position:absolute;

  left:7%;
  bottom:7%;

  width:86%;
  height:52%;

  border-radius:
    5px 5px 14px 14px;

  background:
    linear-gradient(
      90deg,
      #5f2107,
      #c26a1c 22%,
      #7b2b08 50%,
      #c36c1d 77%,
      #5d2007
    );

  border:
    3px solid #ffc94f;

  box-shadow:
    inset 0 0 12px rgba(0,0,0,.6),
    0 8px 14px rgba(0,0,0,.6);
}

.chestLock{
  position:absolute;

  left:50%;
  top:43%;

  transform:
    translateX(-50%);

  width:25%;
  height:30%;

  border-radius:5px;

  background:
    linear-gradient(
      #fff1a3,
      #d49315
    );

  border:
    2px solid #704000;

  z-index:3;
}

.chest.open .chestLid{
  transform:
    translateY(-24%)
    rotateX(72deg);
}

.chest.shake{
  animation:
    chestShake .48s linear;
}

@keyframes chestShake{

  0%,100%{
    transform:
      translateX(0)
      rotate(0);
  }

  20%{
    transform:
      translateX(-6px)
      rotate(-3deg);
  }

  40%{
    transform:
      translateX(6px)
      rotate(3deg);
  }

  60%{
    transform:
      translateX(-5px)
      rotate(-2deg);
  }

  80%{
    transform:
      translateX(5px)
      rotate(2deg);
  }

}

.rankLabel{
  margin-top:9px;

  min-height:29px;

  font-size:22px;
  font-weight:1000;

  opacity:0;
}

.rankLabel.show{
  opacity:1;
}

.rank1{
  color:#ffe36b;

  text-shadow:
    0 0 12px #ffb300;
}

.rank2{
  color:#f4f4f4;

  text-shadow:
    0 0 10px #aab6c7;
}

.rank3{
  color:#ff9c4a;

  text-shadow:
    0 0 10px #c94d00;
}

/* ========================================
   RANK RESULT
======================================== */

#rankResult{
  position:fixed;
  inset:0;

  z-index:130;

  display:none;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:
    rgba(0,0,0,.77);
}

#rankResult.show{
  display:flex;
}

#rankBig{
  font-size:min(24vw,120px);

  font-weight:1000;

  line-height:1;

  text-align:center;
}

#rankWin{
  margin-top:15px;

  font-size:31px;
  font-weight:1000;
}

#nextButton{
  display:none;

  margin-top:32px;

  width:min(72vw,300px);
  height:60px;

  border:
    2px solid #fff;

  border-radius:16px;

  color:#fff;

  background:
    linear-gradient(
      #ff5fa8,
      #bc0055
    );

  font-size:22px;
  font-weight:1000;

  letter-spacing:.12em;
}

</style>
</head>

<body>

<div id="bg"></div>
<div id="shade"></div>
<div id="featherLayer"></div>

<div id="game">

  <div id="startScreen">

    <div id="startInfo">

      <div class="main">
        完全抽選 1/30
      </div>

      <div class="sub">
        毎回独立抽選
      </div>

    </div>

    <button id="startButton">
      START
    </button>

  </div>

  <div id="number"></div>
  <div id="message"></div>

</div>

<div id="slashLayer"></div>
<div id="blackout"></div>
<div id="flash"></div>

<div id="hitText">
  当たり
</div>


<div id="treasureScreen">

  <div id="treasureIntro">
    ここからが本番。
  </div>

  <div id="treasureTitle">
    運命の宝箱を選べ！
  </div>

  <div id="treasureSub">
    この一箱が、結果を決める。
  </div>


  <div id="chests">

    <div class="chestWrap">

      <div class="chest" data-index="0">

        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestLock"></div>

      </div>

      <div class="rankLabel"></div>

    </div>


    <div class="chestWrap">

      <div class="chest" data-index="1">

        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestLock"></div>

      </div>

      <div class="rankLabel"></div>

    </div>


    <div class="chestWrap">

      <div class="chest" data-index="2">

        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestLock"></div>

      </div>

      <div class="rankLabel"></div>

    </div>

  </div>


  <button id="nextButton">
    NEXT
  </button>

</div>


<div id="rankResult">

  <div id="rankBig"></div>

  <div id="rankWin">
    当選！
  </div>

</div>


<!--
  ★唯一の音源
  当たり時以外はplay()しない
-->
<audio
  id="hitMusic"
  src="./hit_music_final.mp3"
  preload="metadata"
  playsinline>
</audio>


<script>

/* ========================================
   BASIC
======================================== */

const sleep = ms =>
  new Promise(
    resolve =>
      setTimeout(resolve,ms)
  );


const number =
  document.getElementById("number");

const message =
  document.getElementById("message");

const startScreen =
  document.getElementById("startScreen");

const startButton =
  document.getElementById("startButton");

const blackout =
  document.getElementById("blackout");

const flash =
  document.getElementById("flash");

const hitText =
  document.getElementById("hitText");

const hitMusic =
  document.getElementById("hitMusic");

const featherLayer =
  document.getElementById("featherLayer");

const treasureScreen =
  document.getElementById("treasureScreen");

const treasureTitle =
  document.getElementById("treasureTitle");

const treasureSub =
  document.getElementById("treasureSub");

const nextButton =
  document.getElementById("nextButton");

const rankResult =
  document.getElementById("rankResult");

const rankBig =
  document.getElementById("rankBig");


let playing=false;

let featherStageLevel=0;

let featherTimer=null;

let selectedRank=null;

let chestRanks=[];

let treasureLocked=false;


/* ========================================
   FEATHER FILES
======================================== */

const FEATHERS=[

  "./2861EE44-6874-491B-9FD1-2EAD12340DBA.png",

  "./3A7430CF-FCCE-4ABF-B1A8-3AF6D2641A18.png",

  "./6472D0CA-C75B-419B-9484-7F6985FA2BB6.png",

  "./6B4FEC6B-D466-47DC-8BAF-444CB71B5152.png",

  "./8B652B5F-DC95-4A84-9795-2924E56DC8CF.png",

  "./A73F0553-5069-4F38-8332-68D332E85F4B.png",

  "./E2C84B27-312E-485B-B77B-8E0A9B6B36B6.png",

  "./F0922A9C-70CA-49B0-A7C4-38B69A670AF9.png"

];


/* ========================================
   RANDOM
======================================== */

function rand(min,max){

  return (
    Math.random() *
    (max-min)
  ) + min;

}


function randomItem(arr){

  return arr[
    Math.floor(
      Math.random()*arr.length
    )
  ];

}


/* ========================================
   FEATHER COUNT

   ★同時最大4枚
======================================== */

function featherCount(){

  return featherLayer
    .querySelectorAll(".feather")
    .length;

}


/* ========================================
   CREATE FEATHER
======================================== */

function createFeather(
  burst=false
){

  /*
    通常は最大4枚。

    当たりburstだけ
    最大6枚まで許可。
  */

  const max =
    burst ? 6 : 4;


  if(
    featherCount() >= max
  ){
    return;
  }


  const img =
    document.createElement("img");


  img.className="feather";


  img.src =
    randomItem(FEATHERS);


  /*
    前より小さめ
  */

  const size =
    burst
      ? rand(38,72)
      : rand(28,58);


  img.style.width =
    size+"px";


  /*
    出現位置
  */

  img.style.left =
    rand(-5,95)+"vw";


  /*
    透明度
  */

  const opacity =
    burst
      ? rand(.55,.80)
      : rand(.35,.60);


  /*
    軽量化のため
    1枚1アニメーションのみ
  */

  const duration =
    burst
      ? rand(3500,4800)
      : rand(6500,9000);


  const drift =
    rand(-18,18);


  const midDrift =
    rand(-10,10);


  const startRotation =
    rand(-70,70);


  const rotation =
    rand(100,240) *
    (
      Math.random()<.5
        ? -1
        : 1
    );


  featherLayer
    .appendChild(img);


  const animation =
    img.animate(

      [

        {
          opacity:0,

          transform:
            `translate3d(0,-5vh,0)
             rotate(${startRotation}deg)`
        },


        {
          opacity:opacity,

          offset:.12,

          transform:
            `translate3d(
              ${midDrift}vw,
              25vh,
              0
            )
            rotate(
              ${startRotation + rotation*.25}deg
            )`
        },


        {
          opacity:opacity,

          offset:.55,

          transform:
            `translate3d(
              ${drift}vw,
              70vh,
              0
            )
            rotate(
              ${startRotation + rotation*.6}deg
            )`
        },


        {
          opacity:0,

          transform:
            `translate3d(
              ${drift*.4}vw,
              125vh,
              0
            )
            rotate(
              ${startRotation + rotation}deg
            )`
        }

      ],

      {
        duration:duration,
        easing:"linear",
        fill:"forwards"
      }

    );


  animation.onfinish=()=>{

    img.remove();

  };

}


/* ========================================
   FEATHER STAGE
======================================== */

function featherStage(level){

  featherStageLevel=level;


  clearInterval(
    featherTimer
  );


  /*
    3 = かなり少ない
    2 = 少し増える
    1 = 最大4枚
  */

  let interval;


  if(level===1){

    interval=2800;

  }

  else if(level===2){

    interval=2000;

  }

  else{

    interval=1450;

  }


  /*
    数字が変わった瞬間に
    1枚だけ追加
  */

  createFeather(false);


  featherTimer =
    setInterval(()=>{

      if(playing){

        createFeather(false);

      }

    },interval);

}


/* ========================================
   STOP FEATHERS
======================================== */

function stopFeathers(){

  clearInterval(
    featherTimer
  );

  featherTimer=null;

  featherStageLevel=0;

}


/* ========================================
   HIT FEATHER BURST

   ★最大6枚
======================================== */

function featherBurst(){

  /*
    既存枚数を含め最大6枚なので
    大量生成しない
  */

  const need =
    Math.max(
      0,
      6-featherCount()
    );


  for(
    let i=0;
    i<need;
    i++
  ){

    setTimeout(()=>{

      createFeather(true);

    },i*100);

  }

}


/* ========================================
   NUMBER

   ★音なし
======================================== */

function clearNumberStyle(){

  number.classList.remove(
    "red",
    "gold",
    "small"
  );

}


function showNumber(n){

  clearNumberStyle();


  number.textContent=n;


  number.classList.remove(
    "show"
  );


  void number.offsetWidth;


  number.classList.add(
    "show"
  );


  /*
    ★ここでは何も鳴らさない
  */

}


function hideNumber(){

  number.classList.remove(
    "show"
  );

}


/* ========================================
   NORMAL COUNT
======================================== */

async function normalCount(){

  featherStage(1);

  showNumber(3);

  await sleep(1850);


  featherStage(2);

======================================== */

function slash(
  fake=false,
  double=false
){

  const layer =
    document.getElementById(
      "slashLayer"
    );


  const s =
    document.createElement("div");


  s.className="slash";


  layer.appendChild(s);


  if(double){

    setTimeout(()=>{

      const s2 =
        document.createElement("div");


      s2.className=
        "slash two";


      layer.appendChild(s2);


      setTimeout(()=>{

        s2.remove();

      },600);

    },110);

  }


  if(!fake){

    flash.classList.remove("on");


    void flash.offsetWidth;


    flash.classList.add("on");

  }


  setTimeout(()=>{

    s.remove();

  },600);

}

/* ========================================
   SHUFFLE
======================================== */

function shuffle(arr){

  const a=[...arr];


  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() *
        (i+1)
      );


    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];

  }


  return a;

}


/* ========================================
   CHEST CLICK
======================================== */

document
  .querySelectorAll(".chest")
  .forEach(chest=>{

    chest.addEventListener(
      "click",
      async()=>{

        if(treasureLocked){
          return;
        }


        treasureLocked=true;


        const chosen =
          Number(
            chest.dataset.index
          );


        chestRanks=[
          null,
          null,
          null
        ];


        /*
          選択した箱に
          事前抽選済みの等級
        */

        chestRanks[chosen] =
          selectedRank;


        /*
          残りの2等級
        */

        const remainingRanks =
          shuffle(
            [1,2,3].filter(
              rank =>
                rank !== selectedRank
            )
          );


        /*
          残り2箱の位置もランダム
        */

        const otherIndexes =
          shuffle(
            [0,1,2].filter(
              i =>
                i !== chosen
            )
          );


        chestRanks[
          otherIndexes[0]
        ] =
          remainingRanks[0];


        chestRanks[
          otherIndexes[1]
        ] =
          remainingRanks[1];


        /*
          選択箱
        */

        chest.classList.add("shake");


        await sleep(600);


        chest.classList.remove("shake");


        chest.classList.add("open");


        flash.classList.remove("on");


        void flash.offsetWidth;


        flash.classList.add("on");


        await sleep(550);


        showRankLabel(
          chosen,
          selectedRank
        );


        await sleep(450);


        await showBigRank(
          selectedRank
        );


        treasureTitle.textContent=
          "残りの宝箱は…";


        treasureSub.textContent=
          "選ばなかった箱もオープン";


        /*
          残りの開封順もランダム
        */

        const revealOrder =
          shuffle(otherIndexes);


        await sleep(650);


        for(
          const index
          of revealOrder
        ){

          const otherChest =
            document.querySelector(
              `.chest[data-index="${index}"]`
            );


          otherChest
            .classList
            .add("shake");


          await sleep(420);


          otherChest
            .classList
            .remove("shake");


          otherChest
            .classList
            .add("open");


          flash.classList.remove("on");


          void flash.offsetWidth;


          flash.classList.add("on");


          await sleep(300);


          showRankLabel(
            index,
            chestRanks[index]
          );


          await sleep(650);

        }


        nextButton.style.display=
          "block";

      }
    );

  });
