<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COUNTDOWN TEST</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

body{
  user-select:none;
}

button{
  font-family:inherit;
}

#stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 45%,
      #171717 0%,
      #050505 48%,
      #000 82%);
}

#number{
  position:relative;
  z-index:5;
  font-size:min(60vw,360px);
  font-weight:1000;
  line-height:1;
  text-shadow:
    0 0 15px #fff,
    0 0 40px rgba(255,255,255,.45);
  transition:
    color .15s,
    transform .15s,
    left .15s,
    top .15s,
    opacity .15s;
}

#number.show{
  animation:numberIn .42s ease-out;
}

@keyframes numberIn{
  0%{
    opacity:0;
    transform:scale(1.32);
    filter:blur(8px);
  }
  100%{
    opacity:1;
    transform:scale(1);
    filter:blur(0);
  }
}

#number.red{color:#ff2828}
#number.gold{color:#ffe16b}
#number.small{transform:scale(.84)}
#number.big{transform:scale(1.18)}
#number.thin{font-weight:300}
#number.shiftLeft{left:-18px}
#number.shiftRight{left:18px}
#number.shiftUp{top:-13px}

#number.double{
  text-shadow:
    8px 0 0 rgba(255,255,255,.28),
    -8px 0 0 rgba(255,0,0,.22),
    0 0 25px #fff;
}

#number.mirror{
  transform:scaleX(-1);
}

#number.flicker{
  animation:flicker .12s linear 4;
}

@keyframes flicker{
  0%,100%{opacity:1}
  50%{opacity:.05}
}

#number.ghost::after{
  content:attr(data-num);
  position:absolute;
  inset:0;
  transform:translate(14px,10px);
  opacity:.15;
}


/* =========================
   テストメニュー
========================= */

#testPanel{
  position:fixed;
  left:0;
  right:0;
  bottom:4%;
  z-index:500;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  padding:0 14px;
}

#testTitle{
  font-size:12px;
  font-weight:900;
  letter-spacing:.15em;
  opacity:.55;
}

#testButtons{
  width:min(94vw,520px);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.testBtn{
  min-height:52px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
  font-weight:900;
  font-size:15px;
  background:rgba(20,20,20,.92);
}

.testBtn:active{
  transform:scale(.96);
}

#btnNormal{
  border-color:#777;
}

#btnWeak{
  border-color:#8ca3ff;
}

#btnStrong{
  border-color:#ff9b44;
}

#btnHit{
  border-color:#ff4747;
  background:
    linear-gradient(
      135deg,
      rgba(130,0,0,.95),
      rgba(50,0,0,.95)
    );
}


/* 本番ボタン */

#start{
  position:absolute;
  bottom:8%;
  z-index:400;
  display:none;
  padding:17px 46px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.78);
  color:#fff;
  font-size:17px;
  font-weight:900;
  letter-spacing:.12em;
}


#black{
  position:fixed;
  inset:0;
  z-index:80;
  display:none;
  background:#000;
}

#weirdMark{
  position:fixed;
  z-index:30;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:min(18vw,100px);
  font-weight:1000;
  display:none;
  text-shadow:
    0 0 15px #fff,
    0 0 40px #fff;
}

#slash{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  overflow:hidden;
  pointer-events:none;
}

#slash.go{
  display:block;
}

#line{
  position:absolute;
  left:-30%;
  top:50%;
  width:160%;
  height:9px;
  background:#fff;
  box-shadow:
    0 0 15px #fff,
    0 0 40px #fff,
    0 0 90px #fff;
  transform:rotate(-18deg) scaleX(0);
}

#slash.go #line{
  animation:slashAnim .20s ease-out forwards;
}

@keyframes slashAnim{
  to{
    transform:rotate(-18deg) scaleX(1);
  }
}

#flash{
  position:fixed;
  inset:0;
  z-index:350;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

#flash.go{
  animation:flashAnim .45s ease-out;
}

@keyframes flashAnim{
  0%{opacity:0}
  10%{opacity:1}
  28%{opacity:.25}
  40%{opacity:1}
  100%{opacity:0}
}

#hit{
  position:fixed;
  inset:0;
  z-index:140;
  display:none;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(circle,
      #8b1a00 0%,
      #390000 35%,
      #090000 68%,
      #000 100%);
}

#hit.show{
  display:flex;
}

#glow{
  position:absolute;
  width:150vw;
  height:150vw;
  border-radius:50%;
  background:
    conic-gradient(
      transparent,
      rgba(255,180,0,.35),
      transparent,
      rgba(255,0,0,.42),
      transparent);
  animation:spin 3s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

#hitText{
  position:relative;
  z-index:5;
  font-size:min(24vw,150px);
  font-weight:1000;
  text-align:center;
  text-shadow:
    0 0 12px #fff,
    0 0 30px #ffe100,
    0 0 70px #ff4500,
    0 0 110px red;
  animation:hitIn .55s cubic-bezier(.05,1.4,.2,1);
}

@keyframes hitIn{
  0%{
    opacity:0;
    transform:scale(.25);
    filter:blur(10px);
  }
  70%{
    opacity:1;
    transform:scale(1.18);
    filter:blur(0);
  }
  100%{
    transform:scale(1);
  }
}

#subText{
  position:absolute;
  bottom:25%;
  z-index:5;
  font-size:15px;
  font-weight:900;
  letter-spacing:.16em;
}


/* =========================
   宝箱
========================= */

#treasureScreen{
  position:fixed;
  inset:0;
  z-index:180;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 42%,
      #202020 0%,
      #090909 48%,
      #000 100%);
}

#treasureScreen.show{
  display:flex;
}

#treasureTitle{
  position:absolute;
  top:10%;
  width:100%;
  text-align:center;
  font-size:clamp(24px,8vw,48px);
  font-weight:1000;
  letter-spacing:.12em;
}

#treasureSub{
  position:absolute;
  top:18%;
  width:100%;
  text-align:center;
  font-size:13px;
  letter-spacing:.14em;
  opacity:.72;
}

#chests{
  width:min(96vw,700px);
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:7px;
  padding:0 7px;
}

.chest{
  appearance:none;
  border:none;
  background:transparent;
  width:32%;
  padding:0;
  color:#fff;
  position:relative;
  transition:.25s;
}

.chest:active{
  transform:scale(.94);
}

.chest.disabled{
  pointer-events:none;
}

.chest.dim{
  opacity:.38;
}

.chestWrap{
  position:relative;
  width:100%;
  aspect-ratio:1/.88;
  animation:chestFloat 1.5s ease-in-out infinite;
}

.chest:nth-child(2) .chestWrap{
  animation-delay:.15s;
}

.chest:nth-child(3) .chestWrap{
  animation-delay:.3s;
}

@keyframes chestFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.chestBody{
  position:absolute;
  left:10%;
  bottom:7%;
  width:80%;
  height:48%;
  border-radius:8px 8px 18px 18px;
  background:
    linear-gradient(
      90deg,
      #6e2f07,
      #b75b10 18%,
      #7d3406 50%,
      #bf6618 82%,
      #642905);
  border:4px solid #dca62f;
}

.chestLid{
  position:absolute;
  left:7%;
  top:22%;
  width:86%;
  height:34%;
  border-radius:50% 50% 7px 7px;
  background:
    linear-gradient(
      90deg,
      #6b2a05,
      #c36813 25%,
      #813605 55%,
      #c9741a 82%,
      #652705);
  border:4px solid #e0ad36;
  transform-origin:50% 100%;
  transition:transform .6s;
}

.chestBand{
  position:absolute;
  left:44%;
  top:18%;
  width:12%;
  height:64%;
  background:
    linear-gradient(
      #ffe27a,
      #b37b13,
      #ffdd65);
  border-radius:4px;
  z-index:4;
}

.chestLock{
  position:absolute;
  left:40%;
  bottom:26%;
  width:20%;
  aspect-ratio:1;
  border-radius:6px;
  background:
    linear-gradient(
      #ffe98a,
      #a87511);
  border:2px solid #fff1a5;
  z-index:6;
}

.chestLight{
  position:absolute;
  left:26%;
  bottom:26%;
  width:48%;
  height:15%;
  opacity:0;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 20px #fff,
    0 0 50px #ffe66a,
    0 0 100px #ffb300;
  z-index:2;
}

.chestNum{
  margin-top:4px;
  font-size:11px;
  font-weight:900;
  letter-spacing:.08em;
  opacity:.6;
}

.chestResult{
  min-height:34px;
  margin-top:7px;
  font-size:clamp(20px,7vw,38px);
  font-weight:1000;
  opacity:0;
  transform:scale(.4);
  transition:.4s cubic-bezier(.1,1.5,.2,1);
  text-shadow:
    0 0 10px #fff,
    0 0 25px currentColor;
}

.chestResult.show{
  opacity:1;
  transform:scale(1);
}

.chestResult.first{color:#ffe35e}
.chestResult.second{color:#e8efff}
.chestResult.third{color:#ff9b55}

.chest.selected .chestWrap{
  animation:chestShake .12s linear infinite;
}

@keyframes chestShake{
  0%{transform:translate(-3px,0) rotate(-1deg)}
  25%{transform:translate(3px,-2px) rotate(1deg)}
  50%{transform:translate(-2px,2px) rotate(-1deg)}
  75%{transform:translate(2px,-1px) rotate(1deg)}
  100%{transform:translate(-3px,0) rotate(-1deg)}
}

.chest.open .chestWrap{
  animation:none;
}

.chest.open .chestLid{
  transform:rotateX(145deg) translateY(-4px);
}

.chest.open{
  transform:scale(1.08);
  filter:brightness(1.25);
}

.chest.open .chestLight{
  opacity:1;
  animation:lightBurst .7s ease-out forwards;
}

@keyframes lightBurst{
  from{
    transform:scale(.3);
    opacity:1;
  }
  to{
    transform:scale(4.5);
    opacity:0;
  }
}

#treasureNext{
  position:absolute;
  bottom:8%;
  z-index:400;
  display:none;
  padding:17px 46px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.78);
  color:#fff;
  font-size:17px;
  font-weight:900;
  letter-spacing:.12em;
}


/* =========================
   景品発表
========================= */

#prizeBox{
  position:fixed;
  inset:0;
  z-index:230;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  overflow:hidden;
}

#prizeBox.show{
  display:flex;
}

#prizeBox.first{
  background:
    radial-gradient(circle,
      #fff7a0 0%,
      #d99b00 25%,
      #5c2500 60%,
      #000 100%);
}

#prizeBox.second{
  background:
    radial-gradient(circle,
      #fff 0%,
      #a9b2be 28%,
      #272d35 62%,
      #000 100%);
}

#prizeBox.third{
  background:
    radial-gradient(circle,
      #ffd2a8 0%,
      #b75a22 30%,
      #4c1e08 62%,
      #000 100%);
}

#prizeBurst{
  position:absolute;
  width:160vw;
  height:160vw;
  border-radius:50%;
  background:
    repeating-conic-gradient(
      rgba(255,255,255,.22) 0deg 4deg,
      transparent 4deg 11deg);
  animation:spin 6s linear infinite;
}

#prizeLabel{
  position:relative;
  z-index:3;
  font-size:clamp(72px,28vw,180px);
  font-weight:1000;
  line-height:1;
  text-align:center;
  text-shadow:
    0 0 12px #fff,
    0 0 40px rgba(255,255,255,.7),
    0 0 90px rgba(255,180,0,.7);
}

#prizeWon{
  position:relative;
  z-index:3;
  margin-top:20px;
  font-size:clamp(20px,6vw,38px);
  font-weight:1000;
  letter-spacing:.15em;
}

</style>
</head>

<script>

/* =========================
   ★ テスト設定 ★

   true  = 4ボタンテスト
   false = 本番1/30
========================= */

const TEST_MODE = true;


const $ =
  s => document.querySelector(s);

const $$ =
  s => [...document.querySelectorAll(s)];

const sleep =
  ms => new Promise(
    r => setTimeout(r,ms)
  );


let busy = false;

let chestBusy = false;

let selectedPrize = null;

let chestResults = [];

let audioCtx = null;

let tensionOsc1 = null;
let tensionOsc2 = null;
let tensionOsc3 = null;
let tensionOsc4 = null;

let tensionGain = null;

let tensionCompressor = null;

let pulseTimer = null;

let tensionLevel = 1;

const hitMusic =
  $("#hitMusic");


/* =========================
   MODE表示
========================= */

function setupMode(){

  if(TEST_MODE){

    $("#testPanel")
      .style.display =
      "flex";

    $("#start")
      .style.display =
      "none";

  }else{

    $("#testPanel")
      .style.display =
      "none";

    $("#start")
      .style.display =
      "block";

  }

}


/* =========================
   AUDIO
========================= */

function initAudio(){

  if(!audioCtx){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(
    audioCtx.state ===
    "suspended"
  ){

    audioCtx.resume();

  }

}


async function unlockHitMusic(){

  try{

    hitMusic.pause();

    hitMusic.currentTime = 0;

    hitMusic.muted = false;

    hitMusic.volume = .001;

    await hitMusic.play();

    await sleep(60);

    hitMusic.pause();

    hitMusic.currentTime = 0;

    hitMusic.volume = 1;

  }catch(e){

    hitMusic.volume = 1;

  }

}


/* =========================
   緊張音
========================= */

function startTension(){

  initAudio();

  stopTension();

  tensionLevel = 1;

  const now =
    audioCtx.currentTime;

  tensionGain =
    audioCtx.createGain();

  tensionCompressor =
    audioCtx.createDynamicsCompressor();

  tensionCompressor.threshold.value =
    -14;

  tensionCompressor.knee.value =
    12;

  tensionCompressor.ratio.value =
    5;

  tensionCompressor.attack.value =
    .005;

  tensionCompressor.release.value =
    .18;


  tensionOsc1 =
    audioCtx.createOscillator();

  tensionOsc2 =
    audioCtx.createOscillator();

  tensionOsc3 =
    audioCtx.createOscillator();

  tensionOsc4 =
    audioCtx.createOscillator();


  tensionOsc1.type =
    "sine";

  tensionOsc2.type =
    "triangle";

  tensionOsc3.type =
    "sawtooth";

  tensionOsc4.type =
    "triangle";


  tensionOsc1.frequency.value =
    92;

  tensionOsc2.frequency.value =
    184;

  tensionOsc3.frequency.value =
    276;

  tensionOsc4.frequency.value =
    368;


  const g1 =
    audioCtx.createGain();

  const g2 =
    audioCtx.createGain();

  const g3 =
    audioCtx.createGain();

  const g4 =
    audioCtx.createGain();


  g1.gain.value = .72;
  g2.gain.value = .34;
  g3.gain.value = .055;
  g4.gain.value = .035;


  tensionOsc1.connect(g1);
  tensionOsc2.connect(g2);
  tensionOsc3.connect(g3);
  tensionOsc4.connect(g4);


  g1.connect(tensionGain);
  g2.connect(tensionGain);
  g3.connect(tensionGain);
  g4.connect(tensionGain);


  tensionGain.connect(
    tensionCompressor
  );

  tensionCompressor.connect(
    audioCtx.destination
  );


  tensionOsc1.start();
  tensionOsc2.start();
  tensionOsc3.start();
  tensionOsc4.start();


  startPulse();

}


function startPulse(){

  if(pulseTimer){

    clearTimeout(
      pulseTimer
    );

  }


  function pulse(){

    if(!tensionGain){
      return;
    }


    const t =
      audioCtx.currentTime;


    let base = .12;

    let peak = .34;

    let speed = 620;


    if(tensionLevel === 2){

      base = .14;
      peak = .40;
      speed = 500;

    }


    if(tensionLevel === 3){

      base = .16;
      peak = .48;
      speed = 390;

    }


    tensionGain.gain
      .cancelScheduledValues(t);


    tensionGain.gain
      .setValueAtTime(
        base,
        t
      );


    tensionGain.gain
      .exponentialRampToValueAtTime(
        peak,
        t + .045
      );


    tensionGain.gain
      .exponentialRampToValueAtTime(
        base,
        t + .25
      );


    pulseTimer =
      setTimeout(
        pulse,
        speed
      );

  }


  pulse();

}


function raiseTension(level){

  tensionLevel =
    level;


  if(!audioCtx){
    return;
  }


  const t =
    audioCtx.currentTime;


  try{

    if(level === 1){

      tensionOsc1
        ?.frequency
        .linearRampToValueAtTime(
          92,
          t + .3
        );

      tensionOsc2
        ?.frequency
        .linearRampToValueAtTime(
          184,
          t + .3
        );

    }


    if(level === 2){

      tensionOsc1
        ?.frequency
        .linearRampToValueAtTime(
          104,
          t + .3
        );

      tensionOsc2
        ?.frequency
        .linearRampToValueAtTime(
          208,
          t + .3
        );

    }


    if(level === 3){

      tensionOsc1
        ?.frequency
        .linearRampToValueAtTime(
          118,
          t + .3
        );

      tensionOsc2
        ?.frequency
        .linearRampToValueAtTime(
          236,
          t + .3
        );

    }

  }catch(e){}

}


function stopTension(){

  if(pulseTimer){

    clearTimeout(
      pulseTimer
    );

    pulseTimer = null;

  }


  try{
    tensionOsc1?.stop();
  }catch(e){}


  try{
    tensionOsc2?.stop();
  }catch(e){}


  try{
    tensionOsc3?.stop();
  }catch(e){}


  try{
    tensionOsc4?.stop();
  }catch(e){}


  tensionOsc1 = null;
  tensionOsc2 = null;
  tensionOsc3 = null;
  tensionOsc4 = null;

  tensionGain = null;
  tensionCompressor = null;

}


/* =========================
   カウント音
========================= */

function countSound(n){

  initAudio();


  const now =
    audioCtx.currentTime;


  const osc =
    audioCtx.createOscillator();


  const gain =
    audioCtx.createGain();


  const freq = {
    3:160,
    2:145,
    1:128,
    0:110
  };


  osc.type =
    "triangle";


  osc.frequency
    .setValueAtTime(
      freq[n] || 140,
      now
    );


  osc.frequency
    .exponentialRampToValueAtTime(
      65,
      now + .45
    );


  gain.gain
    .setValueAtTime(
      .0001,
      now
    );


  gain.gain
    .exponentialRampToValueAtTime(
      .72,
      now + .012
    );


  gain.gain
    .exponentialRampToValueAtTime(
      .0001,
      now + .52
    );


  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );


  osc.start(now);

  osc.stop(
    now + .55
  );

}

========================= */

function buildChestResults(
  selectedIndex
){

  const all =
    [
      "1等",
      "2等",
      "3等"
    ];


  const remaining =
    all.filter(
      x =>
        x !==
        selectedPrize.label
    );


  if(
    Math.random() <
    .5
  ){

    remaining.reverse();

  }


  chestResults =
    new Array(3);


  chestResults[
    selectedIndex
  ] =
    selectedPrize.label;


  const otherIndexes =
    [0,1,2]
      .filter(
        i =>
          i !==
          selectedIndex
      );


  chestResults[
    otherIndexes[0]
  ] =
    remaining[0];


  chestResults[
    otherIndexes[1]
  ] =
    remaining[1];

}

/* =========================
   当たり18種類から選択
========================= */

async function runRandomHit(){

  const pattern =
    Math.floor(
      Math.random() * 18
    );


  switch(pattern){

    case 0:
      return normalHitAt(3);

    case 1:
      return normalHitAt(2);

    case 2:
      return normalHitAt(1);

    case 3:
      return normalHitAt(0);

    case 4:
      return normalBlackout();

    case 5:
      return freezeTwo();

    case 6:
      return reverseCountdown();

    case 7:
      return zeroPremium();

    case 8:
      return numberDisappear();

    case 9:
      return soundStopPattern();

    case 10:
      return longOne();

    case 11:
      return recountSequence();

    case 12:
      return doubleCountdown();

    case 13:
      return puchunDirect();

    case 14:
      return puchunRecount();

    case 15:
      return fakeSlashPattern();

    case 16:
      return weirdCountdown();

    case 17:
      return silentStart();

  }

}

async function chooseChest(chest){

  if(chestBusy){
    return;
  }


  chestBusy =
    true;


  const chests =
    $$(".chest");


  const selectedIndex =
    chests.indexOf(chest);


  buildChestResults(
    selectedIndex
  );


  chests.forEach(c=>{

    c.classList.add(
      "disabled"
    );


    if(c !== chest){

      c.classList.add(
        "dim"
      );

    }

  });


  chest.classList.add(
    "selected"
  );


  await sleep(1000);


  chest.classList.remove(
    "selected"
  );


  chest.classList.add(
    "open"
  );


  chestOpenSound();

  flash();


  showChestResult(
    chest,
    selectedPrize.label
  );


  await sleep(750);


  await showSelectedPrize();


  await sleep(300);


  $("#treasureTitle")
    .textContent =
    "残りの宝箱は…";


  $("#treasureSub")
    .textContent =
    "選ばなかった箱もオープン";


  chests.forEach(
    c =>
      c.classList.remove(
        "dim"
      )
  );


  const others =
    chests
      .map(
        (c,i)=>({
          chest:c,
          index:i
        })
      )
      .filter(
        x =>
          x.index !==
          selectedIndex
      );


  await sleep(500);


  for(
    const item
    of others
  ){

    item.chest
      .classList
      .add(
        "open"
      );


    chestOpenSound();

    flash();


    showChestResult(
      item.chest,
      chestResults[
        item.index
      ]
    );


    await sleep(950);

  }


  $("#treasureTitle")
    .textContent =
    selectedPrize.label +
    " 当選！";


  $("#treasureSub")
    .textContent =
    "3つの宝箱の結果";


  $("#treasureNext")
    .style.display =
    "block";

}

  result.className =

  await runRandomHit();

}


/* =========================
   RESET
========================= */

function reset(){

  stopTension();


  hitMusic.pause();


  try{

    hitMusic.currentTime =
      0;

  }catch(e){}


  $("#hit")
    .className =
    "";


  $("#treasureScreen")
    .className =
    "";


  $("#prizeBox")
    .className =
    "";


  $("#slash")
    .className =
    "";


  $("#black")
    .style.display =
    "none";


  $("#weirdMark")
    .style.display =
    "none";


  $("#stage")
    .style.background =
    "";


  $("#treasureNext")
    .style.display =
    "none";


  resetNumberStyle();


  $("#number")
    .textContent =
    "3";


  $("#number")
    .dataset.num =
    "3";


  $$(".chest")
    .forEach(c=>{

      c.classList.remove(
        "selected",
        "open",
        "dim",
        "disabled"
      );


      const r =
        c.querySelector(
          ".chestResult"
        );


      r.textContent =
        "";


      r.className =
        "chestResult";

    });


  selectedPrize =
    null;


  chestResults =
    [];


  chestBusy =
    false;


  busy =
    false;


  setupMode();

}


/* =========================
   EVENTS
========================= */

$("#btnNormal")
  .addEventListener(
    "click",
    testNormal
  );


$("#btnWeak")
  .addEventListener(
    "click",
    testWeak
  );


$("#btnStrong")
  .addEventListener(
    "click",
    testStrong
  );


$("#btnHit")
  .addEventListener(
    "click",
    testHit
  );


$("#start")
  .addEventListener(
    "click",
    productionPlay
  );


$$(".chest")
  .forEach(c=>{

    c.addEventListener(
      "click",
      () =>
        chooseChest(c)
    );

  });


$("#treasureNext")
  .addEventListener(
    "click",
    reset
  );


/* 起動 */

setupMode();

</script>
