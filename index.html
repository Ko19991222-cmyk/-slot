<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COUNTDOWN CHANCE</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

body{
  user-select:none;
}

#stage{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 45%,#241212 0%,#090909 42%,#000 78%);
}

#energy{
  position:absolute;
  inset:-25%;
  opacity:.18;
  transform:scale(1);
  background:
    radial-gradient(circle at center,
    rgba(180,0,0,.28),
    rgba(70,0,0,.12) 28%,
    transparent 62%);
  transition:1s ease;
}

#number{
  position:relative;
  z-index:3;
  font-size:min(49vw,300px);
  font-weight:1000;
  line-height:.9;
  text-shadow:
    0 0 18px rgba(255,255,255,.22),
    0 0 55px rgba(255,0,0,.16);
  transition:.25s;
}

#number.hot{
  transform:scale(1.06);
  text-shadow:
    0 0 20px #ffffff66,
    0 0 60px #ff000055;
}

#status{
  position:absolute;
  bottom:15%;
  font-size:11px;
  letter-spacing:.28em;
  opacity:.28;
}

button{
  border:1px solid #ffffff55;
  color:#fff;
  background:#111;
  border-radius:999px;
  padding:16px 42px;
  font-size:16px;
  font-weight:900;
  letter-spacing:.14em;
}

#start{
  position:absolute;
  bottom:7%;
  z-index:10;
}

/* ===== FX ===== */

#fx{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  overflow:hidden;
  background:#000;
}

#fx.show{
  display:block;
}

#fire{
  position:absolute;
  inset:-25%;
  opacity:0;
  background:
    radial-gradient(circle at center,
    #fff 0%,
    #ffe469 5%,
    #ff6a00 14%,
    #a50000 32%,
    #210000 58%,
    #000 80%);
}

#fire.burst{
  animation:fireBurst 1.2s ease-out forwards;
}

@keyframes fireBurst{
  0%{opacity:0;transform:scale(.7)}
  12%{opacity:1;transform:scale(.9)}
  45%{opacity:.9;transform:scale(1.08)}
  100%{opacity:.4;transform:scale(1.25)}
}

#slash{
  position:absolute;
  left:-30%;
  top:48%;
  width:160%;
  height:18px;
  z-index:9;
  opacity:0;
  transform:rotate(-16deg) scaleX(.02);
  transform-origin:left center;
  background:#fff;
  box-shadow:
    0 0 16px #fff,
    0 0 40px #fff,
    0 0 80px #ff7b00,
    0 0 130px #ff0000;
}

#slash.go{
  animation:slashGo .2s ease-out forwards;
}

@keyframes slashGo{
  0%{
    opacity:0;
    transform:rotate(-16deg) scaleX(.02);
  }
  20%{opacity:1}
  100%{
    opacity:1;
    transform:rotate(-16deg) scaleX(1);
  }
}

#topPanel,#bottomPanel{
  position:absolute;
  inset:-12%;
  z-index:7;
  background:
    radial-gradient(circle,#181818,#050505 60%,#000);
  transition:.6s cubic-bezier(.1,.85,.15,1);
}

#topPanel{
  clip-path:polygon(0 0,100% 0,100% 42%,0 68%);
}

#bottomPanel{
  clip-path:polygon(0 68%,100% 42%,100% 100%,0 100%);
}

#fx.torn #topPanel{
  transform:translate(-12%,-16%) rotate(-2deg);
}

#fx.torn #bottomPanel{
  transform:translate(12%,16%) rotate(2deg);
}

#hit{
  position:absolute;
  inset:0;
  z-index:6;
  display:grid;
  place-items:center;
  opacity:0;
  transform:scale(.4);
  font-size:min(24vw,165px);
  font-weight:1000;
  text-shadow:
    0 0 15px #fff,
    0 0 45px #ff9500,
    0 0 85px #ff0000;
}

#hit.show{
  animation:hitPop .65s cubic-bezier(.08,1.3,.18,1) forwards;
}

@keyframes hitPop{
  0%{opacity:0;transform:scale(.4)}
  55%{opacity:1;transform:scale(1.18)}
  100%{opacity:1;transform:scale(1)}
}

#white{
  position:fixed;
  inset:0;
  z-index:50;
  pointer-events:none;
  background:#fff;
  opacity:0;
}

#white.flash{
  animation:whiteFlash .28s ease-out;
}

@keyframes whiteFlash{
  0%{opacity:0}
  12%{opacity:1}
  100%{opacity:0}
}

#blackout{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  background:#000;
}

.shake{
  animation:shake .32s linear;
}

@keyframes shake{
  0%{transform:translate(0,0)}
  16%{transform:translate(-9px,4px)}
  32%{transform:translate(10px,-5px)}
  48%{transform:translate(-8px,-2px)}
  64%{transform:translate(7px,5px)}
  80%{transform:translate(-4px,-3px)}
  100%{transform:translate(0,0)}
}

/* ===== WIN ===== */

#win{
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  place-items:center;
  text-align:center;
  background:
    radial-gradient(circle,#4b1600 0%,#130000 38%,#000 78%);
}

#winInner{
  opacity:0;
  transform:scale(.6);
}

#win.show #winInner{
  animation:winIn .8s cubic-bezier(.1,1.25,.2,1) forwards;
}

@keyframes winIn{
  to{
    opacity:1;
    transform:scale(1);
  }
}

#winTitle{
  font-size:min(13vw,88px);
  font-weight:1000;
  text-shadow:
    0 0 18px #ffffffaa,
    0 0 50px #ff990088;
}

#winSub{
  margin-top:18px;
  font-size:min(7vw,38px);
  font-weight:900;
}

#next{
  position:absolute;
  bottom:7%;
}
</style>
</head>

<body>

<div id="stage">
  <div id="energy"></div>
  <div id="number">3</div>
  <div id="status">TEST MODE / 100% HIT</div>
  <button id="start">START</button>
</div>

<div id="fx">
  <div id="fire"></div>
  <div id="hit">当たり</div>
  <div id="topPanel"></div>
  <div id="bottomPanel"></div>
  <div id="slash"></div>
</div>

<div id="blackout"></div>
<div id="white"></div>

<div id="win">
  <div id="winInner">
    <div id="winTitle">CONGRATULATIONS</div>
    <div id="winSub">おめでとうございます</div>
  </div>
  <button id="next">NEXT</button>
</div>

<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r=>setTimeout(r,ms));

let ctx;
let busy=false;
let bgm=[];


/* ======================
   AUDIO CORE
====================== */

function initAudio(){

  if(!ctx){
    ctx=new (window.AudioContext||window.webkitAudioContext)();
  }

  if(ctx.state==="suspended"){
    ctx.resume();
  }
}

function tone(
  freq,
  duration=.3,
  volume=.1,
  type="sine",
  delay=0
){

  const o=ctx.createOscillator();
  const g=ctx.createGain();

  const t=ctx.currentTime+delay;

  o.type=type;
  o.frequency.setValueAtTime(freq,t);

  g.gain.setValueAtTime(Math.max(volume,.0001),t);
  g.gain.exponentialRampToValueAtTime(.0001,t+duration);

  o.connect(g);
  g.connect(ctx.destination);

  o.start(t);
  o.stop(t+duration+.05);
}

function noise(duration=.12,volume=.12){

  const length=Math.floor(ctx.sampleRate*duration);

  const buffer=ctx.createBuffer(
    1,
    length,
    ctx.sampleRate
  );

  const data=buffer.getChannelData(0);

  for(let i=0;i<length;i++){
    data[i]=Math.random()*2-1;
  }

  const src=ctx.createBufferSource();
  const filter=ctx.createBiquadFilter();
  const gain=ctx.createGain();

  src.buffer=buffer;

  filter.type="bandpass";
  filter.frequency.value=1450;
  filter.Q.value=.8;

  gain.gain.value=volume;

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    ctx.currentTime+duration
  );

  src.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);

  src.start();
}


/* ======================
   ACTUAL TENSION BGM
====================== */

function startBGM(){

  stopBGM();

  const master=ctx.createGain();

  master.gain.value=.055;
  master.connect(ctx.destination);

  bgm.push(master);

  /*
   Dark repeating chord / melody
  */

  const notes=[
    55,
    65.4,
    73.4,
    82.4
  ];

  let step=0;

  function loop(){

    if(!bgm.length)return;

    const root=notes[step%notes.length];

    const bass=ctx.createOscillator();
    const bassGain=ctx.createGain();

    bass.type="sine";
    bass.frequency.value=root;

    bassGain.gain.setValueAtTime(
      .24,
      ctx.currentTime
    );

    bassGain.gain.exponentialRampToValueAtTime(
      .001,
      ctx.currentTime+.75
    );

    bass.connect(bassGain);
    bassGain.connect(master);

    bass.start();
    bass.stop(ctx.currentTime+.8);

    /* dark upper tone */

    const pad=ctx.createOscillator();
    const padGain=ctx.createGain();

    pad.type="triangle";
    pad.frequency.value=root*2;

    padGain.gain.setValueAtTime(
      .035,
      ctx.currentTime
    );

    padGain.gain.exponentialRampToValueAtTime(
      .001,
      ctx.currentTime+.75
    );

    pad.connect(padGain);
    padGain.connect(master);

    pad.start();
    pad.stop(ctx.currentTime+.8);

    step++;

    bgm.timer=setTimeout(loop,780);
  }

  loop();
}

function increaseBGM(level){

  const master=bgm[0];

  if(!master)return;

  const target=
    level===1 ? .055 :
    level===2 ? .075 :
    .10;

  master.gain.linearRampToValueAtTime(
    target,
    ctx.currentTime+.35
  );
}

function stopBGM(){

  if(bgm.timer){
    clearTimeout(bgm.timer);
  }

  if(bgm[0]){
    try{
      bgm[0].gain.linearRampToValueAtTime(
        .0001,
        ctx.currentTime+.05
      );
    }catch(e){}
  }

  bgm=[];
}


/* ======================
   COUNT SOUNDS
====================== */

function countSound(n){

  const f=
    n===3 ? 58 :
    n===2 ? 66 :
    76;

  tone(f,.42,.22,"sine");
  tone(f*2,.16,.04,"triangle");

  setTimeout(()=>{
    tone(f-8,.22,.11,"sine");
  },210);
}


/* ======================
   SLASH SOUND
====================== */

function slashSound(){

  noise(.13,.24);

  tone(1300,.09,.1,"sawtooth");
  tone(840,.15,.08,"sawtooth",.03);

  setTimeout(()=>{
    tone(54,.7,.5,"sine");
    tone(108,.35,.08,"triangle");
  },55);
}


/* ======================
   ORIGINAL CONFIRM SOUND
====================== */

function confirmSound(){

  /*
    Original "big win" style sound.
    Not copied from any machine.
  */

  const now=ctx.currentTime;

  const o=ctx.createOscillator();
  const g=ctx.createGain();

  o.type="sine";

  o.frequency.setValueAtTime(480,now);
  o.frequency.exponentialRampToValueAtTime(
    1400,
    now+.20
  );
  o.frequency.exponentialRampToValueAtTime(
    2600,
    now+.55
  );

  g.gain.setValueAtTime(.001,now);
  g.gain.linearRampToValueAtTime(.22,now+.04);
  g.gain.exponentialRampToValueAtTime(.001,now+.72);

  o.connect(g);
  g.connect(ctx.destination);

  o.start();
  o.stop(now+.75);

  /* sparkle sequence */

  const notes=[
    1200,
    1450,
    1700,
    2000,
    2350
  ];

  notes.forEach((f,i)=>{
    tone(
      f,
      .12,
      .075,
      "triangle",
      .20+i*.075
    );
  });

  /* final punch */

  tone(72,.65,.36,"sine",.12);
}


/* ======================
   WIN JINGLE
====================== */

function winJingle(){

  const notes=[
    523,
    659,
    784,
    1046
  ];

  notes.forEach((n,i)=>{
    tone(
      n,
      .42,
      .13,
      "triangle",
      i*.18
    );
  });

  tone(
    130,
    1.0,
    .12,
    "sine",
    .15
  );
}


/* ======================
   VISUALS
====================== */

function flash(){

  const f=$("#white");

  f.classList.remove("flash");

  void f.offsetWidth;

  f.classList.add("flash");
}

function shake(){

  document.body.classList.remove("shake");

  void document.body.offsetWidth;

  document.body.classList.add("shake");

  setTimeout(()=>{
    document.body.classList.remove("shake");
  },350);
}

function resetFX(){

  $("#fx").className="";
  $("#slash").className="";
  $("#fire").className="";
  $("#hit").className="";
  $("#blackout").style.display="none";
}


/* ======================
   HIT FX
====================== */

async function cutHit(){

  stopBGM();

  /*
   This silence is intentional.
  */

  await sleep(330);

  $("#fx").className="show";

  await sleep(110);

  $("#slash").className="go";

  slashSound();

  await sleep(115);

  flash();

  $("#fx").classList.add("torn");
  $("#fire").className="burst";

  shake();

  await sleep(260);

  $("#hit").className="show";

  /*
    Delay after impact.
    Then confirmation sound.
  */

  await sleep(160);

  confirmSound();

  await sleep(1500);
}


/* ======================
   COUNTDOWN
====================== */

async function showCount(n,level){

  const number=$("#number");

  number.textContent=n;
  number.className="hot";

  increaseBGM(level);

  $("#energy").style.opacity=
    level===1 ? ".25" :
    level===2 ? ".42" :
    ".62";

  $("#energy").style.transform=
    `scale(${1+level*.08})`;

  countSound(n);

  const hold=
    n===3 ? 1500 :
    n===2 ? 1650 :
    1850;

  await sleep(hold);

  number.className="";

  await sleep(420);
}


/* ======================
   OTHER HIT TYPES
====================== */

async function blackoutHit(){

  stopBGM();

  $("#blackout").style.display="block";

  await sleep(1400);

  tone(34,.8,.18,"sine");

  await sleep(500);

  $("#blackout").style.display="none";

  await cutHit();
}

async function silenceHit(){

  stopBGM();

  $("#number").textContent="";

  await sleep(2100);

  await cutHit();
}

async function revivalHit(){

  stopBGM();

  $("#number").textContent="";

  $("#start").style.display="block";

  await sleep(1900);

  $("#start").style.display="none";

  $("#blackout").style.display="block";

  await sleep(650);

  tone(42,.35,.18,"sine");

  await sleep(500);

  $("#blackout").style.display="none";

  await cutHit();
}


/* ======================
   MAIN
====================== */

async function play(){

  if(busy)return;

  busy=true;

  initAudio();

  resetFX();

  $("#start").style.display="none";

  $("#win").style.display="none";
  $("#win").className="";

  startBGM();

  /*
   TEST MODE: 100% HIT

   0 = hit during 3
   1 = hit during 2
   2 = hit during 1
   3 = blackout after 1
   4 = silence after 1
   5 = revival
  */

  const event=Math.floor(Math.random()*6);


  /* 3 */

  if(event===0){

    $("#number").textContent="3";

    increaseBGM(1);
    countSound(3);

    await sleep(1200);

    await cutHit();

    return finishWin();
  }

  await showCount(3,1);


  /* 2 */

  if(event===1){

    $("#number").textContent="2";

    increaseBGM(2);
    countSound(2);

    await sleep(1350);

    await cutHit();

    return finishWin();
  }

  await showCount(2,2);


  /* 1 */

  if(event===2){

    $("#number").textContent="1";

    increaseBGM(3);
    countSound(1);

    await sleep(1500);

    await cutHit();

    return finishWin();
  }

  await showCount(1,3);


  $("#number").textContent="";


  if(event===3){

    await blackoutHit();

  }else if(event===4){

    await silenceHit();

  }else{

    await revivalHit();
  }


  finishWin();
}


/* ======================
   FINISH
====================== */

async function finishWin(){

  await sleep(600);

  resetFX();

  $("#win").style.display="grid";

  requestAnimationFrame(()=>{
    $("#win").classList.add("show");
  });

  winJingle();
}


/* ======================
   RESET
====================== */

function reset(){

  stopBGM();

  $("#win").style.display="none";
  $("#win").className="";

  resetFX();

  $("#number").textContent="3";
  $("#number").className="";

  $("#energy").style.opacity=".18";
  $("#energy").style.transform="scale(1)";

  $("#start").style.display="block";

  busy=false;
}

$("#start").onclick=play;
$("#next").onclick=reset;

</script>

</body>
</html>
