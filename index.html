<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Red Peanuts</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
body{user-select:none}
button{font-family:inherit}

/* =========================
   MAIN
========================= */

#stage{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#16000c;
}

/* 新しい羽なし背景 */
#bg{
  position:absolute;
  inset:-3%;
  background-image:url("./AAECEFCC-FDEB-4353-9E97-53CA100DE812.png");
  background-repeat:no-repeat;
  background-size:cover;

  /*
    ロゴを少し下へ。
    上が切れにくい位置。
  */
  background-position:center 43%;

  transform:scale(1.02);
  animation:bgFloat 10s ease-in-out infinite alternate;
  transition:
    filter .8s ease,
    transform .8s ease;
}

@keyframes bgFloat{
  0%{
    transform:scale(1.02) translate3d(0,0,0);
  }
  100%{
    transform:scale(1.055) translate3d(0,-.6%,0);
  }
}

/* カウント進行で背景の緊張感 */
#stage.level1 #bg{
  filter:brightness(.96) saturate(1.04);
}
#stage.level2 #bg{
  filter:brightness(.90) saturate(1.13) contrast(1.04);
}
#stage.level3 #bg{
  filter:brightness(.83) saturate(1.24) contrast(1.08);
}

/* 中央の淡い光 */
#ambientGlow{
  position:absolute;
  z-index:2;
  left:50%;
  top:61%;
  width:75vw;
  height:75vw;
  max-width:520px;
  max-height:520px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(
      circle,
      rgba(255,120,190,.13) 0%,
      rgba(255,0,120,.05) 42%,
      transparent 70%
    );
  pointer-events:none;
  animation:ambientPulse 3.8s ease-in-out infinite;
}

@keyframes ambientPulse{
  0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.95)}
  50%{opacity:.9;transform:translate(-50%,-50%) scale(1.08)}
}

/* =========================
   羽レイヤー
========================= */

#featherLayer{
  position:absolute;
  z-index:7;
  inset:-18%;
  pointer-events:none;
  opacity:.36;

  background-image:url("./BC95F3AD-9991-4D85-9E28-79B01586E19F.png");
  background-repeat:repeat;
  background-size:78vw auto;

  animation:featherDrift 18s linear infinite;
  transition:
    opacity .7s ease,
    filter .7s ease;
}

#featherLayer2{
  position:absolute;
  z-index:8;
  inset:-20%;
  pointer-events:none;
  opacity:.18;

  background-image:url("./BC95F3AD-9991-4D85-9E28-79B01586E19F.png");
  background-repeat:repeat;
  background-size:55vw auto;

  transform:scaleX(-1);
  animation:featherDrift2 24s linear infinite;
}

@keyframes featherDrift{
  0%{
    background-position:0 -30vh;
    transform:translate3d(-2%,0,0) rotate(-1deg);
  }
  50%{
    background-position:10vw 25vh;
    transform:translate3d(3%,2%,0) rotate(1deg);
  }
  100%{
    background-position:-8vw 80vh;
    transform:translate3d(-1%,5%,0) rotate(-1deg);
  }
}

@keyframes featherDrift2{
  0%{
    background-position:0 -50vh;
  }
  100%{
    background-position:18vw 100vh;
  }
}

/* 3 */
#stage.level1 #featherLayer{
  opacity:.30;
  animation-duration:18s;
}

/* 2 */
#stage.level2 #featherLayer{
  opacity:.42;
  animation-duration:13s;
}
#stage.level2 #featherLayer2{
  opacity:.22;
  animation-duration:18s;
}

/* 1 */
#stage.level3 #featherLayer{
  opacity:.55;
  animation-duration:8s;
  filter:brightness(1.12);
}
#stage.level3 #featherLayer2{
  opacity:.32;
  animation-duration:11s;
}

/* 当たり時 */
#stage.featherBurst #featherLayer{
  opacity:.95;
  animation-duration:1.8s;
  filter:brightness(1.5);
}
#stage.featherBurst #featherLayer2{
  opacity:.7;
  animation-duration:2.2s;
}

/* =========================
   COUNTDOWN NUMBER
========================= */

#number{
  position:absolute;
  z-index:20;

  left:50%;
  top:61%;

  transform:translate(-50%,-50%);

  font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
  font-size:min(45vw,275px);
  font-weight:900;
  line-height:.82;

  color:#fff8fc;

  -webkit-text-stroke:2px #f3a1cb;

  /*
    ぼやけさせず、
    下方向の影で立体化
  */
  text-shadow:
    0 2px 0 #f8b5d7,
    0 4px 0 #ed8cbd,
    0 7px 0 #d967a5,
    0 10px 0 #b74783,
    0 13px 0 #8c2d64,
    0 17px 9px rgba(25,0,13,.48);

  filter:none;

  transition:
    color .15s,
    opacity .15s,
    transform .15s,
    left .15s,
    top .15s,
    text-shadow .15s;
}

#number.show{
  animation:numberPop .34s cubic-bezier(.2,.8,.2,1);
}

@keyframes numberPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(1.14);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

#number.red{
  color:#fff0f3;
  -webkit-text-stroke:2px #ff354f;
  text-shadow:
    0 2px 0 #ff8190,
    0 5px 0 #f0445d,
    0 8px 0 #bc1734,
    0 12px 0 #7d071d,
    0 16px 8px rgba(30,0,5,.55);
}

#number.gold{
  color:#fffbe5;
  -webkit-text-stroke:2px #ffd94d;
  text-shadow:
    0 2px 0 #ffe999,
    0 5px 0 #f6c833,
    0 8px 0 #d99b00,
    0 12px 0 #976200,
    0 16px 8px rgba(35,18,0,.55);
}

#number.small{
  transform:translate(-50%,-50%) scale(.84);
}
#number.big{
  transform:translate(-50%,-50%) scale(1.16);
}
#number.thin{
  font-weight:400;
}
#number.shiftLeft{
  left:45%;
}
#number.shiftRight{
  left:55%;
}
#number.shiftUp{
  top:58%;
}
#number.double{
  text-shadow:
    7px 0 0 rgba(255,255,255,.25),
    -7px 0 0 rgba(255,0,100,.22),
    0 8px 0 #b74783;
}
#number.mirror{
  transform:translate(-50%,-50%) scaleX(-1);
}
#number.flicker{
  animation:flicker .12s linear 4;
}
@keyframes flicker{
  0%,100%{opacity:1}
  50%{opacity:.05}
}
#number.ghost::after{
  content:attr(data-num);
  position:absolute;
  inset:0;
  transform:translate(13px,9px);
  opacity:.17;
}

/* =========================
   START AREA
========================= */

#startArea{
  position:absolute;
  z-index:30;
  left:50%;
  bottom:max(5.5%,env(safe-area-inset-bottom));
  transform:translateX(-50%);
  width:100%;
  text-align:center;
}

#rate{
  font-size:15px;
  font-weight:900;
  letter-spacing:.13em;
  text-shadow:0 2px 5px rgba(0,0,0,.8);
}

#independent{
  margin-top:5px;
  font-size:11px;
  font-weight:700;
  letter-spacing:.16em;
  opacity:.88;
  text-shadow:0 2px 5px rgba(0,0,0,.8);
}

#start,#next{
  margin-top:14px;
  padding:16px 48px;

  border-radius:999px;
  border:1.5px solid rgba(255,255,255,.9);

  background:
    linear-gradient(
      180deg,
      rgba(255,90,170,.88),
      rgba(174,16,91,.92)
    );

  color:#fff;
  font-size:17px;
  font-weight:900;
  letter-spacing:.15em;

  box-shadow:
    0 0 10px rgba(255,255,255,.5),
    0 0 22px rgba(255,38,143,.6),
    inset 0 1px 0 rgba(255,255,255,.4);
}

#start:active,#next:active{
  transform:scale(.96);
}

/* =========================
   EFFECTS
========================= */

#weirdMark{
  position:fixed;
  z-index:60;
  left:50%;
  top:61%;
  transform:translate(-50%,-50%);

  font-size:min(20vw,110px);
  font-weight:1000;

  display:none;

  text-shadow:
    0 0 10px #fff,
    0 0 30px #ff4ba6;
}

#black{
  position:fixed;
  inset:0;
  z-index:80;
  display:none;
  background:#000;
}

#slash{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  overflow:hidden;
  pointer-events:none;
}

#slash.go{
  display:block;
}

#line{
  position:absolute;
  left:-30%;
  top:50%;
  width:160%;
  height:9px;

  background:#fff;

  box-shadow:
    0 0 15px #fff,
    0 0 40px #fff,
    0 0 90px #ff62b3;

  transform:rotate(-18deg) scaleX(0);
}

#slash.reverse #line{
  transform:rotate(18deg) scaleX(0);
}

#slash.go #line{
  animation:slashAnim .20s ease-out forwards;
}

#slash.go.reverse #line{
  animation:slashReverse .20s ease-out forwards;
}

@keyframes slashAnim{
  to{transform:rotate(-18deg) scaleX(1)}
}
@keyframes slashReverse{
  to{transform:rotate(18deg) scaleX(1)}
}

#flash{
  position:fixed;
  inset:0;
  z-index:350;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

#flash.go{
  animation:flashAnim .45s ease-out;
}

@keyframes flashAnim{
  0%{opacity:0}
  10%{opacity:1}
  28%{opacity:.22}
  40%{opacity:1}
  100%{opacity:0}
}

/* =========================
   HIT
========================= */

#hit{
  position:fixed;
  inset:0;
  z-index:140;

  display:none;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  background:
    radial-gradient(
      circle,
      #9b0048 0%,
      #4c0026 35%,
      #13000a 68%,
      #000 100%
    );
}

#hit.show{
  display:flex;
}

#glow{
  position:absolute;
  width:150vw;
  height:150vw;
  border-radius:50%;

  background:
    conic-gradient(
      transparent,
      rgba(255,215,0,.35),
      transparent,
      rgba(255,0,119,.55),
      transparent
    );

  animation:spin 3s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

#hitText{
  position:relative;
  z-index:5;

  font-size:min(24vw,150px);
  font-weight:1000;

  text-align:center;

  text-shadow:
    0 0 12px #fff,
    0 0 30px #ffe100,
    0 0 70px #ff278d,
    0 0 110px #ff0048;

  animation:hitIn .55s cubic-bezier(.05,1.4,.2,1);
}

#subText{
  position:absolute;
  bottom:25%;
  z-index:5;

  font-size:15px;
  font-weight:900;
  letter-spacing:.16em;
}

@keyframes hitIn{
  0%{
    opacity:0;
    transform:scale(.25);
  }
  70%{
    opacity:1;
    transform:scale(1.18);
  }
  100%{
    transform:scale(1);
  }
}

/* =========================
   TREASURE
========================= */

#treasureIntro{
  position:fixed;
  inset:0;
  z-index:175;

  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:
    radial-gradient(circle,#47102e,#090004 70%,#000);

  text-align:center;
}

#treasureIntro.show{
  display:flex;
}

#introMain{
  font-size:clamp(25px,8vw,50px);
  font-weight:1000;
  letter-spacing:.08em;
}

#introSub{
  margin-top:15px;
  font-size:13px;
  letter-spacing:.16em;
  opacity:.8;
}

#treasureScreen{
  position:fixed;
  inset:0;
  z-index:180;

  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at 50% 42%,
      #311126 0%,
      #10040b 48%,
      #000 100%
    );
}

#treasureScreen.show{
  display:flex;
}

#treasureTitle{
  position:absolute;
  top:11%;
  width:100%;

  text-align:center;

  font-size:clamp(23px,7.5vw,46px);
  font-weight:1000;
  letter-spacing:.08em;

  text-shadow:
    0 0 12px #fff,
    0 0 30px rgba(255,55,155,.5);
}

#treasureSub{
  position:absolute;
  top:19%;
  width:100%;

  text-align:center;

  font-size:13px;
  letter-spacing:.12em;
  opacity:.75;
}

#chests{
  width:min(94vw,700px);

  display:flex;
  justify-content:space-between;
  align-items:flex-end;

  gap:10px;
  padding:0 10px;
}

.chest{
  appearance:none;
  border:none;
  background:transparent;

  width:31%;
  padding:0;

  color:#fff;
  position:relative;

  transition:
    transform .18s,
    filter .18s,
    opacity .18s;
}

.chest:active{
  transform:scale(.94);
}

.chest.disabled{
  pointer-events:none;
}

.chestWrap{
  position:relative;
  width:100%;
  aspect-ratio:1/.88;

  animation:chestFloat 1.5s ease-in-out infinite;
}

.chest:nth-child(2) .chestWrap{
  animation-delay:.15s;
}
.chest:nth-child(3) .chestWrap{
  animation-delay:.3s;
}

@keyframes chestFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.chestBody{
  position:absolute;
  left:10%;
  bottom:7%;

  width:80%;
  height:48%;

  border-radius:8px 8px 18px 18px;

  background:
    linear-gradient(
      90deg,
      #6e2f07 0%,
      #b75b10 18%,
      #7d3406 50%,
      #bf6618 82%,
      #642905 100%
    );

  border:4px solid #dca62f;

  box-shadow:
    inset 0 0 18px rgba(0,0,0,.5),
    0 12px 22px rgba(0,0,0,.7),
    0 0 20px rgba(255,190,60,.2);
}

.chestLid{
  position:absolute;
  left:7%;
  top:22%;

  width:86%;
  height:34%;

  border-radius:50% 50% 7px 7px;

  background:
    linear-gradient(
      90deg,
      #6b2a05,
      #c36813 25%,
      #813605 55%,
      #c9741a 82%,
      #652705
    );

  border:4px solid #e0ad36;

  transform-origin:50% 100%;

  transition:
    transform .6s cubic-bezier(.2,.9,.2,1);

  box-shadow:
    inset 0 0 15px rgba(0,0,0,.45),
    0 0 18px rgba(255,184,43,.22);
}

.chestBand{
  position:absolute;
  left:44%;
  top:18%;

  width:12%;
  height:64%;

  background:
    linear-gradient(#ffe27a,#b37b13,#ffdd65);

  border-radius:4px;
  z-index:4;
}

.chestLock{
  position:absolute;
  left:40%;
  bottom:26%;

  width:20%;
  aspect-ratio:1;

  border-radius:6px;

  background:
    linear-gradient(#ffe98a,#a87511);

  border:2px solid #fff1a5;
  z-index:6;
}

.chestNum{
  margin-top:8px;
  min-height:25px;

  font-size:12px;
  font-weight:900;
  letter-spacing:.10em;
}

.chest.selected .chestWrap{
  animation:chestShake .12s linear infinite;
}

@keyframes chestShake{
  0%{transform:translate(-3px,0) rotate(-1deg)}
  25%{transform:translate(3px,-2px) rotate(1deg)}
  50%{transform:translate(-2px,2px) rotate(-1deg)}
  75%{transform:translate(2px,-1px) rotate(1deg)}
  100%{transform:translate(-3px,0) rotate(-1deg)}
}

.chest.open .chestWrap{
  animation:none;
}

.chest.open .chestLid{
  transform:rotateX(145deg) translateY(-4px);
}

.chest.open{
  transform:scale(1.12);
  filter:brightness(1.3);
}

.chestLight{
  position:absolute;
  left:26%;
  bottom:26%;

  width:48%;
  height:15%;

  opacity:0;

  border-radius:50%;
  background:#fff;

  box-shadow:
    0 0 20px #fff,
    0 0 50px #ffe66a,
    0 0 100px #ffb300;

  z-index:2;
}

.chest.open .chestLight{
  opacity:1;
  animation:lightBurst .7s ease-out forwards;
}

@keyframes lightBurst{
  from{
    transform:scale(.3);
    opacity:1;
  }
  to{
    transform:scale(4.5);
    opacity:0;
  }
}

/* =========================
   PRIZE
========================= */

#prizeBox{
  position:fixed;
  inset:0;
  z-index:230;

  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  overflow:hidden;
}

#prizeBox.show{
  display:flex;
}

#prizeBox.first{
  background:
    radial-gradient(circle,#fff7a0 0%,#d99b00 25%,#5c2500 60%,#000 100%);
}
#prizeBox.second{
  background:
    radial-gradient(circle,#fff 0%,#a9b2be 28%,#272d35 62%,#000 100%);
}
#prizeBox.third{
  background:
    radial-gradient(circle,#ffd2a8 0%,#b75a22 30%,#4c1e08 62%,#000 100%);
}

#prizeBurst{
  position:absolute;
  width:160vw;
  height:160vw;

  border-radius:50%;

  background:
    repeating-conic-gradient(
      rgba(255,255,255,.22) 0deg 4deg,
      transparent 4deg 11deg
    );

  animation:spin 6s linear infinite;
}

#prizeLabel{
  position:relative;
  z-index:3;

  font-size:clamp(72px,28vw,180px);
  font-weight:1000;
  line-height:1;

  text-align:center;

  text-shadow:
    0 0 12px #fff,
    0 0 40px rgba(255,255,255,.7),
    0 0 90px rgba(255,180,0,.7);

  animation:
    prizeIn .7s cubic-bezier(.05,1.5,.2,1);
}

#prizeWon{
  position:relative;
  z-index:3;

  margin-top:20px;

  font-size:clamp(20px,6vw,38px);
  font-weight:1000;
  letter-spacing:.15em;
}

@keyframes prizeIn{
  0%{
    transform:scale(.15) rotate(-8deg);
    opacity:0;
  }
  70%{
    transform:scale(1.18) rotate(2deg);
    opacity:1;
  }
  100%{
    transform:scale(1) rotate(0);
  }
}

#next{
  position:absolute;
  bottom:8%;
  z-index:5;
}

</style>
</head>

<body>

<div id="stage">

  <div id="bg"></div>
  <div id="ambientGlow"></div>

  <div id="featherLayer2"></div>
  <div id="featherLayer"></div>

  <div id="number" data-num="3">3</div>

  <div id="startArea">
    <div id="rate">完全抽選 1/30</div>
    <div id="independent">毎回独立抽選</div>
    <button id="start">START</button>
  </div>

</div>

<div id="weirdMark">?</div>

<div id="black"></div>

<div id="slash">
  <div id="line"></div>
</div>

<div id="flash"></div>

<div id="hit">
  <div id="glow"></div>
  <div id="hitText">当たり</div>
  <div id="subText">CONGRATULATIONS</div>
</div>

<div id="treasureIntro">
  <div id="introMain">ここからが本番。</div>
  <div id="introSub">運命の宝箱が待っている</div>
</div>

<div id="treasureScreen">

  <div id="treasureTitle">
    運命の宝箱を選べ！
  </div>

  <div id="treasureSub">
    この一箱が、結果を決める。
  </div>

  <div id="chests">

    <button class="chest">
      <div class="chestWrap">
        <div class="chestLight"></div>
        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestBand"></div>
        <div class="chestLock"></div>
      </div>
      <div class="chestNum">CHEST 1</div>
    </button>

    <button class="chest">
      <div class="chestWrap">
        <div class="chestLight"></div>
        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestBand"></div>
        <div class="chestLock"></div>
      </div>
      <div class="chestNum">CHEST 2</div>
    </button>

    <button class="chest">
      <div class="chestWrap">
        <div class="chestLight"></div>
        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestBand"></div>
        <div class="chestLock"></div>
      </div>
      <div class="chestNum">CHEST 3</div>
    </button>

  </div>
</div>

<div id="prizeBox">

  <div id="prizeBurst"></div>

  <div id="prizeLabel">
    3等
  </div>

  <div id="prizeWon">
    当選！
  </div>

  <button id="next">
    NEXT
  </button>

</div>

<audio
  id="hitMusic"
  src="./hit_music_final.mp3"
  preload="auto"
  playsinline>
</audio>

<script>

/* =========================
   BASIC
========================= */

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

let busy=false;

let chestBusy=false;
let selectedPrize=null;
let selectedIndex=-1;
let chestResults=[];

let audioCtx=null;

let tensionOsc=[];
let tensionGain=null;
let tensionTimer=null;

const hitMusic=$("#hitMusic");

/* =========================
   AUDIO
========================= */

function initAudio(){

  if(!audioCtx){

    audioCtx=
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(audioCtx.state==="suspended"){
    audioCtx.resume();
  }

}

async function unlockHitMusic(){

  try{

    hitMusic.pause();

    hitMusic.currentTime=0;
    hitMusic.muted=false;
    hitMusic.volume=.001;

    await hitMusic.play();

    await sleep(60);

    hitMusic.pause();
    hitMusic.currentTime=0;
    hitMusic.volume=1;

  }catch(e){

    hitMusic.volume=1;

  }

}

/* =========================
   TENSION SOUND
========================= */

function startTension(){

  initAudio();
  stopTension();

  const now=audioCtx.currentTime;

  tensionGain=audioCtx.createGain();

  const compressor=
    audioCtx.createDynamicsCompressor();

  tensionGain.gain.setValueAtTime(.0001,now);
  tensionGain.gain.exponentialRampToValueAtTime(.055,now+.7);

  const settings=[
    ["sine",92],
    ["triangle",184],
    ["sawtooth",276],
    ["triangle",368]
  ];

  tensionOsc=settings.map(([type,freq])=>{

    const osc=audioCtx.createOscillator();

    osc.type=type;
    osc.frequency.value=freq;

    osc.connect(tensionGain);
    osc.start();

    return osc;

  });

  tensionGain.connect(compressor);
  compressor.connect(audioCtx.destination);

  tensionTimer=setInterval(()=>{

    if(!tensionGain)return;

    const t=audioCtx.currentTime;

    tensionGain.gain.cancelScheduledValues(t);

    tensionGain.gain.setValueAtTime(.025,t);
    tensionGain.gain.exponentialRampToValueAtTime(.085,t+.09);
    tensionGain.gain.exponentialRampToValueAtTime(.025,t+.52);

  },680);

}

function setTensionLevel(level){

  if(!tensionOsc.length)return;

  const base=
    level===1 ? [92,184,276,368] :
    level===2 ? [104,208,312,416] :
                [118,236,354,472];

  tensionOsc.forEach((osc,i)=>{

    try{

      osc.frequency.exponentialRampToValueAtTime(
        base[i],
        audioCtx.currentTime+.25
      );

    }catch(e){}

  });

}

function stopTension(){

  if(tensionTimer){

    clearInterval(tensionTimer);
    tensionTimer=null;

  }

  tensionOsc.forEach(o=>{

    try{o.stop()}catch(e){}

  });

  tensionOsc=[];

  tensionGain=null;

}

/* =========================
   SOUND FX
========================= */

function countSound(n){

  initAudio();

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  const freq={
    3:160,
    2:145,
    1:128,
    0:110
  };

  osc.type="triangle";

  osc.frequency.setValueAtTime(
    freq[n]||140,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    65,
    now+.48
  );

  gain.gain.setValueAtTime(.0001,now);

  gain.gain.exponentialRampToValueAtTime(
    .72,
    now+.012
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+.55
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+.6);

}

function strangeCountSound(){

  initAudio();

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="triangle";

  osc.frequency.setValueAtTime(210,now);

  osc.frequency.exponentialRampToValueAtTime(
    48,
    now+.55
  );

  gain.gain.setValueAtTime(.32,now);

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+.55
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+.6);

}

function puchunSound(){

  initAudio();

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="square";

  osc.frequency.setValueAtTime(280,now);

  osc.frequency.exponentialRampToValueAtTime(
    28,
    now+.12
  );

  gain.gain.setValueAtTime(.4,now);

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+.13
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+.14);

}

function slashSound(){

  initAudio();

  const now=audioCtx.currentTime;

  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();

  osc.type="sawtooth";

  osc.frequency.setValueAtTime(
    1800,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    180,
    now+.16
  );

  gain.gain.setValueAtTime(
    .38,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+.19
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+.2);

  const bass=
    audioCtx.createOscillator();

  const bg=
    audioCtx.createGain();

  bass.type="triangle";

  bass.frequency.setValueAtTime(
    120,
    now
  );

  bass.frequency.exponentialRampToValueAtTime(
    42,
    now+.5
  );

  bg.gain.setValueAtTime(
    .9,
    now
  );

  bg.gain.exponentialRampToValueAtTime(
    .0001,
    now+.52
  );

  bass.connect(bg);
  bg.connect(audioCtx.destination);

  bass.start(now);
  bass.stop(now+.55);

}

async function playHitMusic(){

  try{

    hitMusic.pause();
    hitMusic.currentTime=0;
    hitMusic.volume=1;

    await hitMusic.play();

    setTimeout(()=>{

      let v=1;

      const fade=setInterval(()=>{

        v-=.08;

        if(v<=0){

          clearInterval(fade);

          hitMusic.volume=0;

          hitMusic.pause();

          hitMusic.volume=1;

        }else{

          hitMusic.volume=v;

        }

      },35);

    },14250);

  }catch(e){}

}

function resetNumberStyle(){

  const n=$("#number");

  n.className="";

  n.style.opacity="";
  n.style.transform="";
  n.style.left="";
  n.style.top="";
  n.style.color="";

}

function setStageLevel(value){

  const stage=$("#stage");

  stage.classList.remove(
    "level1",
    "level2",
    "level3"
  );

  if(value===3){

    stage.classList.add("level1");
    setTensionLevel(1);

  }

  if(value===2){

    stage.classList.add("level2");
    setTensionLevel(2);

  }

  if(value===1){

    stage.classList.add("level3");
    setTensionLevel(3);

  }

}

function showNumber(value,sound=true){

  resetNumberStyle();

  const n=$("#number");

  n.textContent=value;
  n.dataset.num=value;

  setStageLevel(Number(value));

  void n.offsetWidth;

  n.classList.add("show");

  if(sound){
    countSound(value);
  }

}

========================= */

async function missStrongFake(){

  const type=
    Math.floor(Math.random()*6);

  await baseMissCount();

  await sleep(1500);

  switch(type){

    /* ガセ斬撃 */
    case 0:

      slashSound();

      $("#slash").className="go";

      await sleep(170);

      $("#slash").className="";

      break;

    /* プチュン暗転 */
    case 1:

      stopTension();

      puchunSound();

      $("#black").style.display="block";

      await sleep(1700);

      $("#black").style.display="none";

      break;

    /* 金1 */
    case 2:

      $("#number").classList.add("gold");

      await sleep(2200);

      break;

    /* ガセ斬撃＋白フラッシュ */
    case 3:

      slashSound();

      $("#slash").className="go";

      await sleep(170);

      flash();

      await sleep(250);

      $("#slash").className="";

      break;

    /* 暗転→1復帰 */
    case 4:

      stopTension();

      $("#black").style.display="block";

      await sleep(1500);

      $("#black").style.display="none";

      showNumber(1,false);

      await sleep(1500);

      break;

    /* 金→無音 */
    case 5:

      $("#number").classList.add("gold");

      stopTension();

      await sleep(2600);

      break;

  }

  stopTension();

  $("#number").textContent="";

  $("#black").style.display="block";

  await sleep(500);

  $("#black").style.display="none";

  await sleep(700);

  reset();

}

/*
  ミス内訳

  通常 50%
  弱ガセ 25%
  強ガセ 25%
*/

async function normalMiss(){

  const r=Math.random();

  if(r<.50){

    return missNormal();

  }

  if(r<.75){

    return missWeakFake();

  }

  return missStrongFake();

}

/* =========================
   TREASURE FLOW
========================= */

async function showTreasureIntro(){

  $("#treasureIntro").className="show";

  await sleep(1700);

  $("#treasureIntro").className="";

  showTreasure();

}

function showTreasure(){

  selectedPrize=
    drawPrize();

  selectedIndex=-1;

  chestResults=[];

  chestBusy=false;

  $$(".chest").forEach(
    (c,i)=>{

      c.classList.remove(
        "selected",
        "open",
        "dim",
        "disabled"
      );

      c.querySelector(
        ".chestNum"
      ).textContent=
        `CHEST ${i+1}`;

    }
  );

  $("#treasureTitle").textContent=
    "運命の宝箱を選べ！";

  $("#treasureSub").textContent=
    "この一箱が、結果を決める。";

  $("#treasureScreen").className=
    "show";

}

/*
  選んだ箱には先に抽選済みの賞。

  残り2箱には
  残った2等級をランダム配置。
*/

function buildChestResults(index){

  const all=[
    "1等",
    "2等",
    "3等"
  ];

  const remaining=
    all.filter(
      x=>x!==selectedPrize.label
    );

  if(Math.random()<.5){

    remaining.reverse();

  }

  chestResults=
    new Array(3);

  chestResults[index]=
    selectedPrize.label;

  const others=
    [0,1,2].filter(
      i=>i!==index
    );

  chestResults[others[0]]=
    remaining[0];

  chestResults[others[1]]=
    remaining[1];

}

async function chooseChest(chest){

  if(chestBusy)return;

  chestBusy=true;

  const chests=$$(".chest");

  selectedIndex=
    chests.indexOf(chest);

  buildChestResults(
    selectedIndex
  );

  chests.forEach(c=>{

    c.classList.add(
      "disabled"
    );

    if(c!==chest){

      c.classList.add(
        "dim"
      );

    }

  });

  chest.classList.add(
    "selected"
  );

  await sleep(1100);

  chest.classList.remove(
    "selected"
  );

  chestSound();

  await sleep(250);

  chest.classList.add(
    "open"
  );

  chest.querySelector(
    ".chestNum"
  ).textContent=
    selectedPrize.label;

  await sleep(350);

  flash();

  await sleep(650);

  await showPrize();

}

async function showPrize(){

  $("#treasureScreen").className="";

  $("#prizeLabel").textContent=
    selectedPrize.label;

  $("#prizeBox").className=
    "show "+
    selectedPrize.className;

  flash();

  await sleep(2300);

  $("#prizeBox").className="";

  await revealRemainingChests();

}

async function revealRemainingChests(){

  $("#treasureScreen").className=
    "show";

  $("#treasureTitle").textContent=
    "残りの宝箱は…";

  $("#treasureSub").textContent=
    "選ばなかった箱もオープン";

  const chests=$$(".chest");

  chests.forEach(c=>{

    c.classList.remove(
      "dim"
    );

  });

  let others=
    chests
      .map(
        (chest,index)=>({
          chest,
          index
        })
      )
      .filter(
        x=>x.index!==selectedIndex
      );

  /*
    開く順番もランダム
  */

  if(Math.random()<.5){

    others.reverse();

  }

  await sleep(850);

  for(const item of others){

    item.chest.classList.add(
      "selected"
    );

    await sleep(450);

    item.chest.classList.remove(
      "selected"
    );

    chestSound();

    item.chest.classList.add(
      "open"
    );

    item.chest.querySelector(
      ".chestNum"
    ).textContent=
      chestResults[item.index];

    flash();

    await sleep(950);

  }

  $("#next").style.display=
    "block";

}

/* =========================
   MAIN PLAY
========================= */

async function play(){

  if(busy)return;

  busy=true;

  initAudio();

  await unlockHitMusic();

  $("#startArea").style.display=
    "none";

  $("#next").style.display=
    "none";

  startTension();

  /*
    ★完全独立抽選★

    STARTを押すたび
    ここで1回だけ抽選。

    当たり = 1/30

    演出途中では
    当たり抽選をしない。
  */

  const win=
    Math.random()<(1/30);

  if(win){

    return runRandomHit();

  }

  return normalMiss();

}

/* =========================
   RESET
========================= */

function reset(){

  stopTension();

  hitMusic.pause();

  try{
    hitMusic.currentTime=0;
  }catch(e){}

  hitMusic.volume=1;

  $("#hit").className="";
  $("#treasureIntro").className="";
  $("#treasureScreen").className="";
  $("#prizeBox").className="";
  $("#slash").className="";

  $("#black").style.display=
    "none";

  $("#weirdMark").style.display=
    "none";

  $("#next").style.display=
    "none";

  $("#stage").className="";

  $("#bg").style.filter="";

  resetNumberStyle();

  $("#number").textContent="3";
  $("#number").dataset.num="3";

  $$(".chest").forEach(
    (c,i)=>{

      c.classList.remove(
        "selected",
        "open",
        "dim",
        "disabled"
      );

      c.querySelector(
        ".chestNum"
      ).textContent=
        `CHEST ${i+1}`;

    }
  );

  $("#startArea").style.display=
    "block";

  selectedPrize=null;
  selectedIndex=-1;
  chestResults=[];

  chestBusy=false;
  busy=false;

}

/* =========================
   EVENTS
========================= */

$("#start").addEventListener(
  "click",
  play
);

$$(".chest").forEach(
  chest=>
    chest.addEventListener(
      "click",
      ()=>chooseChest(chest)
    )
);

$("#next").addEventListener(
  "click",
  reset
);

</script>

</body>
