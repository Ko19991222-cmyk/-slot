<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COUNTDOWN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

body{
  user-select:none;
}

#stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 45%,#171717 0%,#050505 48%,#000 82%);
}

#number{
  font-size:min(60vw,360px);
  font-weight:1000;
  line-height:1;
  text-shadow:
    0 0 15px #fff,
    0 0 40px rgba(255,255,255,.45);
}

#number.show{
  animation:numberIn .45s ease-out;
}

@keyframes numberIn{
  0%{
    opacity:0;
    transform:scale(1.35);
    filter:blur(8px);
  }

  100%{
    opacity:1;
    transform:scale(1);
    filter:blur(0);
  }
}

#start,
#next{
  position:absolute;
  bottom:8%;
  padding:17px 46px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.75);
  color:#fff;
  font-size:17px;
  font-weight:900;
  letter-spacing:.12em;
}

#test{
  position:absolute;
  top:max(25px,env(safe-area-inset-top));
  font-size:10px;
  letter-spacing:.2em;
  opacity:.28;
}

/* 暗転 */

#black{
  position:fixed;
  inset:0;
  z-index:40;
  background:#000;
  display:none;
}

/* 切り裂き */

#slash{
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  overflow:hidden;
  pointer-events:none;
}

#slash.go{
  display:block;
}

#line{
  position:absolute;
  top:50%;
  left:-30%;
  width:160%;
  height:9px;
  background:#fff;
  box-shadow:
    0 0 15px #fff,
    0 0 40px #fff,
    0 0 90px rgba(255,255,255,.95);
  transform:rotate(-18deg) scaleX(0);
}

#slash.go #line{
  animation:slashAnim .2s ease-out forwards;
}

@keyframes slashAnim{
  to{
    transform:rotate(-18deg) scaleX(1);
  }
}

/* 白フラッシュ */

#flash{
  position:fixed;
  inset:0;
  z-index:80;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

#flash.go{
  animation:flashAnim .45s ease-out;
}

@keyframes flashAnim{
  0%{opacity:0}
  10%{opacity:1}
  28%{opacity:.25}
  40%{opacity:1}
  100%{opacity:0}
}

/* 当たり */

#hit{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(
      circle,
      #8b1a00 0%,
      #390000 35%,
      #090000 68%,
      #000 100%
    );
}

#hit.show{
  display:flex;
}

#glow{
  position:absolute;
  width:150vw;
  height:150vw;
  border-radius:50%;
  background:
    conic-gradient(
      transparent,
      rgba(255,180,0,.35),
      transparent,
      rgba(255,0,0,.42),
      transparent
    );
  animation:spin 3s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

#hitText{
  position:relative;
  z-index:5;
  font-size:min(24vw,150px);
  font-weight:1000;
  text-shadow:
    0 0 12px #fff,
    0 0 30px #ffe100,
    0 0 70px #ff4500,
    0 0 110px red;
  animation:hitIn .55s cubic-bezier(.05,1.4,.2,1);
}

@keyframes hitIn{
  0%{
    opacity:0;
    transform:scale(.25);
    filter:blur(10px);
  }

  70%{
    opacity:1;
    transform:scale(1.18);
    filter:blur(0);
  }

  100%{
    transform:scale(1);
  }
}

#congrats{
  position:absolute;
  bottom:20%;
  font-size:14px;
  font-weight:900;
  letter-spacing:.25em;
}

#next{
  display:none;
}

#hit.show #next{
  display:block;
}
</style>
</head>

<body>

<div id="stage">

  <div id="test">
    TEST MODE / 100% HIT
  </div>

  <div id="number">
    3
  </div>

  <button id="start">
    START
  </button>

</div>

<div id="black"></div>

<div id="slash">
  <div id="line"></div>
</div>

<div id="flash"></div>

<div id="hit">

  <div id="glow"></div>

  <div id="hitText">
    当たり
  </div>

  <div id="congrats">
    CONGRATULATIONS
  </div>

  <button id="next">
    NEXT
  </button>

</div>

<audio
  id="hitMusic"
  src="./hit_music.mp3?v=20260912-30"
  preload="auto"
  playsinline>
</audio>

<script>

const $ = s =>
  document.querySelector(s);

const sleep = ms =>
  new Promise(r =>
    setTimeout(r,ms)
  );

let busy = false;

const hitMusic =
  $("#hitMusic");


/* =========================
   WEB AUDIO
========================= */

let audioCtx = null;
let tensionGain = null;
let tensionOsc1 = null;
let tensionOsc2 = null;
let tensionPulseTimer = null;


function initAudio(){

  if(!audioCtx){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }

}


/* =========================
   緊張BGM
========================= */

function startTension(){

  initAudio();

  stopTension();

  const now =
    audioCtx.currentTime;

  tensionGain =
    audioCtx.createGain();

  tensionGain.gain.setValueAtTime(
    0.0001,
    now
  );

  tensionGain.gain.exponentialRampToValueAtTime(
    0.12,
    now + 1.2
  );


  tensionOsc1 =
    audioCtx.createOscillator();

  tensionOsc2 =
    audioCtx.createOscillator();


  tensionOsc1.type =
    "sine";

  tensionOsc2.type =
    "triangle";


  tensionOsc1.frequency.value =
    48;

  tensionOsc2.frequency.value =
    72;


  tensionOsc1.connect(
    tensionGain
  );

  tensionOsc2.connect(
    tensionGain
  );

  tensionGain.connect(
    audioCtx.destination
  );


  tensionOsc1.start();
  tensionOsc2.start();


  /*
    脈打つような緊張感
  */

  tensionPulseTimer =
    setInterval(() => {

      if(!tensionGain) return;

      const t =
        audioCtx.currentTime;

      tensionGain.gain.cancelScheduledValues(t);

      tensionGain.gain.setValueAtTime(
        0.05,
        t
      );

      tensionGain.gain.exponentialRampToValueAtTime(
        0.14,
        t + .12
      );

      tensionGain.gain.exponentialRampToValueAtTime(
        0.05,
        t + .55
      );

    },700);

}


/* =========================
   緊張音停止
========================= */

function stopTension(){

  if(tensionPulseTimer){

    clearInterval(
      tensionPulseTimer
    );

    tensionPulseTimer = null;

  }


  try{
    tensionOsc1?.stop();
  }catch(e){}

  try{
    tensionOsc2?.stop();
  }catch(e){}


  tensionOsc1 = null;
  tensionOsc2 = null;
  tensionGain = null;

}


/* =========================
   カウント音
========================= */

function countSound(step){

  initAudio();

  const now =
    audioCtx.currentTime;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();


  osc.type =
    "sine";


  /*
    3→2→1で少しずつ低く重く
  */

  const freqMap = {
    3:110,
    2:95,
    1:78
  };

  osc.frequency.value =
    freqMap[step] || 90;


  gain.gain.setValueAtTime(
    0.0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    0.35,
    now + .02
  );

  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + .55
  );


  osc.connect(
    gain
  );

  gain.connect(
    audioCtx.destination
  );


  osc.start(now);

  osc.stop(
    now + .6
  );

}


/* =========================
   切り裂きSE
========================= */

function slashSound(){

  initAudio();

  const now =
    audioCtx.currentTime;


  /*
    高い斬撃音
  */

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();


  osc.type =
    "sawtooth";

  osc.frequency.setValueAtTime(
    1200,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    180,
    now + .16
  );


  gain.gain.setValueAtTime(
    .25,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now + .18
  );


  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );


  osc.start(now);

  osc.stop(
    now + .2
  );


  /*
    低音ドン
  */

  const bass =
    audioCtx.createOscillator();

  const bassGain =
    audioCtx.createGain();


  bass.type =
    "sine";

  bass.frequency.setValueAtTime(
    90,
    now
  );

  bass.frequency.exponentialRampToValueAtTime(
    35,
    now + .4
  );


  bassGain.gain.setValueAtTime(
    .65,
    now
  );

  bassGain.gain.exponentialRampToValueAtTime(
    .0001,
    now + .45
  );


  bass.connect(
    bassGain
  );

  bassGain.connect(
    audioCtx.destination
  );


  bass.start(now);

  bass.stop(
    now + .5
  );

}


/* =========================
   当たり曲
========================= */

async function playHitMusic(){

  try{

    hitMusic.pause();

    hitMusic.currentTime = 0;

    hitMusic.muted = false;

    hitMusic.volume = 1;

    await hitMusic.play();

  }catch(e){

    console.log(
      "HIT MUSIC ERROR",
      e
    );

  }

}


/* =========================
   数字
========================= */

function showNumber(n){

  const el =
    $("#number");

  el.className = "";

  el.textContent = n;

  void el.offsetWidth;

  el.className = "show";

  countSound(n);

}


/* =========================
   フラッシュ
========================= */

function flash(){

  const el =
    $("#flash");

  el.className = "";

  void el.offsetWidth;

  el.className = "go";

}


/* =========================
   当たり
========================= */

async function showHit(){

  $("#hit").className =
    "show";

  await playHitMusic();

}


/* =========================
   切り裂き
========================= */

async function slashHit(){

  /*
    当たりが来た瞬間
    カウントBGMを止める
  */

  stopTension();


  /*
    一瞬の無音
  */

  await sleep(180);


  slashSound();


  $("#slash").className =
    "go";


  await sleep(170);


  flash();


  await sleep(300);


  $("#slash").className =
    "";


  await showHit();

}


/* =========================
   暗転
========================= */

async function blackoutHit(){

  stopTension();

  $("#black").style.display =
    "block";

  await sleep(1400);

  $("#black").style.display =
    "none";

  await slashHit();

}


/* =========================
   復活
========================= */

async function revivalHit(){

  $("#number").textContent =
    "";

  await sleep(1100);

  stopTension();

  $("#black").style.display =
    "block";

  await sleep(900);

  $("#black").style.display =
    "none";

  await slashHit();

}


/* =========================
   START
========================= */

async function play(){

  if(busy) return;

  busy = true;


  initAudio();


  /*
    iPhone用
    音源読み込み
  */

  try{
    hitMusic.load();
  }catch(e){}


  $("#start").style.display =
    "none";


  $("#hit").className =
    "";


  startTension();


  /*
    現在は100%当たりテスト
  */

  const pattern =
    Math.floor(
      Math.random() * 6
    );


  /* ===== 3 ===== */

  showNumber(3);


  if(pattern === 0){

    await sleep(1450);

    await slashHit();

    return;
  }


  await sleep(2100);


  /* ===== 2 ===== */

  showNumber(2);


  if(pattern === 1){

    await sleep(1550);

    await slashHit();

    return;
  }


  await sleep(2250);


  /* ===== 1 ===== */

  showNumber(1);


  if(pattern === 2){

    await sleep(1750);

    await slashHit();

    return;
  }


  await sleep(2450);


  $("#number").textContent =
    "";


  /* ===== 1の後 ===== */

  if(pattern === 3){

    await sleep(700);

    await slashHit();

  }

  else if(pattern === 4){

    await blackoutHit();

  }

  else{

    await revivalHit();

  }

}


/* =========================
   NEXT
========================= */

function reset(){

  stopTension();


  hitMusic.pause();

  try{
    hitMusic.currentTime = 0;
  }catch(e){}


  $("#hit").className =
    "";

  $("#slash").className =
    "";

  $("#black").style.display =
    "none";


  $("#number").textContent =
    "3";

  $("#number").className =
    "";


  $("#start").style.display =
    "block";


  busy = false;

}


$("#start").addEventListener(
  "click",
  play
);


$("#next").addEventListener(
  "click",
  reset
);

</script>

</body>
</html>
