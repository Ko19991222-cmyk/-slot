<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COUNTDOWN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

body{
  user-select:none;
}

#stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 45%,#161616 0%,#050505 48%,#000 82%);
}

#number{
  font-size:min(60vw,360px);
  font-weight:1000;
  line-height:1;
  text-shadow:
    0 0 15px #fff,
    0 0 40px rgba(255,255,255,.45);
}

#number.show{
  animation:numberIn .45s ease-out;
}

@keyframes numberIn{
  0%{
    opacity:0;
    transform:scale(1.35);
    filter:blur(8px);
  }
  100%{
    opacity:1;
    transform:scale(1);
    filter:blur(0);
  }
}

#start,
#next{
  position:absolute;
  bottom:8%;
  padding:17px 46px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.72);
  color:#fff;
  font-size:17px;
  font-weight:900;
  letter-spacing:.12em;
}

#test{
  position:absolute;
  top:max(25px,env(safe-area-inset-top));
  font-size:10px;
  letter-spacing:.2em;
  opacity:.25;
}

/* 暗転 */

#black{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  background:#000;
}

/* 切り裂き */

#slash{
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  overflow:hidden;
  pointer-events:none;
}

#slash.go{
  display:block;
}

#line{
  position:absolute;
  top:50%;
  left:-30%;
  width:160%;
  height:9px;
  background:#fff;
  box-shadow:
    0 0 15px #fff,
    0 0 35px #fff,
    0 0 80px rgba(255,255,255,.9);
  transform:rotate(-18deg) scaleX(0);
}

#slash.go #line{
  animation:slashAnim .2s ease-out forwards;
}

@keyframes slashAnim{
  0%{
    transform:rotate(-18deg) scaleX(0);
  }
  100%{
    transform:rotate(-18deg) scaleX(1);
  }
}

/* 白フラッシュ */

#flash{
  position:fixed;
  inset:0;
  z-index:80;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

#flash.go{
  animation:flashAnim .45s ease-out;
}

@keyframes flashAnim{
  0%{opacity:0;}
  10%{opacity:1;}
  28%{opacity:.3;}
  40%{opacity:1;}
  100%{opacity:0;}
}

/* 当たり */

#hit{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  background:
    radial-gradient(circle,
      #8a1900 0%,
      #360000 35%,
      #090000 68%,
      #000 100%);
}

#hit.show{
  display:flex;
}

#glow{
  position:absolute;
  width:150vw;
  height:150vw;
  border-radius:50%;

  background:
    conic-gradient(
      transparent,
      rgba(255,170,0,.35),
      transparent,
      rgba(255,0,0,.4),
      transparent
    );

  animation:rotateGlow 3s linear infinite;
}

@keyframes rotateGlow{
  to{
    transform:rotate(360deg);
  }
}

#hitText{
  position:relative;
  z-index:5;
  font-size:min(24vw,150px);
  font-weight:1000;

  text-shadow:
    0 0 12px #fff,
    0 0 30px #ffe100,
    0 0 70px #ff4500,
    0 0 110px red;

  animation:hitIn .55s cubic-bezier(.05,1.4,.2,1);
}

@keyframes hitIn{
  0%{
    opacity:0;
    transform:scale(.25);
    filter:blur(10px);
  }

  70%{
    opacity:1;
    transform:scale(1.18);
    filter:blur(0);
  }

  100%{
    transform:scale(1);
  }
}

#congrats{
  position:absolute;
  bottom:20%;
  font-size:14px;
  font-weight:900;
  letter-spacing:.25em;
}

#next{
  display:none;
}

#hit.show #next{
  display:block;
}
</style>
</head>

<body>

<div id="stage">

  <div id="test">
    TEST MODE / 100% HIT
  </div>

  <div id="number">
    3
  </div>

  <button id="start">
    START
  </button>

</div>


<div id="black"></div>


<div id="slash">
  <div id="line"></div>
</div>


<div id="flash"></div>


<div id="hit">

  <div id="glow"></div>

  <div id="hitText">
    当たり
  </div>

  <div id="congrats">
    CONGRATULATIONS
  </div>

  <button id="next">
    NEXT
  </button>

</div>


<!--
★ 新しい完成版の音
★ ?v=4 で古いキャッシュを回避
-->
<audio
  id="hitMusic"
  src="./hit_music_final.mp3?v=4"
  preload="auto"
  playsinline>
</audio>


<script>

const $ = s =>
  document.querySelector(s);

const sleep = ms =>
  new Promise(resolve =>
    setTimeout(resolve,ms)
  );

let busy = false;

const hitMusic =
  $("#hitMusic");


/* =========================
   音源準備
========================= */

async function unlockAudio(){

  hitMusic.muted = true;

  try{

    hitMusic.currentTime = 0;

    await hitMusic.play();

    hitMusic.pause();

    hitMusic.currentTime = 0;

  }catch(e){

    console.log(e);

  }

  hitMusic.muted = false;

}


/* =========================
   当たり音
========================= */

async function playHitMusic(){

  hitMusic.pause();

  try{
    hitMusic.currentTime = 0;
  }catch(e){}

  hitMusic.muted = false;

  hitMusic.volume = 1;

  try{

    await hitMusic.play();

  }catch(e){

    console.log(
      "HIT MUSIC ERROR",
      e
    );

  }

}


/* =========================
   数字
========================= */

function showNumber(n){

  const el =
    $("#number");

  el.className = "";

  el.textContent = n;

  void el.offsetWidth;

  el.className = "show";

}


/* =========================
   フラッシュ
========================= */

function flash(){

  const el =
    $("#flash");

  el.className = "";

  void el.offsetWidth;

  el.className = "go";

}


/* =========================
   ★ 当たり確定
========================= */

async function showHit(){

  $("#hit").className =
    "show";

  /*
    当たり表示と同時に
    完成版の音を必ず頭から再生
  */

  await playHitMusic();

}


/* =========================
   切り裂き
========================= */

async function slashHit(){

  /*
    一瞬の溜め
  */

  await sleep(300);


  $("#slash").className =
    "go";


  await sleep(180);


  flash();


  await sleep(280);


  $("#slash").className =
    "";


  /*
    ★どの当たりも最終的にここ
  */

  await showHit();

}


/* =========================
   暗転
========================= */

async function blackoutHit(){

  $("#black").style.display =
    "block";


  await sleep(1400);


  $("#black").style.display =
    "none";


  await slashHit();

}


/* =========================
   復活
========================= */

async function revivalHit(){

  $("#number").textContent =
    "";


  await sleep(1300);


  $("#black").style.display =
    "block";


  await sleep(900);


  $("#black").style.display =
    "none";


  await slashHit();

}


/* =========================
   START
========================= */

async function play(){

  if(busy) return;

  busy = true;


  /*
    iPhoneで後から音を
    鳴らせるようにする
  */

  await unlockAudio();


  $("#start").style.display =
    "none";


  $("#hit").className =
    "";


  /*
    現在はテスト用100%当たり

    0 = 3途中
    1 = 2途中
    2 = 1途中
    3 = 1の後
    4 = 暗転
    5 = 復活
  */

  const pattern =
    Math.floor(
      Math.random() * 6
    );


  /* ===== 3 ===== */

  showNumber(3);


  if(pattern === 0){

    await sleep(1450);

    return slashHit();

  }


  await sleep(2100);


  /* ===== 2 ===== */

  showNumber(2);


  if(pattern === 1){

    await sleep(1550);

    return slashHit();

  }


  await sleep(2250);


  /* ===== 1 ===== */

  showNumber(1);


  if(pattern === 2){

    await sleep(1750);

    return slashHit();

  }


  await sleep(2450);


  $("#number").textContent =
    "";


  /* ===== 1の後 ===== */

  if(pattern === 3){

    await sleep(700);

    await slashHit();

  }

  else if(pattern === 4){

    await blackoutHit();

  }

  else{

    await revivalHit();

  }

}


/* =========================
   NEXT
========================= */

function reset(){

  hitMusic.pause();

  try{
    hitMusic.currentTime = 0;
  }catch(e){}


  $("#hit").className =
    "";

  $("#slash").className =
    "";

  $("#black").style.display =
    "none";


  $("#number").textContent =
    "3";

  $("#number").className =
    "";


  $("#start").style.display =
    "block";


  busy = false;

}


$("#start").addEventListener(
  "click",
  play
);


$("#next").addEventListener(
  "click",
  reset
);

</script>

</body>
</html>
