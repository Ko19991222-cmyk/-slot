<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COUNTDOWN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

#stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle,#151515 0%,#050505 48%,#000 80%);
}

#number{
  font-size:min(60vw,360px);
  font-weight:1000;
  text-shadow:0 0 15px #fff,0 0 35px rgba(255,255,255,.4);
}

#number.show{
  animation:numberIn .45s ease-out;
}

@keyframes numberIn{
  0%{
    opacity:0;
    transform:scale(1.35);
    filter:blur(8px);
  }
  100%{
    opacity:1;
    transform:scale(1);
    filter:blur(0);
  }
}

#start,
#next{
  position:absolute;
  bottom:8%;
  padding:16px 45px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.7);
  color:white;
  font-size:17px;
  font-weight:900;
}

#test{
  position:absolute;
  top:25px;
  font-size:10px;
  opacity:.3;
  letter-spacing:.2em;
}

#black{
  position:fixed;
  inset:0;
  background:#000;
  z-index:30;
  display:none;
}

#slash{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  overflow:hidden;
}

#line{
  position:absolute;
  top:50%;
  left:-30%;
  width:160%;
  height:9px;
  background:#fff;
  box-shadow:0 0 20px #fff,0 0 60px #fff;
  transform:rotate(-18deg) scaleX(0);
}

#slash.go{
  display:block;
}

#slash.go #line{
  animation:slashAnim .2s ease-out forwards;
}

@keyframes slashAnim{
  to{
    transform:rotate(-18deg) scaleX(1);
  }
}

#flash{
  position:fixed;
  inset:0;
  background:#fff;
  z-index:70;
  opacity:0;
  pointer-events:none;
}

#flash.go{
  animation:flashAnim .4s ease-out;
}

@keyframes flashAnim{
  0%{opacity:0;}
  15%{opacity:1;}
  100%{opacity:0;}
}

#hit{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle,#861900 0%,#330000 35%,#080000 70%,#000 100%);
}

#hit.show{
  display:flex;
}

#hitText{
  font-size:min(24vw,150px);
  font-weight:1000;
  text-shadow:
    0 0 12px #fff,
    0 0 30px #ffd700,
    0 0 70px #ff4500;
  animation:hitIn .5s cubic-bezier(.1,1.4,.2,1);
}

@keyframes hitIn{
  0%{
    opacity:0;
    transform:scale(.3);
  }
  70%{
    opacity:1;
    transform:scale(1.2);
  }
  100%{
    transform:scale(1);
  }
}

#next{
  display:none;
}

#hit.show #next{
  display:block;
}
</style>
</head>

<body>

<div id="stage">
  <div id="test">TEST MODE / 100% HIT</div>
  <div id="number">3</div>
  <button id="start">START</button>
</div>

<div id="black"></div>

<div id="slash">
  <div id="line"></div>
</div>

<div id="flash"></div>

<div id="hit">
  <div id="hitText">当たり</div>
  <button id="next">NEXT</button>
</div>

<audio id="hitMusic" src="./hit_music.mp3" preload="auto"></audio>

<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r,ms));

let busy = false;

const hitMusic = $("#hitMusic");

function showNumber(n){
  const el = $("#number");

  el.className = "";
  el.textContent = n;

  void el.offsetWidth;

  el.className = "show";
}

function flash(){
  const el = $("#flash");

  el.className = "";

  void el.offsetWidth;

  el.className = "go";
}

async function prepareAudio(){

  try{
    hitMusic.load();

    hitMusic.muted = true;

    await hitMusic.play();

    hitMusic.pause();

    hitMusic.currentTime = 0;

    hitMusic.muted = false;
  }
  catch(e){
    hitMusic.muted = false;
  }
}

async function playHitMusic(){

  try{
    hitMusic.pause();
    hitMusic.currentTime = 0;
    hitMusic.volume = 1;

    await hitMusic.play();
  }
  catch(e){
    console.log("audio error", e);
  }
}

async function showHit(){

  $("#hit").className = "show";

  await playHitMusic();
}

async function slashHit(){

  await sleep(300);

  $("#slash").className = "go";

  await sleep(180);

  flash();

  await sleep(300);

  $("#slash").className = "";

  await showHit();
}

async function blackoutHit(){

  $("#black").style.display = "block";

  await sleep(1400);

  $("#black").style.display = "none";

  await slashHit();
}

async function revivalHit(){

  $("#number").textContent = "";

  await sleep(1300);

  $("#black").style.display = "block";

  await sleep(900);

  $("#black").style.display = "none";

  await slashHit();
}

async function play(){

  if(busy) return;

  busy = true;

  $("#start").style.display = "none";
  $("#hit").className = "";

  await prepareAudio();

  const pattern = Math.floor(Math.random()*6);

  showNumber(3);

  if(pattern === 0){
    await sleep(1450);
    return slashHit();
  }

  await sleep(2100);

  showNumber(2);

  if(pattern === 1){
    await sleep(1550);
    return slashHit();
  }

  await sleep(2250);

  showNumber(1);

  if(pattern === 2){
    await sleep(1750);
    return slashHit();
  }

  await sleep(2450);

  $("#number").textContent = "";

  if(pattern === 3){
    await sleep(700);
    await slashHit();
  }
  else if(pattern === 4){
    await blackoutHit();
  }
  else{
    await revivalHit();
  }
}

function reset(){

  hitMusic.pause();

  try{
    hitMusic.currentTime = 0;
  }catch(e){}

  $("#hit").className = "";
  $("#slash").className = "";
  $("#black").style.display = "none";

  $("#number").textContent = "3";
  $("#number").className = "";

  $("#start").style.display = "block";

  busy = false;
}

$("#start").addEventListener("click",play);
$("#next").addEventListener("click",reset);
</script>

</body>
</html>
