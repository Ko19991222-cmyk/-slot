<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RP COUNTDOWN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}
html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#120008;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  user-select:none;
}
body{
  position:fixed;
  inset:0;
}
#game{
  position:absolute;
  inset:0;
  overflow:hidden;
  background-image:url("./9E28B31B-C619-4F41-AB55-91C025168D02.png");
  background-size:auto 100%;
  background-position:center top;
  background-repeat:no-repeat;
  background-color:#120008;
}

/* =========================
   START
========================= */
#startScreen{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding-bottom:max(9vh,55px);
  background:rgba(20,0,10,.16);
}
#startButton{
  width:min(78vw,390px);
  padding:20px;
  border:2px solid rgba(255,255,255,.9);
  border-radius:999px;
  background:linear-gradient(#ff78b9,#d51c72);
  color:#fff;
  font-size:32px;
  font-weight:900;
  letter-spacing:.1em;
  box-shadow:0 7px 0 #8f0045,0 12px 25px rgba(0,0,0,.45);
}
#startButton:active{
  transform:translateY(5px);
  box-shadow:0 2px 0 #8f0045,0 7px 15px rgba(0,0,0,.35);
}
#probability{
  margin-top:20px;
  color:#fff;
  text-align:center;
  font-size:14px;
  line-height:1.8;
  font-weight:700;
  text-shadow:0 2px 5px #000;
}

/* =========================
   COUNTDOWN
========================= */
#number{
  position:absolute;
  z-index:30;
  left:50%;
  top:61%;
  transform:translate(-50%,-50%);
  font-size:min(52vw,255px);
  line-height:1;
  font-weight:1000;
  color:#fff7fb;
  -webkit-text-stroke:clamp(5px,1.6vw,9px) #ff4b9d;
  text-shadow:
    0 6px 0 #d82779,
    0 12px 0 #a80052,
    0 18px 8px rgba(60,0,28,.72);
  display:none;
  pointer-events:none;
}
.numberPop{
  animation:numberPop .20s ease-out;
}
@keyframes numberPop{
  0%{transform:translate(-50%,-50%) scale(.78);}
  70%{transform:translate(-50%,-50%) scale(1.07);}
  100%{transform:translate(-50%,-50%) scale(1);}
}
#message{
  position:absolute;
  z-index:35;
  left:50%;
  top:61%;
  transform:translate(-50%,-50%);
  width:100%;
  text-align:center;
  color:#fff;
  font-size:90px;
  font-weight:1000;
  -webkit-text-stroke:3px #ff4b9d;
  text-shadow:0 5px 0 #c8186b,0 10px 12px rgba(0,0,0,.7);
  display:none;
}
.goldNumber{
  color:#fff6bd !important;
  -webkit-text-stroke-color:#f0ad00 !important;
}
.redNumber{
  color:#fff !important;
  -webkit-text-stroke-color:#ff1717 !important;
}

/* =========================
   SHOOTING STARS
========================= */
#starLayer{
  position:absolute;
  inset:0;
  z-index:20;
  overflow:hidden;
  pointer-events:none;
}
.shootingStar{
  position:absolute;
  width:13px;
  height:13px;
  border-radius:50%;
  background:#fff;
  opacity:0;
  filter:drop-shadow(0 0 7px #fff) drop-shadow(0 0 17px #ffcce5);
  animation:shoot var(--duration) cubic-bezier(.12,.65,.25,1) forwards;
}
.shootingStar::before{
  content:"";
  position:absolute;
  right:3px;
  top:50%;
  width:var(--tail);
  height:5px;
  transform:translateY(-50%);
  background:linear-gradient(90deg,transparent,rgba(255,230,246,.4),#fff);
  border-radius:100%;
}
.shootingStar::after{
  content:"";
  position:absolute;
  inset:-7px;
  border-radius:50%;
  background:rgba(255,255,255,.5);
  filter:blur(7px);
}
@keyframes shoot{
  0%{
    opacity:0;
    transform:translate3d(0,0,0) rotate(var(--angle)) scale(.4);
  }
  8%{opacity:1;}
  70%{opacity:1;}
  100%{
    opacity:0;
    transform:translate3d(var(--travelX),var(--travelY),0) rotate(var(--angle)) scale(.7);
  }
}

/* =========================
   HIT
========================= */
#blackout{
  position:absolute;
  inset:0;
  z-index:50;
  background:#000;
  opacity:0;
  pointer-events:none;
}
#hitDark{
  position:absolute;
  inset:0;
  z-index:55;
  opacity:0;
  pointer-events:none;
  background:radial-gradient(circle at center,
    rgba(0,0,0,.12) 0%,
    rgba(0,0,0,.72) 65%,
    rgba(0,0,0,.98) 100%);
}
#slashLayer{
  position:absolute;
  inset:0;
  z-index:70;
  overflow:hidden;
  pointer-events:none;
}
.slash{
  position:absolute;
  left:-35%;
  top:49%;
  width:170%;
  height:28px;
  opacity:0;
  border-radius:100%;
  background:linear-gradient(
    90deg,
    transparent 0%,
    #ff2d91 12%,
    #fff 35%,
    #fff 65%,
    #ff2d91 88%,
    transparent 100%
  );
  box-shadow:
    0 0 8px #fff,
    0 0 20px #fff,
    0 0 42px #ff54a6,
    0 0 85px #ff0077,
    0 0 130px rgba(255,0,119,.75);
  transform:rotate(-18deg) scaleX(.02);
  animation:slashImpact .72s cubic-bezier(.05,.82,.12,1) forwards;
}
.slash::before{
  content:"";
  position:absolute;
  left:5%;
  right:5%;
  top:-25px;
  height:78px;
  background:linear-gradient(transparent,rgba(255,255,255,.8),transparent);
  filter:blur(14px);
}
.slash::after{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  top:50%;
  height:5px;
  transform:translateY(-50%);
  background:#fff;
  box-shadow:0 0 12px #fff,0 0 25px #fff;
}
.slash.second{
  top:53%;
  animation-name:slashImpact2;
  animation-delay:.08s;
}
@keyframes slashImpact{
  0%{opacity:0;transform:rotate(-18deg) scaleX(.01);}
  8%{opacity:1;}
  30%{opacity:1;transform:rotate(-18deg) scaleX(1);}
  65%{opacity:1;transform:rotate(-18deg) scaleX(1.03);}
  100%{opacity:0;transform:rotate(-18deg) scaleX(1.08);}
}
@keyframes slashImpact2{
  0%{opacity:0;transform:rotate(19deg) scaleX(.01);}
  8%{opacity:1;}
  30%{opacity:1;transform:rotate(19deg) scaleX(1);}
  65%{opacity:1;transform:rotate(19deg) scaleX(1.03);}
  100%{opacity:0;transform:rotate(19deg) scaleX(1.08);}
}
#flash{
  position:absolute;
  inset:0;
  z-index:75;
  background:#fff;
  opacity:0;
  pointer-events:none;
}
.flashExplosion{
  animation:flashExplosion .55s ease-out forwards;
}
@keyframes flashExplosion{
  0%{opacity:0;}
  8%{opacity:1;}
  25%{opacity:1;}
  55%{opacity:.7;}
  100%{opacity:0;}
}
#hitText{
  position:absolute;
  z-index:85;
  left:50%;
  top:52%;
  width:180vw;
  text-align:center;
  color:#fff7c7;
  font-size:min(43vw,220px);
  line-height:.9;
  font-weight:1000;
  letter-spacing:-.08em;
  -webkit-text-stroke:clamp(7px,2.4vw,13px) #ff0877;
  text-shadow:
    0 8px 0 #d00060,
    0 17px 0 #730035,
    0 0 12px #fff,
    0 0 30px #fff,
    0 0 55px #ff48a0,
    0 0 100px #ff0073;
  opacity:0;
  transform:translate(-50%,-50%) scale(1);
  pointer-events:none;
}
.hitTextImpact{
  animation:hitTextImpact .82s cubic-bezier(.12,.9,.18,1.12) forwards;
}
@keyframes hitTextImpact{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(4.2);
    filter:brightness(4) blur(5px);
  }
  18%{
    opacity:1;
    transform:translate(-50%,-50%) scale(.72);
    filter:brightness(1.7) blur(0);
  }
  38%{transform:translate(-50%,-50%) scale(1.22);}
  55%{transform:translate(-50%,-50%) scale(.94);}
  72%{transform:translate(-50%,-50%) scale(1.08);}
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    filter:brightness(1);
  }
}
.hitTextPulse{
  animation:hitTextPulse .36s ease-out;
}
@keyframes hitTextPulse{
  0%{transform:translate(-50%,-50%) scale(1);}
  35%{transform:translate(-50%,-50%) scale(1.18);}
  100%{transform:translate(-50%,-50%) scale(1);}
}
.hitShake{
  animation:hitShake .48s linear;
}
@keyframes hitShake{
  0%{transform:translate(0,0) scale(1);}
  8%{transform:translate(-20px,12px) scale(1.025);}
  16%{transform:translate(18px,-11px) scale(1.03);}
  25%{transform:translate(-15px,-9px) scale(1.025);}
  34%{transform:translate(13px,10px) scale(1.02);}
  44%{transform:translate(-10px,7px) scale(1.015);}
  55%{transform:translate(8px,-6px) scale(1.01);}
  68%{transform:translate(-5px,4px) scale(1.005);}
  82%{transform:translate(3px,-2px) scale(1);}
  100%{transform:translate(0,0) scale(1);}
}
.hitZoom{
  animation:hitZoom .65s ease-out;
}
@keyframes hitZoom{
  0%{background-size:auto 100%;}
  20%{background-size:auto 108%;}
  100%{background-size:auto 100%;}
}

/* =========================
   TREASURE
========================= */
#treasure{
  position:absolute;
  inset:0;
  z-index:110;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(18,0,8,.84);
  backdrop-filter:blur(3px);
  color:#fff;
  padding:20px;
}
#treasureTitle{
  text-align:center;
  font-size:24px;
  line-height:1.55;
  font-weight:900;
  text-shadow:0 2px 10px #000;
  margin-bottom:32px;
}
#chests{
  display:flex;
  width:100%;
  max-width:520px;
  justify-content:space-around;
  align-items:center;
  gap:8px;
}

/* 箱全体 */
.chest{
  width:30%;
  aspect-ratio:1 / 1.05;
  border:0;
  padding:0;
  background:transparent;
  position:relative;
  color:#fff;
  overflow:visible;
}

/* 箱本体 */
.chestBody{
  position:absolute;
  left:5%;
  bottom:8%;
  width:90%;
  height:57%;
  border-radius:8px 8px 18px 18px;
  background:linear-gradient(
    180deg,
    #ff87bd 0%,
    #dc2b7b 45%,
    #a80d58 100%
  );
  border:4px solid #ffe3f0;
  box-shadow:
    inset 0 8px 8px rgba(255,255,255,.25),
    inset 0 -10px 12px rgba(87,0,38,.28),
    0 8px 0 #690033,
    0 14px 20px rgba(0,0,0,.5);
  z-index:2;
}
.chestBand{
  position:absolute;
  left:50%;
  top:0;
  transform:translateX(-50%);
  width:20%;
  height:100%;
  background:linear-gradient(90deg,#ffcf5a,#fff2a6,#d88c00);
  border-left:2px solid #9e6500;
  border-right:2px solid #9e6500;
}

/* ========================================
   フタ

   rotateXは一切使わない。
   2Dの translate + rotate のみ。
======================================== */
.chestLid{
  position:absolute;
  left:3%;
  top:17%;
  width:94%;
  height:38%;
  border-radius:30px 30px 8px 8px;
  background:linear-gradient(
    180deg,
    #ffc0dc 0%,
    #f45d9e 45%,
    #c71869 100%
  );
  border:4px solid #fff0f7;
  box-shadow:
    inset 0 8px 8px rgba(255,255,255,.35),
    0 5px 0 #8e0045,
    0 8px 12px rgba(0,0,0,.4);
  z-index:6;

  transform-origin:88% 92%;
  transform:translate(0,0) rotate(0deg);

  transition:
    transform .48s cubic-bezier(.18,.85,.22,1.15),
    filter .25s,
    opacity .25s;
}

/* フタの金バンド */
.chestLid::after{
  content:"";
  position:absolute;
  left:40%;
  top:-4px;
  width:20%;
  height:calc(100% + 8px);
  background:linear-gradient(90deg,#d88c00,#fff2a6,#d88c00);
  border-left:2px solid #986000;
  border-right:2px solid #986000;
}

/*
  ★ 2D開封 ★

  上に持ち上げながら、
  少し右奥方向へ動かして傾ける。

  裏返らない。
  潰れない。
*/
.chest.open .chestLid{
  transform:
    translate(8%,-82%)
    rotate(18deg);
  filter:brightness(1.15);
}

/* 鍵 */
.chestLock{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:26%;
  height:28%;
  border-radius:6px;
  background:linear-gradient(
    145deg,
    #fff0a0,
    #ffca35 48%,
    #b86c00
  );
  border:3px solid #8b5200;
  box-shadow:
    inset 0 3px 4px rgba(255,255,255,.6),
    0 3px 5px rgba(0,0,0,.45);
  z-index:8;
  transition:
    filter .25s,
    transform .25s,
    opacity .25s;
}

.chest.unlocking .chestLock{
  filter:
    brightness(2)
    drop-shadow(0 0 8px #fff)
    drop-shadow(0 0 18px #ffd850);
  transform:
    translate(-50%,-50%)
    scale(1.15);
}

/*
  フタが開いたら鍵も
  フタと一緒に上へ移動。
*/
.chest.open .chestLock{
  transform:
    translate(-20%,-330%)
    rotate(18deg)
    scale(.95);
  opacity:.7;
}

/* 箱内部 */
.chestInside{
  position:absolute;
  left:10%;
  top:46%;
  width:80%;
  height:29%;
  border-radius:50%;
  background:#4c0026;
  box-shadow:
    inset 0 5px 12px rgba(0,0,0,.9),
    0 0 0 3px rgba(255,210,232,.5);
  opacity:0;
  z-index:3;
}
.chest.open .chestInside{
  opacity:1;
}

/* 箱から出る光 */
.chestGlow{
  position:absolute;
  left:50%;
  top:48%;
  width:95%;
  height:75%;
  transform:translate(-50%,-50%) scale(.15);
  border-radius:50%;
  opacity:0;
  background:radial-gradient(
    circle,
    rgba(255,255,255,1) 0%,
    rgba(255,248,182,.98) 16%,
    rgba(255,124,188,.72) 43%,
    rgba(255,0,115,0) 74%
  );
  filter:blur(6px);
  z-index:5;
  pointer-events:none;
}
.chest.open .chestGlow{
  animation:chestGlowBurst 1s ease-out forwards;
}
@keyframes chestGlowBurst{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.15);
  }
  20%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.5);
  }
  55%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.15);
  }
  100%{
    opacity:.6;
    transform:translate(-50%,-50%) scale(1);
  }
}

/* ブルブル */
.chest.shake{
  animation:chestShake .62s linear;
}
@keyframes chestShake{
  0%,100%{transform:translate(0,0) rotate(0);}
  12%{transform:translate(-8px,1px) rotate(-3deg);}
  24%{transform:translate(8px,-1px) rotate(3deg);}
  36%{transform:translate(-7px,0) rotate(-2deg);}
  48%{transform:translate(7px,0) rotate(2deg);}
  60%{transform:translate(-5px,0) rotate(-1.5deg);}
  72%{transform:translate(5px,0) rotate(1.5deg);}
  84%{transform:translate(-2px,0) rotate(-.5deg);}
}

/* 等級 */
.rankLabel{
  position:absolute;
  z-index:15;
  left:50%;
  bottom:-30px;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:25px;
  font-weight:1000;
  text-shadow:0 2px 5px #000;
  display:none;
}
.rank1{color:#ffd84e;}
.rank2{color:#e9eef7;}
.rank3{color:#e99a4c;}

#prizeResult{
  margin-top:48px;
  min-height:70px;
  text-align:center;
  font-size:42px;
  font-weight:1000;
  text-shadow:0 3px 10px #000;
}
#nextButton{
  margin-top:25px;
  padding:14px 50px;
  border:0;
  border-radius:999px;
  background:#fff;
  color:#b00055;
  font-size:20px;
  font-weight:900;
  display:none;
}
</style>
</head>

<body>

<div id="game">

  <div id="starLayer"></div>

  <div id="number"></div>
  <div id="message"></div>

  <div id="blackout"></div>
  <div id="hitDark"></div>
  <div id="slashLayer"></div>
  <div id="flash"></div>
  <div id="hitText">当たり</div>

  <div id="startScreen">
    <button id="startButton">START</button>
    <div id="probability">
      完全抽選 1/30<br>
      毎回独立抽選
    </div>
  </div>

  <div id="treasure">

    <div id="treasureTitle">
      ここからが本番。<br>
      運命の宝箱を選べ！<br>
      この一箱が、結果を決める。
    </div>

    <div id="chests">

      <button class="chest" data-index="0">
        <div class="chestInside"></div>
        <div class="chestGlow"></div>

        <div class="chestBody">
          <div class="chestBand"></div>
        </div>

        <div class="chestLid"></div>
        <div class="chestLock"></div>
        <div class="rankLabel"></div>
      </button>

      <button class="chest" data-index="1">
        <div class="chestInside"></div>
        <div class="chestGlow"></div>

        <div class="chestBody">
          <div class="chestBand"></div>
        </div>

        <div class="chestLid"></div>
        <div class="chestLock"></div>
        <div class="rankLabel"></div>
      </button>

      <button class="chest" data-index="2">
        <div class="chestInside"></div>
        <div class="chestGlow"></div>

        <div class="chestBody">
          <div class="chestBand"></div>
        </div>

        <div class="chestLid"></div>
        <div class="chestLock"></div>
        <div class="rankLabel"></div>
      </button>

    </div>

    <div id="prizeResult"></div>
    <button id="nextButton">NEXT</button>

  </div>

</div>

<script>
const game=document.getElementById("game");
const startScreen=document.getElementById("startScreen");
const startButton=document.getElementById("startButton");
const number=document.getElementById("number");
const message=document.getElementById("message");
const blackout=document.getElementById("blackout");
const hitDark=document.getElementById("hitDark");
const flash=document.getElementById("flash");
const slashLayer=document.getElementById("slashLayer");
const hitText=document.getElementById("hitText");
const starLayer=document.getElementById("starLayer");

const treasure=document.getElementById("treasure");
const treasureTitle=document.getElementById("treasureTitle");
const prizeResult=document.getElementById("prizeResult");
const nextButton=document.getElementById("nextButton");
const chests=[...document.querySelectorAll(".chest")];

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

let playing=false;
let playToken=0;
let starTimers=[];

/* =========================
   AUDIO
========================= */

let audioCtx=null;
let tensionBuffer=null;
let hitBuffer=null;
let tensionSource=null;
let tensionGain=null;
let hitSource=null;
let audioPreparing=null;

function ensureAudioContext(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC)audioCtx=new AC();
  }
}

async function prepareAudio(){
  ensureAudioContext();
  if(!audioCtx)return;
  if(tensionBuffer&&hitBuffer)return;

  if(audioPreparing){
    await audioPreparing;
    return;
  }

  audioPreparing=(async()=>{
    try{
      const [a,b]=await Promise.all([
        fetch("./Tension.mp3"),
        fetch("./hit_music_final.mp3")
      ]);

      const [aa,bb]=await Promise.all([
        a.arrayBuffer(),
        b.arrayBuffer()
      ]);

      [tensionBuffer,hitBuffer]=await Promise.all([
        audioCtx.decodeAudioData(aa),
        audioCtx.decodeAudioData(bb)
      ]);
    }catch(e){
      console.log("audio load error",e);
    }
  })();

  await audioPreparing;
}

async function unlockAudio(){
  ensureAudioContext();
  if(!audioCtx)return;

  const resumePromise=audioCtx.resume();

  try{
    await resumePromise;
  }catch(e){}

  await prepareAudio();
}

function startTension(){
  if(!audioCtx||!tensionBuffer)return;

  stopTension();

  tensionSource=audioCtx.createBufferSource();
  tensionGain=audioCtx.createGain();

  tensionSource.buffer=tensionBuffer;
  tensionSource.loop=true;

  tensionGain.gain.value=.72;

  tensionSource.connect(tensionGain);
  tensionGain.connect(audioCtx.destination);

  tensionSource.start(0);
}

function stopTension(){
  if(tensionSource){
    try{tensionSource.stop();}catch(e){}
    try{tensionSource.disconnect();}catch(e){}
    tensionSource=null;
  }

  if(tensionGain){
    try{tensionGain.disconnect();}catch(e){}
    tensionGain=null;
  }
}

function stopHitMusic(){
  if(hitSource){
    try{hitSource.stop();}catch(e){}
    try{hitSource.disconnect();}catch(e){}
    hitSource=null;
  }
}

function playHitMusic(){
  if(!audioCtx||!hitBuffer)return;

  stopHitMusic();

  hitSource=audioCtx.createBufferSource();
  const gain=audioCtx.createGain();

  hitSource.buffer=hitBuffer;
  gain.gain.value=1;

function clearStarTimers(){
  starTimers.forEach(clearTimeout);
  starTimers=[];
  starLayer.innerHTML="";
}

function makeStar(){
  const star=document.createElement("div");
  star.className="shootingStar";

  const startX=5+Math.random()*65;
  const startY=7+Math.random()*38;
  const angle=14+Math.random()*24;
  const travelX=160+Math.random()*180;
  const travelY=55+Math.random()*125;
  const tail=135+Math.random()*165;
  const duration=.58+Math.random()*.4;
  const size=10+Math.random()*7;

  star.style.left=startX+"vw";
  star.style.top=startY+"vh";
  star.style.width=size+"px";
  star.style.height=size+"px";

  star.style.setProperty("--angle",angle+"deg");
  star.style.setProperty("--travelX",travelX+"px");
  star.style.setProperty("--travelY",travelY+"px");
  star.style.setProperty("--tail",tail+"px");
  star.style.setProperty("--duration",duration+"s");

  starLayer.appendChild(star);

  setTimeout(()=>star.remove(),1700);
}

function meteorBurst(count){
  const token=playToken;

  for(let i=0;i<count;i++){
    const delay=
      i*(120+Math.random()*230)+
      Math.random()*160;

    const timer=setTimeout(()=>{
      if(!playing||token!==playToken)return;
      makeStar();
    },delay);

    starTimers.push(timer);
  }
}

function randomMeteorCount(){
  const r=Math.random();

  if(r<.75)return 1+Math.floor(Math.random()*3);
  if(r<.95)return 4+Math.floor(Math.random()*3);

  return 7+Math.floor(Math.random()*4);
}

function scheduleStars(){
  const token=playToken;

  /* 約73%は流れ星なし */
  if(Math.random()>.27)return;

  let timer=setTimeout(()=>{
    if(!playing||token!==playToken)return;
    meteorBurst(randomMeteorCount());
  },550+Math.random()*4800);

  starTimers.push(timer);

  if(Math.random()<.15){
    timer=setTimeout(()=>{
      if(!playing||token!==playToken)return;
      meteorBurst(randomMeteorCount());
    },3300+Math.random()*4300);

    starTimers.push(timer);
  }
}

async function showTreasure(){
  clearStarTimers();

  treasure.style.display="flex";

  treasureTitle.innerHTML=
    "ここからが本番。<br>"+
    "運命の宝箱を選べ！<br>"+
    "この一箱が、結果を決める。";

  prizeResult.textContent="";
  prizeResult.className="";

  nextButton.style.display="none";

  resetChests();

  /*
    タップする前に
    当選等級を1回だけ抽選
  */
  const selectedRank=drawPrize();

  let chosen=false;

  const chooseHandler=async e=>{
    if(chosen)return;

    chosen=true;

    chests.forEach(c=>{
      c.removeEventListener(
        "click",
        chooseHandler
      );
    });

    const chest=e.currentTarget;
    const chosenIndex=Number(
      chest.dataset.index
    );

    /*
      残り2箱には
      残り2種類の等級を配置
    */
    const otherRanks=
      [1,2,3].filter(
        r=>r!==selectedRank
      );

    if(Math.random()<.5){
      otherRanks.reverse();
    }

    const assignments=
      new Array(3);

    assignments[chosenIndex]=
      selectedRank;

    const otherIndexes=
      [0,1,2].filter(
        i=>i!==chosenIndex
      );

    assignments[otherIndexes[0]]=
      otherRanks[0];

    assignments[otherIndexes[1]]=
      otherRanks[1];

    /* ① ブルブル */
    chest.classList.add("shake");

    await sleep(650);

    chest.classList.remove("shake");

    /* ② 鍵が光る */
    chest.classList.add("unlocking");

    await sleep(550);

    /* ③ 溜め */
    await sleep(250);

    /*
      ④ パカッ

      ここが今回の変更点。
      3D回転なし。
    */
    chest.classList.add("open");

    /*
      フタの動きを
      先に見せる
    */
    await sleep(400);

    /* ⑤ 箱の中が光る */
    doFlash();

    await sleep(350);

    /* ⑥ 選択結果 */
    const label=
      chest.querySelector(".rankLabel");

    label.textContent=
      rankText(selectedRank);

    label.classList.add(
      rankClass(selectedRank)
    );

    label.style.display="block";

    prizeResult.className=
      rankClass(selectedRank);

    prizeResult.textContent=
      selectedRank+"等 当選！";

    await sleep(2200);

    treasureTitle.innerHTML=
      "残りの宝箱は…<br>"+
      "選ばなかった箱もオープン";

    prizeResult.textContent="";

    if(Math.random()<.5){
      otherIndexes.reverse();
    }

    /*
      残り2箱も
      同じ2D開封
    */
    for(const idx of otherIndexes){
      const c=chests[idx];

      c.classList.add("shake");

      await sleep(400);

      c.classList.remove("shake");

      c.classList.add("unlocking");

      await sleep(350);

      c.classList.add("open");

      await sleep(480);

      const l=
        c.querySelector(".rankLabel");

      const rank=
        assignments[idx];

      l.textContent=
        rankText(rank);

      l.classList.add(
        rankClass(rank)
      );

      l.style.display="block";

      await sleep(700);
    }

    await sleep(500);

    nextButton.style.display="block";
  };

  chests.forEach(chest=>{
    chest.addEventListener(
      "click",
      chooseHandler
    );
  });
}
