<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>COUNTDOWN LOTTERY</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#120008;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
  position:fixed;
  inset:0;
}

/* =========================
   BACKGROUND
========================= */

#bg{
  position:fixed;
  inset:0;
  z-index:0;
  background-color:#120008;
  background-image:url("./9E28B31B-C619-4F41-AB55-91C025168D02.png");
  background-size:auto 100%;
  background-position:center top;
  background-repeat:no-repeat;
}

#shade{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.01),
      rgba(0,0,0,.04) 45%,
      rgba(0,0,0,.14)
    );
}

#game{
  position:fixed;
  inset:0;
  z-index:10;
}

/* =========================
   START
========================= */

#startScreen{
  position:absolute;
  inset:0;
  z-index:30;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding-bottom:max(8vh,55px);
}

#startInfo{
  text-align:center;
  margin-bottom:18px;
  font-weight:900;
  letter-spacing:.14em;
  text-shadow:0 3px 7px rgba(0,0,0,.85);
}

#startInfo .main{
  font-size:18px;
}

#startInfo .sub{
  margin-top:5px;
  font-size:11px;
  opacity:.85;
}

#startButton{
  width:min(78vw,330px);
  height:72px;
  border:2px solid rgba(255,255,255,.9);
  border-radius:18px;
  color:#fff;
  font-size:27px;
  font-weight:1000;
  letter-spacing:.16em;
  background:
    linear-gradient(
      180deg,
      rgba(255,105,178,.97),
      rgba(218,0,99,.97)
    );
  box-shadow:
    0 7px 0 #790037,
    0 12px 25px rgba(0,0,0,.5),
    inset 0 2px 0 rgba(255,255,255,.45);
}

#startButton:active{
  transform:translateY(4px);
  box-shadow:
    0 3px 0 #790037,
    0 8px 18px rgba(0,0,0,.5);
}

/* =========================
   NUMBER
========================= */

#number{
  position:absolute;
  left:50%;
  top:61%;
  transform:translate(-50%,-50%);
  z-index:20;

  font-size:min(52vw,255px);
  line-height:.8;
  font-weight:1000;
  font-family:Impact,"Arial Black",sans-serif;

  color:#fff7fb;

  -webkit-text-stroke:
    clamp(5px,1.6vw,9px)
    #ff4b9d;

  text-shadow:
    0 6px 0 #d82779,
    0 12px 0 #a80052,
    0 18px 8px rgba(60,0,28,.72);

  opacity:0;
  pointer-events:none;
  user-select:none;
}

#number.show{
  opacity:1;
  animation:numberIn .16s ease-out;
}

@keyframes numberIn{
  0%{
    transform:translate(-50%,-50%) scale(.86);
  }
  100%{
    transform:translate(-50%,-50%) scale(1);
  }
}

#number.red{
  color:#fff0f3;
  -webkit-text-stroke:8px #ff153e;
  text-shadow:
    0 6px 0 #d00029,
    0 12px 0 #830016,
    0 18px 8px rgba(0,0,0,.7);
}

#number.gold{
  color:#fffde6;
  -webkit-text-stroke:8px #ffd200;
  text-shadow:
    0 6px 0 #e59b00,
    0 12px 0 #9c5900,
    0 18px 8px rgba(0,0,0,.7);
}

#number.small{
  transform:translate(-50%,-50%) scale(.76);
}

/* =========================
   MESSAGE
   ★「…」90px
========================= */

#message{
  position:absolute;
  left:50%;
  top:61%;
  transform:translate(-50%,-50%);
  z-index:25;
  width:100%;
  text-align:center;

  font-size:90px;
  line-height:1;
  font-weight:1000;
  letter-spacing:.12em;

  color:#fff7fb;

  -webkit-text-stroke:
    3px #ff4b9d;

  text-shadow:
    0 4px 0 #c7196a,
    0 8px 7px rgba(0,0,0,.85);

  pointer-events:none;
}

/* =========================
   SHOOTING STARS
========================= */

#starLayer{
  position:fixed;
  inset:0;
  z-index:18;
  overflow:hidden;
  pointer-events:none;
}

/*
  流れ星本体
*/
.shootingStar{
  position:absolute;

  width:8px;
  height:8px;

  border-radius:50%;

  background:#fff;

  box-shadow:
    0 0 6px #fff,
    0 0 14px rgba(255,255,255,.95);

  opacity:0;

  transform:rotate(35deg);

  animation:shootStar .78s ease-out forwards;
}

/*
  尾
*/
.shootingStar::after{
  content:"";

  position:absolute;

  right:3px;
  top:50%;

  width:135px;
  height:3px;

  transform:translateY(-50%);

  transform-origin:right center;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.12),
      rgba(255,255,255,.75),
      #fff
    );

  filter:drop-shadow(0 0 5px rgba(255,255,255,.85));
}

/*
  ピンク
*/
.shootingStar.pink{
  background:#fff2fa;

  box-shadow:
    0 0 7px #fff,
    0 0 16px #ff68b2,
    0 0 26px rgba(255,40,140,.8);
}

.shootingStar.pink::after{
  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,80,170,.1),
      rgba(255,100,190,.8),
      #fff
    );
}

/*
  ゴールド
*/
.shootingStar.gold{
  background:#fffbe0;

  box-shadow:
    0 0 7px #fff,
    0 0 16px #ffd85b,
    0 0 27px rgba(255,190,20,.8);
}

.shootingStar.gold::after{
  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,190,20,.1),
      rgba(255,215,80,.85),
      #fffde0
    );
}

/*
  左上 → 右下
*/
@keyframes shootStar{
  0%{
    opacity:0;
    transform:
      translate3d(0,0,0)
      rotate(35deg)
      scale(.6);
  }

  10%{
    opacity:1;
  }

  65%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:
      translate3d(115vw,68vh,0)
      rotate(35deg)
      scale(1);
  }
}

/*
  逆方向
*/
.shootingStar.reverse{
  transform:rotate(145deg);
  animation:shootStarReverse .78s ease-out forwards;
}

@keyframes shootStarReverse{
  0%{
    opacity:0;
    transform:
      translate3d(0,0,0)
      rotate(145deg)
      scale(.6);
  }

  10%{
    opacity:1;
  }

  65%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:
      translate3d(-115vw,68vh,0)
      rotate(145deg)
      scale(1);
  }
}

/* =========================
   BLACKOUT
========================= */

#blackout{
  position:fixed;
  inset:0;
  z-index:50;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity .06s linear;
}

#blackout.on{
  opacity:1;
}

/* =========================
   FLASH
========================= */

#flash{
  position:fixed;
  inset:0;
  z-index:75;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

#flash.on{
  animation:flashAnim .34s ease-out;
}

@keyframes flashAnim{
  0%{opacity:1;}
  100%{opacity:0;}
}

/* =========================
   SLASH
========================= */

#slashLayer{
  position:fixed;
  inset:0;
  z-index:70;
  overflow:hidden;
  pointer-events:none;
}

.slash{
  position:absolute;
  left:-40vw;
  top:50%;
  width:180vw;
  height:18px;

  transform-origin:center;

  background:#fff;

  box-shadow:
    0 0 7px #fff,
    0 0 16px #fff,
    0 0 28px #ff3b96,
    0 0 55px #ff006e;

  animation:
    slashGo .40s
    cubic-bezier(.08,.85,.18,1)
    forwards;
}

.slash.two{
  animation:
    slashGo2 .40s
    cubic-bezier(.08,.85,.18,1)
    forwards;
}

@keyframes slashGo{
  0%{
    opacity:0;
    transform:
      translateY(-50%)
      rotate(-25deg)
      scaleX(0);
  }

  12%{opacity:1;}

  52%{
    opacity:1;
    transform:
      translateY(-50%)
      rotate(-25deg)
      scaleX(1);
  }

  100%{
    opacity:0;
    transform:
      translateY(-50%)
      rotate(-25deg)
      scaleX(1);
  }
}

@keyframes slashGo2{
  0%{
    opacity:0;
    transform:
      translateY(-50%)
      rotate(24deg)
      scaleX(0);
  }

  12%{opacity:1;}

  52%{
    opacity:1;
    transform:
      translateY(-50%)
      rotate(24deg)
      scaleX(1);
  }

  100%{
    opacity:0;
    transform:
      translateY(-50%)
      rotate(24deg)
      scaleX(1);
  }
}

/* =========================
   HIT SHAKE
========================= */

body.hitShake{
  animation:
    hitShake .36s
    cubic-bezier(.2,.8,.3,1);
}

@keyframes hitShake{
  0%{transform:translate3d(0,0,0);}
  15%{transform:translate3d(-10px,5px,0);}
  30%{transform:translate3d(9px,-5px,0);}
  45%{transform:translate3d(-7px,4px,0);}
  60%{transform:translate3d(6px,-3px,0);}
  75%{transform:translate3d(-3px,2px,0);}
  100%{transform:translate3d(0,0,0);}
}

/* =========================
   HIT TEXT
========================= */

#hitText{
  position:fixed;
  left:50%;
  top:50%;

  transform:
    translate(-50%,-50%)
    scale(.15);

  z-index:90;

  font-size:min(25vw,125px);
  white-space:nowrap;
  font-weight:1000;
  font-family:Impact,"Arial Black",sans-serif;

  color:#fff;

  -webkit-text-stroke:6px #ff2486;

  text-shadow:
    0 6px 0 #d00064,
    0 12px 0 #780032,
    0 0 18px #fff,
    0 0 38px #ff1680;

  opacity:0;
  pointer-events:none;
}

#hitText.on{
  animation:
    hitPop .72s
    cubic-bezier(.12,.88,.12,1)
    forwards;
}

@keyframes hitPop{
  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.15);
  }

  30%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1.28);
  }

  50%{
    transform:
      translate(-50%,-50%)
      scale(.91);
  }

  68%{
    transform:
      translate(-50%,-50%)
      scale(1.07);
  }

  100%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1);
  }
}

/* =========================
   TREASURE
========================= */

#treasureScreen{
  position:fixed;
  inset:0;
  z-index:100;

  display:none;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  padding:30px 14px;

  background:
    radial-gradient(
      circle at 50% 38%,
      rgba(255,20,130,.42),
      rgba(28,0,16,.92) 55%,
      rgba(0,0,0,.97)
    );
}

#treasureScreen.show{
  display:flex;
}

#treasureIntro{
  font-size:14px;
  font-weight:800;
  letter-spacing:.12em;
  margin-bottom:8px;
}

#treasureTitle{
  text-align:center;
  font-size:27px;
  font-weight:1000;
  text-shadow:0 0 15px #ff1680;
}

#treasureSub{
  margin-top:8px;
  font-size:13px;
  opacity:.88;
  text-align:center;
}

#chests{
  width:100%;
  max-width:500px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:8px;
  margin-top:42px;
}

.chestWrap{
  flex:1;
  max-width:150px;
  min-width:0;
  text-align:center;
}

.chest{
  position:relative;
  width:100%;
  aspect-ratio:1.08 / 1;
  cursor:pointer;
  transform-origin:center bottom;
}

.chestLid{
  position:absolute;
  left:7%;
  top:16%;
  width:86%;
  height:34%;

  border-radius:18px 18px 7px 7px;

  background:
    linear-gradient(
      180deg,
      #ffdd79 0%,
      #d78a17 20%,
      #754008 22%,
      #b85b16 40%,
      #6f2b08 100%
    );

  border:3px solid #ffd96b;

  box-shadow:
    inset 0 4px 4px rgba(255,255,255,.3),
    0 5px 8px rgba(0,0,0,.5);

  transform-origin:center bottom;
  transition:transform .45s ease;
}

.chestBody{
  position:absolute;
  left:7%;
  bottom:7%;
  width:86%;
  height:52%;

  border-radius:5px 5px 14px 14px;

  background:
    linear-gradient(
      90deg,
      #5f2107,
      #c26a1c 22%,
      #7b2b08 50%,
      #c36c1d 77%,
      #5d2007
    );

  border:3px solid #ffc94f;

  box-shadow:
    inset 0 0 12px rgba(0,0,0,.6),
    0 8px 14px rgba(0,0,0,.6);
}

.chestLock{
  position:absolute;
  left:50%;
  top:43%;
  transform:translateX(-50%);
  width:25%;
  height:30%;
  border-radius:5px;

  background:
    linear-gradient(
      #fff1a3,
      #d49315
    );

  border:2px solid #704000;
  z-index:3;
}

.chest.open .chestLid{
  transform:
    translateY(-24%)
    rotateX(72deg);
}

.chest.shake{
  animation:chestShake .48s linear;
}

@keyframes chestShake{
  0%,100%{
    transform:translateX(0) rotate(0);
  }

  20%{
    transform:translateX(-6px) rotate(-3deg);
  }

  40%{
    transform:translateX(6px) rotate(3deg);
  }

  60%{
    transform:translateX(-5px) rotate(-2deg);
  }

  80%{
    transform:translateX(5px) rotate(2deg);
  }
}

.rankLabel{
  margin-top:9px;
  min-height:29px;
  font-size:22px;
  font-weight:1000;
  opacity:0;
}

.rankLabel.show{
  opacity:1;
}

.rank1{
  color:#ffe36b;
  text-shadow:0 0 12px #ffb300;
}

.rank2{
  color:#f4f4f4;
  text-shadow:0 0 10px #aab6c7;
}

.rank3{
  color:#ff9c4a;
  text-shadow:0 0 10px #c94d00;
}

/* =========================
   RANK RESULT
========================= */

#rankResult{
  position:fixed;
  inset:0;
  z-index:130;

  display:none;

  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:rgba(0,0,0,.77);
}

#rankResult.show{
  display:flex;
}

#rankBig{
  font-size:min(24vw,120px);
  font-weight:1000;
  line-height:1;
  text-align:center;
}

#rankWin{
  margin-top:15px;
  font-size:31px;
  font-weight:1000;
}

#nextButton{
  display:none;
  margin-top:32px;
  width:min(72vw,300px);
  height:60px;
  border:2px solid #fff;
  border-radius:16px;
  color:#fff;

  background:
    linear-gradient(
      #ff5fa8,
      #bc0055
    );

  font-size:22px;
  font-weight:1000;
  letter-spacing:.12em;
}
</style>
</head>

<body>

<div id="bg"></div>
<div id="shade"></div>

<div id="game">

  <div id="startScreen">

    <div id="startInfo">
      <div class="main">
        完全抽選 1/30
      </div>

      <div class="sub">
        毎回独立抽選
      </div>
    </div>

    <button id="startButton">
      START
    </button>

  </div>

  <div id="number"></div>

  <div id="message"></div>

</div>

<!-- ★流れ星 -->
<div id="starLayer"></div>

<div id="slashLayer"></div>
<div id="blackout"></div>
<div id="flash"></div>

<div id="hitText">
  当たり
</div>

<div id="treasureScreen">

  <div id="treasureIntro">
    ここからが本番。
  </div>

  <div id="treasureTitle">
    運命の宝箱を選べ！
  </div>

  <div id="treasureSub">
    この一箱が、結果を決める。
  </div>

  <div id="chests">

    <div class="chestWrap">
      <div class="chest" data-index="0">
        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestLock"></div>
      </div>
      <div class="rankLabel"></div>
    </div>

    <div class="chestWrap">
      <div class="chest" data-index="1">
        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestLock"></div>
      </div>
      <div class="rankLabel"></div>
    </div>

    <div class="chestWrap">
      <div class="chest" data-index="2">
        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestLock"></div>
      </div>
      <div class="rankLabel"></div>
    </div>

  </div>

  <button id="nextButton">
    NEXT
  </button>

</div>

<div id="rankResult">
  <div id="rankBig"></div>
  <div id="rankWin">当選！</div>
</div>

<script>

/* =========================
   BASIC
========================= */

const sleep = ms =>
  new Promise(resolve =>
    setTimeout(resolve,ms)
  );

const number =
  document.getElementById("number");

const message =
  document.getElementById("message");

const startScreen =
  document.getElementById("startScreen");

const startButton =
  document.getElementById("startButton");

const blackout =
  document.getElementById("blackout");

const flash =
  document.getElementById("flash");

const hitText =
  document.getElementById("hitText");

const treasureScreen =
  document.getElementById("treasureScreen");

const treasureTitle =
  document.getElementById("treasureTitle");

const treasureSub =
  document.getElementById("treasureSub");

const nextButton =
  document.getElementById("nextButton");

const rankResult =
  document.getElementById("rankResult");

const rankBig =
  document.getElementById("rankBig");

const starLayer =
  document.getElementById("starLayer");

let playing=false;
let selectedRank=null;
let chestRanks=[];
let treasureLocked=false;

/* =========================
   AUDIO
   MP3再生専用
========================= */

let audioCtx=null;
let tensionBuffer=null;
let hitBuffer=null;
let tensionSource=null;
let hitSource=null;
let audioLoaded=false;
let audioLoadingPromise=null;

async function loadAudioFile(url){

  const response =
    await fetch(
      url,
      {cache:"force-cache"}
    );

  if(!response.ok){
    throw new Error(
      "Audio load failed: "+url
    );
  }

  const arrayBuffer =
    await response.arrayBuffer();

  return await audioCtx.decodeAudioData(
    arrayBuffer
  );
}

async function prepareAudio(){

  if(audioLoaded){
    return;
  }

  if(audioLoadingPromise){
    return audioLoadingPromise;
  }

  audioLoadingPromise=(async()=>{

    const AudioContextClass =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioContextClass){
      throw new Error(
        "Web Audio unsupported"
      );
    }

    if(!audioCtx){
      audioCtx =
        new AudioContextClass();
    }

    const results =
      await Promise.all([
        loadAudioFile("./Tension.mp3"),
        loadAudioFile("./hit_music_final.mp3")
      ]);

    tensionBuffer=results[0];
    hitBuffer=results[1];

    audioLoaded=true;

  })();

  try{
    await audioLoadingPromise;
  }
  catch(error){
    console.error(
      "Audio preparation error:",
      error
    );

    audioLoadingPromise=null;
  }
}

/* 先読み */
prepareAudio();

async function unlockAudio(){

  if(!audioLoaded){
    await prepareAudio();
  }

  if(
    audioCtx &&
    audioCtx.state !== "running"
  ){
    try{
      await audioCtx.resume();
    }
    catch(error){
      console.error(
        "Audio resume failed:",
        error
      );
    }
  }
}

function stopSource(source){

  if(!source){
    return;
  }

  try{
    source.stop();
  }
  catch(e){}
}

function startTension(){

  if(
    !audioCtx ||
    !tensionBuffer
  ){
    return;
  }

  stopSource(tensionSource);

  const source =
    audioCtx.createBufferSource();

  source.buffer=tensionBuffer;
  source.loop=true;

  const gain =
    audioCtx.createGain();

  gain.gain.value=.72;

  source.connect(gain);
  gain.connect(audioCtx.destination);

  source.start(0);

  tensionSource=source;

  source.onended=()=>{
    if(tensionSource===source){
      tensionSource=null;
    }
  };
}

function stopTension(){
  stopSource(tensionSource);
  tensionSource=null;
}

function playHitMusic(){

  if(
    !audioCtx ||
    !hitBuffer
  ){
    return;
  }

  stopSource(hitSource);

  const source =
    audioCtx.createBufferSource();

  source.buffer=hitBuffer;
  source.loop=false;

  const gain =
    audioCtx.createGain();

  gain.gain.value=1;

  source.connect(gain);
  gain.connect(audioCtx.destination);

  source.start(0);

  hitSource=source;

  source.onended=()=>{
    if(hitSource===source){
      hitSource=null;
    }
  };
}

function stopHitMusic(){
  stopSource(hitSource);
  hitSource=null;
}

/* =========================
   NUMBER
========================= */

function clearNumberStyle(){

  number.classList.remove(
    "red",
    "gold",
    "small"

========================= */

function createStar(
  style="white",
  reverse=false
){

  const star =
    document.createElement("div");

  star.className="shootingStar";

  if(style==="pink"){
    star.classList.add("pink");
  }

  if(style==="gold"){
    star.classList.add("gold");
  }

  if(reverse){
    star.classList.add("reverse");
  }

  /*
    上側からランダムスタート。
    数字の真正面を避ける。
  */

  const top =
    8 + Math.random()*24;

  if(reverse){

    star.style.left=
      (75 + Math.random()*18)+"vw";

  }else{

    star.style.left=
      (-15 + Math.random()*20)+"vw";

  }

  star.style.top=
    top+"vh";

  starLayer.appendChild(star);

  setTimeout(()=>{
    star.remove();
  },1100);
}

/*
  1本の流れ星。

  白が多め。
  ピンク/金も当たり確定ではない。
*/
function shootingStar(){

  const r=Math.random();

  let style="white";

  if(r < .16){
    style="gold";
  }
  else if(r < .38){
    style="pink";
  }

  const reverse =
    Math.random() < .35;

  createStar(
    style,
    reverse
  );
}

/*
  通常は1本。
  たまに2本。
*/
function shootingStarEvent(){

  shootingStar();

  if(Math.random() < .20){

    setTimeout(()=>{
      shootingStar();
    },180 + Math.random()*260);

  }
}

/*
  1プレイ中に
  流れ星を出すか決める。

  結果には一切関係なし。
*/
function scheduleStars(){

  /*
    58%で流れ星あり
  */

  if(Math.random() >= .58){
    return;
  }

  /*
    3 / 2 / 1 あたりの
    どこに来るか分からない
  */

  const delay =
    650 +
    Math.random()*5000;

  setTimeout(()=>{

    if(playing){
      shootingStarEvent();
    }

  },delay);

  /*
    さらに低確率で
    もう一回
  */

  if(Math.random() < .18){

    const delay2 =
      2800 +
      Math.random()*4200;

    setTimeout(()=>{

      if(playing){
        shootingStarEvent();
      }

    },delay2);
  }
}

  options={}
){

  hideNumber();
  message.textContent="";

  stopTension();

  /*

  */
  await sleep(
    options.silence || 520
  );

  /*
    一瞬暗転
  */
  blackout.classList.add("on");

  await sleep(180);

  blackout.classList.remove("on");

  /*
    極太斬撃
  */
  slash(
    false,
    !!options.doubleSlash
  );

  await sleep(125);

  /*
    一発だけ揺れる
  */
  doHitShake();

  /*
    当たり文字
  */
  hitText.classList.remove("on");

  void hitText.offsetWidth;

  hitText.classList.add("on");

  /*
    当たり曲
  */
  playHitMusic();

  await sleep(2100);

  hitText.classList.remove("on");

  await sleep(650);

  showTreasure();
}

/* =========================
   SHUFFLE
========================= */

function shuffle(arr){

  const a=[...arr];

  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [a[i],a[j]]=
      [a[j],a[i]];
  }

  return a;
}

/* =========================
   CHESTS
========================= */

document
  .querySelectorAll(".chest")
  .forEach(chest=>{

    chest.addEventListener(
      "click",
      async()=>{

        if(treasureLocked){
          return;
        }

        treasureLocked=true;

        const chosen =
          Number(
            chest.dataset.index
          );

        chestRanks=[
          null,
          null,
          null
        ];

        chestRanks[chosen]=
          selectedRank;

        const remainingRanks =
          shuffle(
            [1,2,3].filter(
              rank =>
                rank !== selectedRank
            )
          );

        const otherIndexes =
          shuffle(
            [0,1,2].filter(
              i => i !== chosen
            )
          );

        chestRanks[
          otherIndexes[0]
        ]=
          remainingRanks[0];

        chestRanks[
          otherIndexes[1]
        ]=
          remainingRanks[1];

        chest.classList.add("shake");

        await sleep(600);

        chest.classList.remove("shake");

        chest.classList.add("open");

        doFlash();

        await sleep(550);

        showRankLabel(
          chosen,
          selectedRank
        );

        await sleep(450);

        await showBigRank(
          selectedRank
        );

        treasureTitle.textContent=
          "残りの宝箱は…";

        treasureSub.textContent=
          "選ばなかった箱もオープン";

        const revealOrder =
          shuffle(otherIndexes);

        await sleep(650);

        for(
          const index
          of revealOrder
        ){

          const otherChest =
            document.querySelector(
              `.chest[data-index="${index}"]`
            );

          otherChest
            .classList
            .add("shake");

          await sleep(420);

          otherChest
            .classList
            .remove("shake");

          otherChest
            .classList
            .add("open");

          doFlash();

          await sleep(300);

          showRankLabel(
            index,
            chestRanks[index]
          );

          await sleep(650);
        }

        nextButton.style.display=
          "block";
      }
    );
  });

function showRankLabel(
  index,
  rank
){

  const wraps =
    document.querySelectorAll(
      ".chestWrap"
    );

  const label =
    wraps[index]
      .querySelector(
        ".rankLabel"
      );

  label.textContent=
    `${rank}等`;

  label.classList.add(
    "show",
    `rank${rank}`
  );
}

async function showBigRank(rank){

  rankBig.textContent=
    `${rank}等`;

  rankBig.className=
    `rank${rank}`;

  rankResult
    .classList
    .add("show");

  await sleep(
    rank===1
      ? 2400
      : 1800
  );

  rankResult
    .classList
    .remove("show");
}
