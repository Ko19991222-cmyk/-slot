<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COUNTDOWN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

body{
  user-select:none;
}

button{
  font-family:inherit;
}

/* ===== STAGE ===== */

#stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 45%,
    #171717 0%,
    #050505 48%,
    #000 82%);
  transition:background .15s,filter .15s;
}

#number{
  position:relative;
  z-index:5;
  font-size:min(60vw,360px);
  font-weight:1000;
  line-height:1;
  text-shadow:
    0 0 15px #fff,
    0 0 40px rgba(255,255,255,.45);
  transition:
    color .15s,
    transform .15s,
    left .15s,
    top .15s,
    opacity .15s,
    filter .15s;
}

#number.show{
  animation:numberIn .42s ease-out;
}

@keyframes numberIn{
  0%{
    opacity:0;
    transform:scale(1.32);
    filter:blur(8px);
  }
  100%{
    opacity:1;
    transform:scale(1);
    filter:blur(0);
  }
}

/* ===== 違和感 ===== */

#number.red{
  color:#ff2828;
  text-shadow:
    0 0 16px #fff,
    0 0 35px #ff0000,
    0 0 80px #ff0000;
}

#number.gold{
  color:#ffe16b;
  text-shadow:
    0 0 15px #fff,
    0 0 40px #ffc400,
    0 0 90px #ff8c00;
}

#number.small{
  transform:scale(.84);
}

#number.big{
  transform:scale(1.18);
}

#number.thin{
  font-weight:300;
}

#number.shiftLeft{
  left:-18px;
}

#number.shiftRight{
  left:18px;
}

#number.shiftUp{
  top:-13px;
}

#number.double{
  text-shadow:
    8px 0 0 rgba(255,255,255,.28),
    -8px 0 0 rgba(255,0,0,.22),
    0 0 25px #fff;
}

#number.mirror{
  transform:scaleX(-1);
}

#number.flicker{
  animation:flicker .12s linear 4;
}

@keyframes flicker{
  0%,100%{opacity:1}
  50%{opacity:.05}
}

#number.ghost::after{
  content:attr(data-num);
  position:absolute;
  inset:0;
  transform:translate(14px,10px);
  opacity:.15;
  filter:blur(1px);
}

/* ===== UI ===== */

#start,#next{
  position:absolute;
  bottom:8%;
  z-index:400;
  padding:17px 46px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.75);
  color:#fff;
  font-size:17px;
  font-weight:900;
  letter-spacing:.12em;
}

#test{
  position:absolute;
  z-index:10;
  top:max(25px,env(safe-area-inset-top));
  font-size:10px;
  letter-spacing:.2em;
  opacity:.28;
}

#weirdMark{
  position:fixed;
  z-index:30;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:min(18vw,100px);
  font-weight:1000;
  display:none;
  text-shadow:
    0 0 15px #fff,
    0 0 40px #fff;
}

/* ===== BLACKOUT ===== */

#black{
  position:fixed;
  inset:0;
  z-index:80;
  display:none;
  background:#000;
}

/* ===== SLASH ===== */

#slash{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  overflow:hidden;
  pointer-events:none;
}

#slash.go{
  display:block;
}

#line{
  position:absolute;
  left:-30%;
  top:50%;
  width:160%;
  height:9px;
  background:#fff;
  box-shadow:
    0 0 15px #fff,
    0 0 40px #fff,
    0 0 90px #fff;
  transform:rotate(-18deg) scaleX(0);
}

#slash.go #line{
  animation:slashAnim .20s ease-out forwards;
}

@keyframes slashAnim{
  to{
    transform:rotate(-18deg) scaleX(1);
  }
}

/* ===== FLASH ===== */

#flash{
  position:fixed;
  inset:0;
  z-index:350;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

#flash.go{
  animation:flashAnim .45s ease-out;
}

@keyframes flashAnim{
  0%{opacity:0}
  10%{opacity:1}
  28%{opacity:.25}
  40%{opacity:1}
  100%{opacity:0}
}

/* ===== HIT ===== */

#hit{
  position:fixed;
  inset:0;
  z-index:140;
  display:none;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(circle,
    #8b1a00 0%,
    #390000 35%,
    #090000 68%,
    #000 100%);
}

#hit.show{
  display:flex;
}

#glow{
  position:absolute;
  width:150vw;
  height:150vw;
  border-radius:50%;
  background:
    conic-gradient(
      transparent,
      rgba(255,180,0,.35),
      transparent,
      rgba(255,0,0,.42),
      transparent
    );
  animation:spin 3s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

#hitText{
  position:relative;
  z-index:5;
  font-size:min(24vw,150px);
  font-weight:1000;
  text-align:center;
  text-shadow:
    0 0 12px #fff,
    0 0 30px #ffe100,
    0 0 70px #ff4500,
    0 0 110px red;
  animation:hitIn .55s cubic-bezier(.05,1.4,.2,1);
}

#subText{
  position:absolute;
  bottom:25%;
  z-index:5;
  font-size:15px;
  font-weight:900;
  letter-spacing:.16em;
}

@keyframes hitIn{
  0%{
    opacity:0;
    transform:scale(.25);
    filter:blur(10px);
  }
  70%{
    opacity:1;
    transform:scale(1.18);
    filter:blur(0);
  }
  100%{
    transform:scale(1);
  }
}

/* ===== TREASURE ===== */

#treasureScreen{
  position:fixed;
  inset:0;
  z-index:180;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 42%,
    #202020 0%,
    #090909 48%,
    #000 100%);
}

#treasureScreen.show{
  display:flex;
}

#treasureTitle{
  position:absolute;
  top:12%;
  width:100%;
  text-align:center;
  font-size:clamp(24px,8vw,48px);
  font-weight:1000;
  letter-spacing:.14em;
  text-shadow:
    0 0 12px #fff,
    0 0 30px rgba(255,255,255,.35);
}

#treasureSub{
  position:absolute;
  top:20%;
  width:100%;
  text-align:center;
  font-size:13px;
  letter-spacing:.14em;
  opacity:.72;
}

#chests{
  width:min(94vw,700px);
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:10px;
  padding:0 10px;
}

.chest{
  appearance:none;
  border:none;
  background:transparent;
  width:31%;
  padding:0;
  color:#fff;
  position:relative;
  transition:
    transform .18s,
    filter .18s,
    opacity .18s;
}

.chest:active{
  transform:scale(.94);
}

.chest.disabled{
  pointer-events:none;
}

.chestWrap{
  position:relative;
  width:100%;
  aspect-ratio:1/.88;
  animation:chestFloat 1.5s ease-in-out infinite;
}

.chest:nth-child(2) .chestWrap{
  animation-delay:.15s;
}

.chest:nth-child(3) .chestWrap{
  animation-delay:.3s;
}

@keyframes chestFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.chestBody{
  position:absolute;
  left:10%;
  bottom:7%;
  width:80%;
  height:48%;
  border-radius:8px 8px 18px 18px;
  background:
    linear-gradient(
      90deg,
      #6e2f07 0%,
      #b75b10 18%,
      #7d3406 50%,
      #bf6618 82%,
      #642905 100%
    );
  border:4px solid #dca62f;
  box-shadow:
    inset 0 0 18px rgba(0,0,0,.5),
    0 12px 22px rgba(0,0,0,.7),
    0 0 20px rgba(255,190,60,.2);
}

.chestLid{
  position:absolute;
  left:7%;
  top:22%;
  width:86%;
  height:34%;
  border-radius:50% 50% 7px 7px;
  background:
    linear-gradient(
      90deg,
      #6b2a05,
      #c36813 25%,
      #813605 55%,
      #c9741a 82%,
      #652705
    );
  border:4px solid #e0ad36;
  transform-origin:50% 100%;
  transition:transform .6s cubic-bezier(.2,.9,.2,1);
  box-shadow:
    inset 0 0 15px rgba(0,0,0,.45),
    0 0 18px rgba(255,184,43,.22);
}

.chestBand{
  position:absolute;
  left:44%;
  top:18%;
  width:12%;
  height:64%;
  background:
    linear-gradient(
      #ffe27a,
      #b37b13,
      #ffdd65
    );
  border-radius:4px;
  z-index:4;
  box-shadow:0 0 8px rgba(255,220,90,.5);
}

.chestLock{
  position:absolute;
  left:40%;
  bottom:26%;
  width:20%;
  aspect-ratio:1;
  border-radius:6px;
  background:
    linear-gradient(
      #ffe98a,
      #a87511
    );
  border:2px solid #fff1a5;
  z-index:6;
}

.chestNum{
  margin-top:8px;
  font-size:12px;
  font-weight:900;
  letter-spacing:.12em;
  opacity:.75;
}

.chest.selected .chestWrap{
  animation:chestShake .12s linear infinite;
}

@keyframes chestShake{
  0%{transform:translate(-3px,0) rotate(-1deg)}
  25%{transform:translate(3px,-2px) rotate(1deg)}
  50%{transform:translate(-2px,2px) rotate(-1deg)}
  75%{transform:translate(2px,-1px) rotate(1deg)}
  100%{transform:translate(-3px,0) rotate(-1deg)}
}

.chest.open .chestWrap{
  animation:none;
}

.chest.open .chestLid{
  transform:rotateX(145deg) translateY(-4px);
}

.chest.open{
  transform:scale(1.15);
  filter:brightness(1.35);
}

.chest.dim{
  opacity:.3;
  filter:grayscale(.8);
}

.chestLight{
  position:absolute;
  left:26%;
  bottom:26%;
  width:48%;
  height:15%;
  opacity:0;
  border-radius:50%;
  background:#fff;
  box-shadow:
    0 0 20px #fff,
    0 0 50px #ffe66a,
    0 0 100px #ffb300;
  z-index:2;
}

.chest.open .chestLight{
  opacity:1;
  animation:lightBurst .7s ease-out forwards;
}

@keyframes lightBurst{
  from{
    transform:scale(.3);
    opacity:1;
  }
  to{
    transform:scale(4.5);
    opacity:0;
  }
}

/* ===== PRIZE ===== */

#prizeBox{
  position:fixed;
  inset:0;
  z-index:230;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  overflow:hidden;
}

#prizeBox.show{
  display:flex;
}

#prizeBox.first{
  background:
    radial-gradient(circle,
    #fff7a0 0%,
    #d99b00 25%,
    #5c2500 60%,
    #000 100%);
}

#prizeBox.second{
  background:
    radial-gradient(circle,
    #fff 0%,
    #a9b2be 28%,
    #272d35 62%,
    #000 100%);
}

#prizeBox.third{
  background:
    radial-gradient(circle,
    #ffd2a8 0%,
    #b75a22 30%,
    #4c1e08 62%,
    #000 100%);
}

#prizeBurst{
  position:absolute;
  width:160vw;
  height:160vw;
  border-radius:50%;
  background:
    repeating-conic-gradient(
      rgba(255,255,255,.22) 0deg 4deg,
      transparent 4deg 11deg
    );
  animation:spin 6s linear infinite;
}

#prizeLabel{
  position:relative;
  z-index:3;
  font-size:clamp(72px,28vw,180px);
  font-weight:1000;
  line-height:1;
  text-align:center;
  text-shadow:
    0 0 12px #fff,
    0 0 40px rgba(255,255,255,.7),
    0 0 90px rgba(255,180,0,.7);
  animation:prizeIn .7s cubic-bezier(.05,1.5,.2,1);
}

#prizeWon{
  position:relative;
  z-index:3;
  margin-top:20px;
  font-size:clamp(20px,6vw,38px);
  font-weight:1000;
  letter-spacing:.15em;
}

@keyframes prizeIn{
  0%{
    transform:scale(.15) rotate(-8deg);
    opacity:0;
    filter:blur(14px);
  }

  70%{
    transform:scale(1.18) rotate(2deg);
    opacity:1;
    filter:blur(0);
  }

  100%{
    transform:scale(1) rotate(0);
  }
}
</style>
</head>

<script>

const $ =
  s => document.querySelector(s);

const $$ =
  s => [...document.querySelectorAll(s)];

const sleep =
  ms => new Promise(r => setTimeout(r,ms));


let busy = false;
let chestBusy = false;
let selectedPrize = null;

let audioCtx = null;

let tensionOsc1 = null;
let tensionOsc2 = null;
let tensionGain = null;
let pulseTimer = null;

const hitMusic =
  $("#hitMusic");


/* ===== AUDIO ===== */

function initAudio(){

  if(!audioCtx){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}


async function unlockHitMusic(){

  try{

    hitMusic.pause();
    hitMusic.currentTime = 0;
    hitMusic.muted = false;
    hitMusic.volume = .001;

    await hitMusic.play();

    await sleep(60);

    hitMusic.pause();
    hitMusic.currentTime = 0;
    hitMusic.volume = 1;

  }catch(e){

    hitMusic.volume = 1;

  }
}


/* ===== 緊張音 ===== */

function startTension(){

  initAudio();

  stopTension();

  const now =
    audioCtx.currentTime;

  tensionGain =
    audioCtx.createGain();

  tensionGain.gain
    .setValueAtTime(.0001,now);

  tensionGain.gain
    .exponentialRampToValueAtTime(
      .07,
      now + .8
    );

  tensionOsc1 =
    audioCtx.createOscillator();

  tensionOsc2 =
    audioCtx.createOscillator();

  tensionOsc1.type =
    "sine";

  tensionOsc2.type =
    "triangle";

  tensionOsc1.frequency.value =
    52;

  tensionOsc2.frequency.value =
    78;

  tensionOsc1.connect(tensionGain);
  tensionOsc2.connect(tensionGain);

  tensionGain.connect(
    audioCtx.destination
  );

  tensionOsc1.start();
  tensionOsc2.start();

  pulseTimer =
    setInterval(() => {

      if(!tensionGain) return;

      const t =
        audioCtx.currentTime;

      tensionGain.gain
        .cancelScheduledValues(t);

      tensionGain.gain
        .setValueAtTime(.035,t);

      tensionGain.gain
        .exponentialRampToValueAtTime(
          .11,
          t + .08
        );

      tensionGain.gain
        .exponentialRampToValueAtTime(
          .035,
          t + .48
        );

    },650);
}


function stopTension(){

  if(pulseTimer){

    clearInterval(pulseTimer);

    pulseTimer = null;
  }

  try{
    tensionOsc1?.stop();
  }catch(e){}

  try{
    tensionOsc2?.stop();
  }catch(e){}

  tensionOsc1 = null;
  tensionOsc2 = null;
  tensionGain = null;
}


/* ===== カウント音 ===== */

function countSound(n){

  initAudio();

  const now =
    audioCtx.currentTime;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  const freq = {
    3:115,
    2:98,
    1:80,
    0:62
  };

  osc.type = "sine";

  osc.frequency
    .setValueAtTime(
      freq[n] || 90,
      now
    );

  osc.frequency
    .exponentialRampToValueAtTime(
      44,
      now + .45
    );

  gain.gain
    .setValueAtTime(.0001,now);

  gain.gain
    .exponentialRampToValueAtTime(
      .5,
      now + .015
    );

  gain.gain
    .exponentialRampToValueAtTime(
      .0001,
      now + .55
    );

  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  osc.start(now);
  osc.stop(now + .6);
}


/* ===== 違和感音 ===== */

function strangeCountSound(){

  initAudio();

  const now =
    audioCtx.currentTime;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type = "triangle";

  osc.frequency
    .setValueAtTime(165,now);

  osc.frequency
    .exponentialRampToValueAtTime(
      55,
      now + .55
    );

  gain.gain
    .setValueAtTime(.32,now);

  gain.gain
    .exponentialRampToValueAtTime(
      .0001,
      now + .55
    );

  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  osc.start(now);
  osc.stop(now + .6);
}


/* ===== プチュン ===== */

function puchunSound(){

  initAudio();

  const now =
    audioCtx.currentTime;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type = "square";

  osc.frequency
    .setValueAtTime(280,now);

  osc.frequency
    .exponentialRampToValueAtTime(
      28,
      now + .12
    );

  gain.gain
    .setValueAtTime(.4,now);

  gain.gain
    .exponentialRampToValueAtTime(
      .0001,
      now + .13
    );

  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  osc.start(now);
  osc.stop(now + .14);
}


/* ===== 切り裂き ===== */

function slashSound(){

  initAudio();

  const now =
    audioCtx.currentTime;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type = "sawtooth";

  osc.frequency
    .setValueAtTime(1600,now);

  osc.frequency
    .exponentialRampToValueAtTime(
      170,
      now + .15
    );

  gain.gain
    .setValueAtTime(.32,now);

  gain.gain
    .exponentialRampToValueAtTime(
      .0001,
      now + .18
    );

  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  osc.start(now);
  osc.stop(now + .2);


  const bass =
    audioCtx.createOscillator();

  const bassGain =
    audioCtx.createGain();

  bass.type = "sine";

  bass.frequency
    .setValueAtTime(95,now);

  bass.frequency
    .exponentialRampToValueAtTime(
      32,
      now + .5
    );

  bassGain.gain
    .setValueAtTime(.75,now);

  bassGain.gain
    .exponentialRampToValueAtTime(
      .0001,
      now + .5
    );

  bass.connect(bassGain);

  bassGain.connect(
    audioCtx.destination
  );

  bass.start(now);
  bass.stop(now + .55);
}


/* ===== 当たり曲 ===== */

async function playHitMusic(){

  try{

    hitMusic.pause();

    hitMusic.currentTime = 0;

    hitMusic.volume = 1;

    await hitMusic.play();

  }catch(e){

    console.log(e);

  }
}


/* =========================
   宝箱の等級抽選

   1等 5%
   2等 20%
   3等 75%
========================= */

function drawPrize(){

  const r =
    Math.random();

  if(r < .05){

    return{
      label:"1等",
      className:"first"
    };

  }

  if(r < .25){

    return{
      label:"2等",
      className:"second"
    };

  }

  return{
    label:"3等",
    className:"third"
  };
}


/* ===== 数字 ===== */

function resetNumberStyle(){

  const n =
    $("#number");

  n.className = "";

  n.style.opacity = "";
  n.style.transform = "";
  n.style.left = "";
  n.style.top = "";
  n.style.color = "";
}


function showNumber(
  value,
  sound = true
){

  resetNumberStyle();

  const n =
    $("#number");

  n.textContent =
    value;

  n.dataset.num =
    value;

  void n.offsetWidth;

  n.classList.add("show");

  if(sound){
    countSound(value);
  }
}


/* ===== 違和感約20種類 ===== */

async function applyWeirdEffect(){

  const type =
    Math.floor(
      Math.random() * 20
    );

  const n =
    $("#number");


  switch(type){

    case 0:

      n.classList.add("red");

      break;


    case 1:

      n.classList.add("gold");

      break;


    case 2:

      n.classList.add("small");

      break;


    case 3:

      n.classList.add("big");

      break;


    case 4:

      n.classList.add("thin");

      break;


    case 5:

      n.classList.add("shiftLeft");

      break;


    case 6:

      n.classList.add("shiftRight");

      break;


    case 7:

      n.classList.add("shiftUp");

      break;


    case 8:

      n.classList.add("double");

      break;


    case 9:

      n.classList.add("mirror");

      break;


    case 10:

      n.classList.add("flicker");

      break;


    case 11:

      n.classList.add("ghost");

      break;


    case 12:

      n.style.opacity = "0";

      await sleep(100);

      n.style.opacity = "1";

      break;


    case 13:

      const old =
        n.textContent;

      n.textContent = "0";

      await sleep(90);

      n.textContent = old;

      break;


    case 14:

      $("#weirdMark")
        .style.display =
        "block";

      await sleep(90);

      $("#weirdMark")
        .style.display =
        "none";

      break;


    case 15:

      $("#stage")
        .style.background =
        "radial-gradient(circle,#390000,#000 70%)";

      await sleep(100);

      $("#stage")
        .style.background =
        "";

      break;


    case 16:

      flash();

      break;


    case 17:

      strangeCountSound();

      break;


    case 18:

      $("#black")
        .style.display =
        "block";

      await sleep(100);

      $("#black")
        .style.display =
        "none";

      break;


    case 19:

      stopTension();

      await sleep(550);

      startTension();

      break;
  }
}


/* ===== フラッシュ ===== */

function flash(){

  const f =
    $("#flash");

  f.className = "";

  void f.offsetWidth;

  f.className = "go";
}


/* ===== 当たり ===== */

async function slashHit(){

  stopTension();

  await sleep(180);

  slashSound();

  $("#slash")
    .className =
    "go";

  await sleep(170);

  flash();

  await sleep(300);

  $("#slash")
    .className =
    "";

  await showHit();
}


async function showHit(){

  $("#hit")
    .className =
    "show";

  playHitMusic();

  await sleep(2200);

  $("#hit")
    .className =
    "";

  showTreasure();
}


/* ===== プチュン直接当たり ===== */

async function puchunDirect(){

  stopTension();

  puchunSound();

  await sleep(80);

  $("#black")
    .style.display =
    "block";

  $("#number")
    .textContent =
    "";

  await sleep(
    1800 +
    Math.random()*1300
  );

  $("#black")
    .style.display =
    "none";

  await slashHit();
}


/* ===== プチュン→再カウント ===== */

async function puchunRecount(){

  stopTension();

  puchunSound();

  await sleep(80);

  $("#black")
    .style.display =
    "block";

  $("#number")
    .textContent =
    "";

  await sleep(2200);

  $("#black")
    .style.display =
    "none";

  await sleep(600);

  startTension();

  await recountSequence();
}


/* ===== 再カウント ===== */

async function recountSequence(){

  const hitPoint =
    Math.floor(
      Math.random()*4
    );


  showNumber(3);

  if(hitPoint === 0){

    await sleep(1250);

    return slashHit();
  }

  await sleep(1900);


  showNumber(2);

  if(hitPoint === 1){

    await sleep(1400);

    return slashHit();
  }

  await sleep(2050);


  showNumber(1);

  if(hitPoint === 2){

    await sleep(1550);

    return slashHit();
  }

  await sleep(2200);


  $("#number")
    .textContent =
    "";

  await sleep(900);

  return slashHit();
}


/* ===== 逆戻り ===== */

async function reverseCountdown(){

  showNumber(3);

  await sleep(1800);

  showNumber(2);

  await sleep(1900);

  showNumber(1);

  await sleep(1800);

  showNumber(2);

  await sleep(1500);

  showNumber(1);

  await sleep(1500);

  return slashHit();
}


/* ===== 0出現 ===== */

async function zeroPremium(){

  showNumber(3);

  await sleep(1800);

  showNumber(2);

  await sleep(1900);

  showNumber(1);

  await sleep(1900);

  showNumber(0);

  await sleep(850);

  return slashHit();
}


/* ===== 数字消失 ===== */

async function numberDisappear(){

  showNumber(3);

  await sleep(1800);

  showNumber(2);

  await sleep(1800);

  $("#number")
    .textContent =
    "";

  stopTension();

  await sleep(2100);

  return slashHit();
}


/* ===== 音だけ停止 ===== */

async function soundStopPattern(){

  showNumber(3);

  await sleep(1750);

  showNumber(2);

  await sleep(1800);

  showNumber(1);

  await sleep(800);

  stopTension();

  await sleep(2200);

  return slashHit();
}


/* ===== 超ロング1 ===== */

async function longOne(){

  showNumber(3);

  await sleep(1800);

  showNumber(2);

  await sleep(1900);

  showNumber(1);

  await sleep(3900);

  return slashHit();
}


/* ===== 2フリーズ ===== */

async function freezeTwo(){

  showNumber(3);

  await sleep(1850);

  showNumber(2);

  await sleep(3900);

  return slashHit();
}


/* ===== フェイク切り裂き ===== */

async function fakeSlashPattern(){

  showNumber(3);

  await sleep(1800);

  showNumber(2);

  await sleep(1200);

  slashSound();

  $("#slash")
    .className =
    "go";

  await sleep(170);

  $("#slash")
    .className =
    "";

  await sleep(700);

  showNumber(1);

  await sleep(2200);

  return slashHit();
}


/* ===== 違和感付き ===== */

async function weirdCountdown(){

  showNumber(3);

  if(Math.random()<.55){
    await applyWeirdEffect();
  }

  await sleep(1700);


  showNumber(2);

  if(Math.random()<.60){
    await applyWeirdEffect();
  }

  await sleep(1900);


  showNumber(1);

  if(Math.random()<.70){
    await applyWeirdEffect();
  }

  await sleep(2000);

  return slashHit();
}


/* ===== 無音START ===== */

async function silentStart(){

  stopTension();

  showNumber(
    3,
    false
  );

  await sleep(1900);

  startTension();

  showNumber(2);

  await sleep(1900);

  showNumber(1);

  await sleep(1900);

  return slashHit();
}


/* ===== 2周目カウント ===== */

async function doubleCountdown(){

  showNumber(3);

  await sleep(1700);

  showNumber(2);

  await sleep(1800);

  showNumber(1);

  await sleep(1900);

  $("#number")
    .textContent =
    "";

  await sleep(1500);

  return recountSequence();
}


/* ===== 通常途中当たり ===== */

async function normalHitAt(
  point
){

  showNumber(3);

  if(point === 3){

    await sleep(1350);

    return slashHit();
  }

  await sleep(1900);


  showNumber(2);

  if(point === 2){

    await sleep(1450);

    return slashHit();
  }

  await sleep(2050);


  showNumber(1);

  if(point === 1){

    await sleep(1650);

    return slashHit();
  }

  await sleep(2250);

  $("#number")
    .textContent =
    "";

  await sleep(700);

  return slashHit();
}


/* ===== 通常暗転 ===== */

async function normalBlackout(){

  showNumber(3);

  await sleep(1700);

  showNumber(2);

  await sleep(1800);

  showNumber(1);

  await sleep(1800);

  stopTension();

  $("#black")
    .style.display =
    "block";

  await sleep(1400);

  $("#black")
    .style.display =
    "none";

  return slashHit();
}


/* ===== 宝箱表示 ===== */

function showTreasure(){

  /*
    ここで等級を1回だけ決定。

    1等 5%
    2等 20%
    3等 75%
  */

  selectedPrize =
    drawPrize();

  chestBusy =
    false;

  $$(".chest")
    .forEach(chest => {

      chest.classList.remove(
        "selected",
        "open",
        "dim",
        "disabled"
      );

    });

  $("#treasureScreen")
    .className =
    "show";
}


/* ===== 宝箱を選択 ===== */

async function chooseChest(
  chest
){

  if(chestBusy) return;

  chestBusy = true;


  $$(".chest")
    .forEach(c => {

      c.classList.add(
        "disabled"
      );

      if(c !== chest){

        c.classList.add(
          "dim"
        );

      }

    });


  chest.classList.add(
    "selected"
  );


  await sleep(1100);


  chest.classList.remove(
    "selected"
  );


  await sleep(350);


  chest.classList.add(
    "open"
  );


  await sleep(350);


  flash();


  await sleep(600);


  showPrize();
}


/* ===== 等級表示 ===== */

function showPrize(){

  $("#treasureScreen")
    .className =
    "";

  $("#prizeLabel")
    .textContent =
    selectedPrize.label;

  $("#prizeBox")
    .className =
    "show " +
    selectedPrize.className;

  flash();
}


/* ===== START ===== */

async function play(){

  if(busy) return;

  busy = true;

  initAudio();

  await unlockHitMusic();

  $("#start")
    .style.display =
    "none";

  startTension();


  /*
    TEST MODE
    現在は100%当たり

    演出18系統から
    ランダム選択
  */

  const pattern =
    Math.floor(
      Math.random()*18
    );


  switch(pattern){

    case 0:
      return normalHitAt(3);

    case 1:
      return normalHitAt(2);

    case 2:
      return normalHitAt(1);

    case 3:
      return normalHitAt(0);

    case 4:
      return normalBlackout();

    case 5:
      return freezeTwo();

    case 6:
      return reverseCountdown();

    case 7:
      return zeroPremium();

    case 8:
      return numberDisappear();

    case 9:
      return soundStopPattern();

    case 10:
      return longOne();

    case 11:
      return recountSequence();

    case 12:
      return doubleCountdown();

    case 13:
      return puchunDirect();

    case 14:
      return puchunRecount();

    case 15:
      return fakeSlashPattern();

    case 16:
      return weirdCountdown();

    case 17:
      return silentStart();
  }
}


/* ===== RESET ===== */

function reset(){

  stopTension();

  hitMusic.pause();

  try{
    hitMusic.currentTime = 0;
  }catch(e){}


  $("#hit")
    .className =
    "";

  $("#treasureScreen")
    .className =
    "";

  $("#prizeBox")
    .className =
    "";

  $("#slash")
    .className =
    "";

  $("#black")
    .style.display =
    "none";

  $("#weirdMark")
    .style.display =
    "none";

  $("#stage")
    .style.background =
    "";

  resetNumberStyle();

  $("#number")
    .textContent =
    "3";

  $("#number")
    .dataset.num =
    "3";


  $$(".chest")
    .forEach(chest => {

      chest.classList.remove(
        "selected",
        "open",
        "dim",
        "disabled"
      );

    });


  $("#start")
    .style.display =
    "block";


  selectedPrize = null;
  chestBusy = false;
  busy = false;
}


/* ===== BUTTONS ===== */

$("#start")
  .addEventListener(
    "click",
    play
  );


$$(".chest")
  .forEach(chest => {

    chest.addEventListener(
      "click",
      () => chooseChest(chest)
    );

  });


$("#next")
  .addEventListener(
    "click",
    reset
  );

</script>
