<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RP COUNTDOWN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#120008;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  user-select:none;
}

body{
  position:fixed;
  inset:0;
}

#game{
  position:absolute;
  inset:0;
  overflow:hidden;
  background-image:url("./9E28B31B-C619-4F41-AB55-91C025168D02.png");
  background-size:auto 100%;
  background-position:center top;
  background-repeat:no-repeat;
  background-color:#120008;
}

/* =========================
   START
========================= */

#startScreen{
  position:absolute;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding-bottom:max(9vh,55px);
  background:rgba(20,0,10,.16);
}

#startButton{
  width:min(78vw,390px);
  padding:20px 20px;
  border:2px solid rgba(255,255,255,.9);
  border-radius:999px;
  background:linear-gradient(#ff78b9,#d51c72);
  color:white;
  font-size:32px;
  font-weight:900;
  letter-spacing:.1em;
  box-shadow:
    0 7px 0 #8f0045,
    0 12px 25px rgba(0,0,0,.45);
}

#startButton:active{
  transform:translateY(5px);
  box-shadow:
    0 2px 0 #8f0045,
    0 7px 15px rgba(0,0,0,.35);
}

#probability{
  margin-top:20px;
  color:white;
  text-align:center;
  font-size:14px;
  line-height:1.8;
  font-weight:700;
  text-shadow:0 2px 5px #000;
}

/* =========================
   COUNT NUMBER
========================= */

#number{
  position:absolute;
  z-index:30;
  left:50%;
  top:61%;
  transform:translate(-50%,-50%);
  font-size:min(52vw,255px);
  line-height:1;
  font-weight:1000;
  color:#fff7fb;
  -webkit-text-stroke:clamp(5px,1.6vw,9px) #ff4b9d;
  text-shadow:
    0 6px 0 #d82779,
    0 12px 0 #a80052,
    0 18px 8px rgba(60,0,28,.72);
  display:none;
  pointer-events:none;
}

.numberPop{
  animation:numberPop .20s ease-out;
}

@keyframes numberPop{
  0%{transform:translate(-50%,-50%) scale(.78)}
  70%{transform:translate(-50%,-50%) scale(1.07)}
  100%{transform:translate(-50%,-50%) scale(1)}
}

#message{
  position:absolute;
  z-index:35;
  left:50%;
  top:61%;
  transform:translate(-50%,-50%);
  width:100%;
  text-align:center;
  color:#fff;
  font-size:90px;
  font-weight:1000;
  -webkit-text-stroke:3px #ff4b9d;
  text-shadow:
    0 5px 0 #c8186b,
    0 10px 12px rgba(0,0,0,.7);
  display:none;
  pointer-events:none;
}

/* =========================
   SHOOTING STARS
========================= */

#starLayer{
  position:absolute;
  inset:0;
  z-index:20;
  overflow:hidden;
  pointer-events:none;
}

.shootingStar{
  position:absolute;
  width:11px;
  height:11px;
  border-radius:50%;
  background:#fff;
  opacity:0;
  filter:
    drop-shadow(0 0 5px white)
    drop-shadow(0 0 12px rgba(255,220,245,.95));
  transform:rotate(var(--angle));
  transform-origin:center;
  animation:shoot var(--duration) cubic-bezier(.12,.65,.25,1) forwards;
}

.shootingStar::before{
  content:"";
  position:absolute;
  right:3px;
  top:50%;
  width:var(--tail);
  height:4px;
  transform:translateY(-50%);
  transform-origin:right center;
  background:linear-gradient(
    90deg,
    transparent 0%,
    rgba(255,255,255,.08) 15%,
    rgba(255,235,247,.35) 45%,
    rgba(255,255,255,.95) 100%
  );
  border-radius:100%;
  filter:blur(.3px);
}

.shootingStar::after{
  content:"";
  position:absolute;
  inset:-5px;
  border-radius:50%;
  background:rgba(255,255,255,.45);
  filter:blur(6px);
}

@keyframes shoot{
  0%{
    opacity:0;
    transform:
      translate3d(0,0,0)
      rotate(var(--angle))
      scale(.45);
  }

  8%{
    opacity:1;
  }

  68%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:
      translate3d(var(--travelX),var(--travelY),0)
      rotate(var(--angle))
      scale(.75);
  }
}

/* =========================
   BLACKOUT / FLASH
========================= */

#blackout{
  position:absolute;
  inset:0;
  z-index:50;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity .08s linear;
}

#flash{
  position:absolute;
  inset:0;
  z-index:75;
  background:white;
  opacity:0;
  pointer-events:none;
}

.flashHit{
  animation:flashHit .38s ease-out;
}

@keyframes flashHit{
  0%{opacity:0}
  12%{opacity:1}
  35%{opacity:.95}
  100%{opacity:0}
}

/* =========================
   SLASH
========================= */

#slashLayer{
  position:absolute;
  inset:0;
  z-index:70;
  pointer-events:none;
  overflow:hidden;
}

.slash{
  position:absolute;
  left:-25%;
  top:48%;
  width:150%;
  height:18px;
  opacity:0;
  border-radius:100%;
  background:
    linear-gradient(
      90deg,
      transparent 0%,
      #ff73bd 15%,
      #fff 43%,
      #fff 58%,
      #ff4ba3 83%,
      transparent 100%
    );
  box-shadow:
    0 0 8px #fff,
    0 0 20px #fff,
    0 0 35px #ff5cac,
    0 0 65px #ff1687;
  transform:rotate(-18deg) scaleX(.05);
  animation:slashCut .55s cubic-bezier(.08,.8,.2,1) forwards;
}

.slash::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:-15px;
  height:48px;
  background:linear-gradient(
    transparent,
    rgba(255,255,255,.5),
    transparent
  );
  filter:blur(10px);
}

.slash.second{
  top:53%;
  transform:rotate(19deg) scaleX(.05);
  animation-delay:.07s;
}

@keyframes slashCut{
  0%{
    opacity:0;
    transform:rotate(-18deg) scaleX(.02);
  }
  10%{
    opacity:1;
  }
  42%{
    opacity:1;
    transform:rotate(-18deg) scaleX(1);
  }
  100%{
    opacity:0;
    transform:rotate(-18deg) scaleX(1.08);
  }
}

.slash.second{
  animation-name:slashCut2;
}

@keyframes slashCut2{
  0%{
    opacity:0;
    transform:rotate(19deg) scaleX(.02);
  }
  10%{
    opacity:1;
  }
  42%{
    opacity:1;
    transform:rotate(19deg) scaleX(1);
  }
  100%{
    opacity:0;
    transform:rotate(19deg) scaleX(1.08);
  }
}

/* =========================
   HIT
========================= */

#hitText{
  position:absolute;
  z-index:80;
  left:50%;
  top:52%;
  width:140vw;
  transform:translate(-50%,-50%);
  text-align:center;
  color:#fff9dc;
  font-size:min(34vw,175px);
  line-height:1;
  font-weight:1000;
  letter-spacing:-.06em;
  -webkit-text-stroke:clamp(6px,2vw,11px) #ff197f;
  text-shadow:
    0 7px 0 #d30061,
    0 14px 0 #7e003b,
    0 0 18px #fff,
    0 0 38px #ff55a7,
    0 0 70px #ff1681;
  opacity:0;
  pointer-events:none;
}

.hitTextPop{
  animation:hitTextPop .65s cubic-bezier(.12,.8,.2,1.15) forwards;
}

@keyframes hitTextPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(2.5);
    filter:brightness(3);
  }
  32%{
    opacity:1;
    transform:translate(-50%,-50%) scale(.88);
  }
  55%{
    transform:translate(-50%,-50%) scale(1.13);
  }
  75%{
    transform:translate(-50%,-50%) scale(.97);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    filter:brightness(1);
  }
}

.hitShake{
  animation:hitShake .42s linear;
}

@keyframes hitShake{
  0%{transform:translate(0,0)}
  10%{transform:translate(-13px,8px)}
  20%{transform:translate(12px,-8px)}
  30%{transform:translate(-10px,-5px)}
  40%{transform:translate(9px,7px)}
  50%{transform:translate(-7px,4px)}
  60%{transform:translate(6px,-5px)}
  75%{transform:translate(-3px,3px)}
  100%{transform:translate(0,0)}
}

/* =========================
   TREASURE
========================= */

#treasure{
  position:absolute;
  inset:0;
  z-index:110;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:rgba(18,0,8,.82);
  backdrop-filter:blur(3px);
  color:white;
  padding:20px;
}

#treasureTitle{
  text-align:center;
  font-size:24px;
  line-height:1.55;
  font-weight:900;
  text-shadow:0 2px 10px #000;
  margin-bottom:30px;
}

#chests{
  display:flex;
  width:100%;
  max-width:520px;
  justify-content:space-around;
  gap:8px;
}

.chest{
  width:30%;
  aspect-ratio:1/1;
  border:none;
  background:none;
  color:white;
  position:relative;
  padding:0;
}

.chestBox{
  position:absolute;
  inset:15% 5% 8%;
  border-radius:15px 15px 20px 20px;
  background:linear-gradient(#ff9cc9,#b5105e);
  border:4px solid #ffe0ee;
  box-shadow:
    0 8px 0 #700037,
    0 13px 20px rgba(0,0,0,.5);
}

.chestLid{
  position:absolute;
  left:4%;
  top:10%;
  width:92%;
  height:38%;
  border-radius:25px 25px 7px 7px;
  background:linear-gradient(#ffcae2,#d5277b);
  border:4px solid #fff0f7;
  transform-origin:center bottom;
  transition:transform .35s ease;
  z-index:2;
}

.chestLock{
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  width:24%;
  height:27%;
  border-radius:5px;
  background:#ffd967;
  border:3px solid #9d6500;
  z-index:4;
}

.chest.open .chestLid{
  transform:rotateX(125deg) translateY(-7px);
}

.chest.shake{
  animation:chestShake .5s linear;
}

@keyframes chestShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px) rotate(-3deg)}
  40%{transform:translateX(8px) rotate(3deg)}
  60%{transform:translateX(-6px) rotate(-2deg)}
  80%{transform:translateX(5px) rotate(2deg)}
}

.rankLabel{
  position:absolute;
  z-index:6;
  left:50%;
  bottom:-25px;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:25px;
  font-weight:1000;
  text-shadow:0 2px 5px #000;
  display:none;
}

.rank1{color:#ffd84e}
.rank2{color:#e9eef7}
.rank3{color:#e99a4c}

#prizeResult{
  margin-top:45px;
  min-height:70px;
  text-align:center;
  font-size:42px;
  font-weight:1000;
  text-shadow:0 3px 10px #000;
}

#nextButton{
  margin-top:25px;
  padding:14px 50px;
  border:none;
  border-radius:999px;
  background:#fff;
  color:#b00055;
  font-size:20px;
  font-weight:900;
  display:none;
}

/* =========================
   MISC
========================= */

.goldNumber{
  color:#fff6bd !important;
  -webkit-text-stroke-color:#f0ad00 !important;
  text-shadow:
    0 6px 0 #c78900,
    0 12px 0 #805200,
    0 0 20px #fff2a4 !important;
}

.redNumber{
  color:#fff !important;
  -webkit-text-stroke-color:#ff1717 !important;
  text-shadow:
    0 6px 0 #c00000,
    0 12px 0 #720000 !important;
}
</style>
</head>

<body>

<div id="game">

  <div id="starLayer"></div>

  <div id="number"></div>
  <div id="message"></div>

  <div id="blackout"></div>
  <div id="slashLayer"></div>
  <div id="flash"></div>
  <div id="hitText">当たり</div>

  <div id="startScreen">
    <button id="startButton">START</button>
    <div id="probability">
      完全抽選 1/30<br>
      毎回独立抽選
    </div>
  </div>

  <div id="treasure">
    <div id="treasureTitle">
      ここからが本番。<br>
      運命の宝箱を選べ！<br>
      この一箱が、結果を決める。
    </div>

    <div id="chests">
      <button class="chest" data-index="0">
        <div class="chestLid"></div>
        <div class="chestBox"></div>
        <div class="chestLock"></div>
        <div class="rankLabel"></div>
      </button>

      <button class="chest" data-index="1">
        <div class="chestLid"></div>
        <div class="chestBox"></div>
        <div class="chestLock"></div>
        <div class="rankLabel"></div>
      </button>

      <button class="chest" data-index="2">
        <div class="chestLid"></div>
        <div class="chestBox"></div>
        <div class="chestLock"></div>
        <div class="rankLabel"></div>
      </button>
    </div>

    <div id="prizeResult"></div>
    <button id="nextButton">NEXT</button>
  </div>

</div>

<script>
const game = document.getElementById("game");
const startScreen = document.getElementById("startScreen");
const startButton = document.getElementById("startButton");
const number = document.getElementById("number");
const message = document.getElementById("message");
const blackout = document.getElementById("blackout");
const flash = document.getElementById("flash");
const slashLayer = document.getElementById("slashLayer");
const hitText = document.getElementById("hitText");
const starLayer = document.getElementById("starLayer");

const treasure = document.getElementById("treasure");
const treasureTitle = document.getElementById("treasureTitle");
const prizeResult = document.getElementById("prizeResult");
const nextButton = document.getElementById("nextButton");
const chests = [...document.querySelectorAll(".chest")];

let playing = false;
let playToken = 0;
let starTimers = [];

const sleep = ms => new Promise(r => setTimeout(r,ms));

/* =========================================================
   AUDIO
   MP3をWeb Audioで再生
   synthetic tone / oscillator は一切なし
========================================================= */

let audioCtx = null;
let tensionBuffer = null;
let hitBuffer = null;

let tensionSource = null;
let tensionGain = null;
let hitSource = null;

let audioPreparing = null;

function ensureAudioContext(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
}

async function prepareAudio(){
  ensureAudioContext();

  if(!audioCtx) return;

  if(tensionBuffer && hitBuffer) return;

  if(audioPreparing){
    await audioPreparing;
    return;
  }

  audioPreparing = (async()=>{
    try{
      const [tensionRes,hitRes] = await Promise.all([
        fetch("./Tension.mp3"),
        fetch("./hit_music_final.mp3")
      ]);

      const [tensionData,hitData] = await Promise.all([
        tensionRes.arrayBuffer(),
        hitRes.arrayBuffer()
      ]);

      const [tBuf,hBuf] = await Promise.all([
        audioCtx.decodeAudioData(tensionData),
        audioCtx.decodeAudioData(hitData)
      ]);

      tensionBuffer = tBuf;
      hitBuffer = hBuf;
    }catch(e){
      console.log("audio load error",e);
    }
  })();

  await audioPreparing;
}

async function unlockAudio(){
  ensureAudioContext();
  if(!audioCtx) return;

  /* iPhone対策：
     ユーザーがSTARTを押した瞬間にresumeを先に呼ぶ */
  const resumePromise = audioCtx.resume();

  try{
    await resumePromise;
  }catch(e){}

  await prepareAudio();
}

function startTension(){
  if(!audioCtx || !tensionBuffer) return;

  stopTension();

  tensionSource = audioCtx.createBufferSource();
  tensionGain = audioCtx.createGain();

  tensionSource.buffer = tensionBuffer;
  tensionSource.loop = true;

  tensionGain.gain.value = .72;

  tensionSource.connect(tensionGain);
  tensionGain.connect(audioCtx.destination);

  tensionSource.start(0);
}

function stopTension(){
  if(tensionSource){
    try{ tensionSource.stop(); }catch(e){}
    try{ tensionSource.disconnect(); }catch(e){}
    tensionSource = null;
  }

  if(tensionGain){
    try{ tensionGain.disconnect(); }catch(e){}
    tensionGain = null;
  }
}

function stopHitMusic(){
  if(hitSource){
    try{ hitSource.stop(); }catch(e){}
    try{ hitSource.disconnect(); }catch(e){}
    hitSource = null;
  }
}

function playHitMusic(){
  if(!audioCtx || !hitBuffer) return;

  stopHitMusic();

  hitSource = audioCtx.createBufferSource();
  const gain = audioCtx.createGain();

  hitSource.buffer = hitBuffer;
  gain.gain.value = 1;

  hitSource.connect(gain);
  gain.connect(audioCtx.destination);

  hitSource.start(0);
}

/* =========================================================
   BASIC DISPLAY
========================================================= */

function showNumber(n){
  message.style.display = "none";

  number.classList.remove(
    "numberPop",
    "goldNumber",
    "redNumber"
  );

  number.textContent = n;
  number.style.display = "block";

  void number.offsetWidth;
  number.classList.add("numberPop");
}

function hideNumber(){
  number.style.display = "none";
}

async function showDots(duration=1200){
  hideNumber();

  message.textContent = "…";
  message.style.display = "block";

  await sleep(duration);

  message.style.display = "none";
}

async function normalCount(){
  showNumber("3");
  await sleep(1800);

  showNumber("2");
  await sleep(1900);

  showNumber("1");
  await sleep(2100);
}

/* =========================================================
   SHOOTING STAR
   1〜10本
   明るい先端 + 長い尾 + 残光
========================================================= */

function clearStarTimers(){
  starTimers.forEach(t => clearTimeout(t));
  starTimers = [];
  starLayer.innerHTML = "";
}

function makeStar(){
  const star = document.createElement("div");
  star.className = "shootingStar";

  /*
    主に画面上〜中央に出す。
    端からではなく空中から突然流れる。
  */
  const startX = 5 + Math.random()*65;
  const startY = 7 + Math.random()*37;

  const angle = 14 + Math.random()*24;

  const travelX = 150 + Math.random()*170;
  const travelY = 55 + Math.random()*120;

  const tail = 120 + Math.random()*150;
  const duration = .55 + Math.random()*.38;

  star.style.left = startX + "vw";
  star.style.top = startY + "vh";

  star.style.setProperty("--angle",angle+"deg");
  star.style.setProperty("--travelX",travelX+"px");
  star.style.setProperty("--travelY",travelY+"px");
  star.style.setProperty("--tail",tail+"px");
  star.style.setProperty("--duration",duration+"s");

  /*
    少しだけ個体差。
    棒ではなく先端の光を認識しやすくする。
  */
  const size = 9 + Math.random()*7;
  star.style.width = size+"px";
  star.style.height = size+"px";

  starLayer.appendChild(star);

  setTimeout(()=>{
    star.remove();
  },1600);
}

function meteorBurst(count){
  const token = playToken;

  for(let i=0;i<count;i++){
    const delay =
      i * (100 + Math.random()*220) +
      Math.random()*180;

    const timer = setTimeout(()=>{
      if(!playing || token !== playToken) return;
      makeStar();
    },delay);

    starTimers.push(timer);
  }
}

function randomMeteorCount(){
  const r = Math.random();

  if(r < .32){
    return 1 + Math.floor(Math.random()*2);     // 1〜2
  }

  if(r < .67){
    return 2 + Math.floor(Math.random()*2);     // 2〜3
  }

  if(r < .90){
    return 4 + Math.floor(Math.random()*3);     // 4〜6
  }

  return 7 + Math.floor(Math.random()*4);       // 7〜10
}

/*
  当たり判定とは完全に別。
  ハズレでも大量に流れる。
*/
function scheduleStars(){
  const token = playToken;

  /* 70%のプレイで最低1回 */
  if(Math.random() > .70) return;

  const firstDelay = 550 + Math.random()*4700;

  let timer = setTimeout(()=>{
    if(!playing || token !== playToken) return;

    meteorBurst(randomMeteorCount());

  },firstDelay);

  starTimers.push(timer);

  /* 25%で2回目 */
  if(Math.random() < .25){

    timer = setTimeout(()=>{
      if(!playing || token !== playToken) return;

      meteorBurst(randomMeteorCount());

    },3200 + Math.random()*4200);

    starTimers.push(timer);
  }
}

/* =========================================================
   BLACKOUT / FLASH / SLASH
========================================================= */

async function doBlackout(duration=250){
  blackout.style.opacity = "1";
  await sleep(duration);
  blackout.style.opacity = "0";
}

function doFlash(){
  flash.classList.remove("flashHit");
  void flash.offsetWidth;
  flash.classList.add("flashHit");
}

function createSlash(doubleSlash=false){
  slashLayer.innerHTML = "";

  const s1 = document.createElement("div");
  s1.className = "slash";
  slashLayer.appendChild(s1);

  if(doubleSlash){
    const s2 = document.createElement("div");
    s2.className = "slash second";
    slashLayer.appendChild(s2);
  }

  setTimeout(()=>{
    slashLayer.innerHTML = "";
  },900);
}

function doHitShake(){
  game.classList.remove("hitShake");
  void game.offsetWidth;
  game.classList.add("hitShake");

  setTimeout(()=>{
    game.classList.remove("hitShake");
  },450);
}

/* =========================================================
   REAL HIT
   ★ 当たりインパクト強化版 ★

   Tensionブツ切り
   ↓
   約0.5秒 完全無音
   ↓
   暗転
   ↓
   極太斬撃
   ↓
   強烈白フラッシュ
   ↓
   一発画面衝撃
   ↓
   超巨大 当たり
   ↓
   hit_music_final.mp3
========================================================= */

async function HIT(options={}){
  hideNumber();
  message.style.display = "none";

  /* ブツ切り */
  stopTension();

  /* ここが「来る…？」の間 */
  await sleep(options.silence ?? 520);

  /* 一瞬真っ暗 */
  blackout.style.opacity = "1";
  await sleep(180);
  blackout.style.opacity = "0";

  await sleep(45);

  /* 斬撃 */
  createSlash(options.doubleSlash === true);

  await sleep(105);

  /* 白フラッシュ + 一発だけ画面衝撃 */
  doFlash();
  doHitShake();

  await sleep(70);

  /* 当たり文字 */
  hitText.classList.remove("hitTextPop");
  hitText.style.opacity = "0";

  void hitText.offsetWidth;

  hitText.classList.add("hitTextPop");

  /*
    当たり文字が出た瞬間に曲。
    hit_musicはREAL HITからしか呼ばない。
  */
  playHitMusic();

  await sleep(2250);

  hitText.classList.remove("hitTextPop");
  hitText.style.opacity = "0";

  await showTreasure();
}

   overall miss後だけ
   50% normal
   25% weak
   25% strong
========================================================= */

async function playMiss(){
  const r = Math.random();

  if(r < .50){
    return normalMiss();
  }

  if(r < .75){
    const f =
      weakFakes[
        Math.floor(Math.random()*weakFakes.length)
      ];

    return f();
  }

  const f =
    strongFakes[
      Math.floor(Math.random()*strongFakes.length)
    ];

  return f();
}

/* =========================================================
   TREASURE
   1等 5%
   2等 20%
   3等 75%
========================================================= */

function drawPrize(){
  const r = Math.random();

  if(r < .05) return 1;
  if(r < .25) return 2;

  return 3;
}

function rankText(rank){
  return rank + "等";
}

function rankClass(rank){
  return "rank" + rank;
}

function resetChests(){
  chests.forEach(chest=>{
    chest.classList.remove("open","shake");

    const label =
      chest.querySelector(".rankLabel");

    label.style.display = "none";
    label.textContent = "";
    label.className = "rankLabel";
  });
}

async function showTreasure(){
  clearStarTimers();

  treasure.style.display = "flex";

  treasureTitle.innerHTML =
    "ここからが本番。<br>" +
    "運命の宝箱を選べ！<br>" +
    "この一箱が、結果を決める。";

  prizeResult.textContent = "";
  nextButton.style.display = "none";

  resetChests();

  const selectedRank = drawPrize();

  let chosen = false;

  const chooseHandler = async e=>{
    if(chosen) return;

    const chest =
      e.currentTarget;

    chosen = true;

    chests.forEach(c=>{
      c.removeEventListener(
        "click",
        chooseHandler
      );
    });

    const chosenIndex =
      Number(chest.dataset.index);

    const otherRanks =
      [1,2,3].filter(r=>r!==selectedRank);

    for(let i=otherRanks.length-1;i>0;i--){
      const j =
        Math.floor(Math.random()*(i+1));

      [otherRanks[i],otherRanks[j]] =
        [otherRanks[j],otherRanks[i]];
    }

    const assignments =
      new Array(3);

    assignments[chosenIndex] =
      selectedRank;

    const otherIndexes =
      [0,1,2].filter(
        i=>i!==chosenIndex
      );

    assignments[otherIndexes[0]] =
      otherRanks[0];

    assignments[otherIndexes[1]] =
      otherRanks[1];

    chest.classList.add("shake");

    await sleep(700);

    chest.classList.remove("shake");
    chest.classList.add("open");

    doFlash();

    await sleep(450);

    const label =
      chest.querySelector(".rankLabel");

    label.textContent =
      rankText(selectedRank);

    label.classList.add(
      rankClass(selectedRank)
    );

    label.style.display = "block";

    prizeResult.className =
      rankClass(selectedRank);

    prizeResult.textContent =
      selectedRank + "等 当選！";

    await sleep(2200);

    treasureTitle.innerHTML =
      "残りの宝箱は…<br>" +
      "選ばなかった箱もオープン";

    prizeResult.textContent = "";

    /*
      選ばなかった2箱の開く順番もランダム
    */
    if(Math.random()<.5){
      otherIndexes.reverse();
    }

    for(const idx of otherIndexes){

      const c = chests[idx];

      c.classList.add("shake");

      await sleep(500);

      c.classList.remove("shake");
      c.classList.add("open");

      const l =
        c.querySelector(".rankLabel");

      const rank =
        assignments[idx];

      l.textContent =
        rankText(rank);

      l.classList.add(
        rankClass(rank)
      );

      l.style.display = "block";

      await sleep(750);
    }

    await sleep(500);

    nextButton.style.display = "block";
  };

  chests.forEach(chest=>{
    chest.addEventListener(
      "click",
      chooseHandler
    );
  });
}

function resetGame(){
  playToken++;

  clearStarTimers();

  stopTension();

  hideNumber();

  message.style.display = "none";
  message.style.fontSize = "";

  number.style.fontSize = "";

  number.classList.remove(
    "goldNumber",
    "redNumber",
    "numberPop"
  );

  blackout.style.opacity = "0";

  slashLayer.innerHTML = "";

  hitText.classList.remove("hitTextPop");
  hitText.style.opacity = "0";

  playing = false;

  startScreen.style.display = "flex";
}

/* =========================================================
   START

   ★ 最重要 ★
   ここで1回だけ1/30抽選。
   演出途中で再抽選しない。
========================================================= */

startButton.addEventListener("click",async()=>{

  if(playing) return;

  playing = true;
  playToken++;

  clearStarTimers();

  startScreen.style.display = "none";

  /*
    iPhone Safari対策。
    STARTタップのユーザー操作中に
    AudioContext.resume()を開始。
  */
  await unlockAudio();

  startTension();

  /*
    流れ星は当落を知る前に予約。
    ＝星そのものは当たり確定ではない。
  */
  scheduleStars();

  /*
    ★ 唯一の総合当たり抽選 ★

    毎プレイ完全独立 1/30
  */
  const win =
    Math.random() < (1/30);

  if(win){

    /*
      当たった後に
      32種類から演出だけ選ぶ。

      ここでは当たり判定を
      やり直さない。
    */
    const route =
      hitRoutes[
        Math.floor(
          Math.random()*hitRoutes.length
        )
      ];

    await route();

  }else{

    /*
      1/30に外れた後だけ
      ハズレ演出を選ぶ。
    */
    await playMiss();
  }
});
