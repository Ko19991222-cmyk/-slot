<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COUNTDOWN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

body{
  user-select:none;
}

#stage{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 45%,#171717 0%,#050505 48%,#000 82%);
}

#number{
  font-size:min(60vw,360px);
  font-weight:1000;
  line-height:1;
  text-shadow:
    0 0 15px #fff,
    0 0 40px rgba(255,255,255,.45);
}

#number.show{
  animation:numberIn .45s ease-out;
}

@keyframes numberIn{
  0%{
    opacity:0;
    transform:scale(1.35);
    filter:blur(8px);
  }
  100%{
    opacity:1;
    transform:scale(1);
    filter:blur(0);
  }
}

#start,#next{
  position:absolute;
  bottom:8%;
  padding:17px 46px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.4);
  background:rgba(0,0,0,.75);
  color:#fff;
  font-size:17px;
  font-weight:900;
  letter-spacing:.12em;
}

#test{
  position:absolute;
  top:max(25px,env(safe-area-inset-top));
  font-size:10px;
  letter-spacing:.2em;
  opacity:.28;
}

/* 暗転 */

#black{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  background:#000;
}

/* 切り裂き */

#slash{
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  overflow:hidden;
  pointer-events:none;
}

#slash.go{
  display:block;
}

#line{
  position:absolute;
  left:-30%;
  top:50%;
  width:160%;
  height:9px;
  background:#fff;
  box-shadow:
    0 0 15px #fff,
    0 0 40px #fff,
    0 0 90px #fff;
  transform:rotate(-18deg) scaleX(0);
}

#slash.go #line{
  animation:slashAnim .2s ease-out forwards;
}

@keyframes slashAnim{
  to{
    transform:rotate(-18deg) scaleX(1);
  }
}

/* フラッシュ */

#flash{
  position:fixed;
  inset:0;
  z-index:80;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

#flash.go{
  animation:flashAnim .45s ease-out;
}

@keyframes flashAnim{
  0%{opacity:0}
  10%{opacity:1}
  28%{opacity:.25}
  40%{opacity:1}
  100%{opacity:0}
}

/* 当たり画面 */

#hit{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  overflow:hidden;

  background:
    radial-gradient(
      circle,
      #8b1a00 0%,
      #390000 35%,
      #090000 68%,
      #000 100%
    );
}

#hit.show{
  display:flex;
}

#glow{
  position:absolute;
  width:150vw;
  height:150vw;
  border-radius:50%;
  background:
    conic-gradient(
      transparent,
      rgba(255,180,0,.35),
      transparent,
      rgba(255,0,0,.42),
      transparent
    );
  animation:spin 3s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

#hitText{
  position:relative;
  z-index:5;
  font-size:min(24vw,150px);
  font-weight:1000;
  text-align:center;
  text-shadow:
    0 0 12px #fff,
    0 0 30px #ffe100,
    0 0 70px #ff4500,
    0 0 110px red;
  animation:hitIn .55s cubic-bezier(.05,1.4,.2,1);
}

@keyframes hitIn{
  0%{
    opacity:0;
    transform:scale(.25);
    filter:blur(10px);
  }
  70%{
    opacity:1;
    transform:scale(1.18);
    filter:blur(0);
  }
  100%{
    transform:scale(1);
  }
}

#subText{
  position:absolute;
  bottom:25%;
  z-index:5;
  font-size:15px;
  font-weight:900;
  letter-spacing:.16em;
  text-align:center;
}

#next{
  display:none;
}

#hit.show #next{
  display:block;
}

/* 等級抽選中 */

#lotteryBox{
  position:fixed;
  inset:0;
  z-index:130;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:
    radial-gradient(circle,#151515 0%,#050505 55%,#000 100%);
}

#lotteryBox.show{
  display:flex;
}

#lotteryTitle{
  font-size:clamp(22px,7vw,48px);
  font-weight:1000;
  letter-spacing:.12em;
  margin-bottom:28px;
}

#lotteryRoll{
  font-size:clamp(60px,22vw,140px);
  font-weight:1000;
  text-shadow:
    0 0 20px #fff,
    0 0 50px rgba(255,255,255,.5);
}

/* 等級結果 */

#prizeBox{
  position:fixed;
  inset:0;
  z-index:160;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  overflow:hidden;
}

#prizeBox.show{
  display:flex;
}

#prizeBox.first{
  background:
    radial-gradient(circle,#fff7a0 0%,#d99b00 25%,#5c2500 60%,#000 100%);
}

#prizeBox.second{
  background:
    radial-gradient(circle,#ffffff 0%,#9ca7b6 28%,#272d35 62%,#000 100%);
}

#prizeBox.third{
  background:
    radial-gradient(circle,#ffd2a8 0%,#b75a22 30%,#4c1e08 62%,#000 100%);
}

#prizeLabel{
  font-size:clamp(72px,28vw,180px);
  font-weight:1000;
  line-height:1;
  text-align:center;
  text-shadow:
    0 0 12px #fff,
    0 0 40px rgba(255,255,255,.7),
    0 0 90px rgba(255,180,0,.7);
  animation:prizeIn .7s cubic-bezier(.05,1.5,.2,1);
}

#prizeWon{
  margin-top:20px;
  font-size:clamp(20px,6vw,38px);
  font-weight:1000;
  letter-spacing:.15em;
}

@keyframes prizeIn{
  0%{
    transform:scale(.15) rotate(-8deg);
    opacity:0;
    filter:blur(14px);
  }
  70%{
    transform:scale(1.18) rotate(2deg);
    opacity:1;
    filter:blur(0);
  }
  100%{
    transform:scale(1) rotate(0);
  }
}
</style>
</head>

<body>

<div id="stage">
  <div id="test">TEST MODE / 100% HIT</div>
  <div id="number">3</div>
  <button id="start">START</button>
</div>

<div id="black"></div>

<div id="slash">
  <div id="line"></div>
</div>

<div id="flash"></div>

<div id="hit">
  <div id="glow"></div>
  <div id="hitText">当たり</div>
  <div id="subText">CONGRATULATIONS</div>
  <button id="next">NEXT</button>
</div>

<div id="lotteryBox">
  <div id="lotteryTitle">等級抽選中...</div>
  <div id="lotteryRoll">?</div>
</div>

<div id="prizeBox">
  <div id="prizeLabel">3等</div>
  <div id="prizeWon">当選！</div>
</div>

<audio
  id="hitMusic"
  src="./hit_music_final.mp3?v=20260912-300"
  preload="auto"
  playsinline>
</audio>

<script>

const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r,ms));

let busy = false;
let audioCtx = null;

let tensionOsc1 = null;
let tensionOsc2 = null;
let tensionGain = null;
let pulseTimer = null;

const hitMusic = $("#hitMusic");


/* =========================
   Web Audio
========================= */

function initAudio(){

  if(!audioCtx){

    audioCtx = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  }

  if(audioCtx.state === "suspended"){
    audioCtx.resume();
  }
}


/* =========================
   iPhone用 音楽解禁
========================= */

async function unlockHitMusic(){

  try{

    hitMusic.pause();
    hitMusic.currentTime = 0;
    hitMusic.muted = false;
    hitMusic.volume = 0.001;

    await hitMusic.play();

    await sleep(60);

    hitMusic.pause();
    hitMusic.currentTime = 0;
    hitMusic.volume = 1;

  }catch(e){

    console.log("unlock error:",e);
    hitMusic.volume = 1;

  }
}


/* =========================
   緊張BGM
========================= */

function startTension(){

  initAudio();

  stopTension();

  const now = audioCtx.currentTime;

  tensionGain = audioCtx.createGain();

  tensionGain.gain.setValueAtTime(
    .0001,
    now
  );

  tensionGain.gain.exponentialRampToValueAtTime(
    .08,
    now + .8
  );


  tensionOsc1 = audioCtx.createOscillator();
  tensionOsc2 = audioCtx.createOscillator();

  tensionOsc1.type = "sine";
  tensionOsc2.type = "triangle";

  tensionOsc1.frequency.value = 52;
  tensionOsc2.frequency.value = 78;

  tensionOsc1.connect(tensionGain);
  tensionOsc2.connect(tensionGain);
  tensionGain.connect(audioCtx.destination);

  tensionOsc1.start();
  tensionOsc2.start();


  pulseTimer = setInterval(() => {

    if(!tensionGain) return;

    const t = audioCtx.currentTime;

    tensionGain.gain.cancelScheduledValues(t);

    tensionGain.gain.setValueAtTime(
      .04,
      t
    );

    tensionGain.gain.exponentialRampToValueAtTime(
      .12,
      t + .08
    );

    tensionGain.gain.exponentialRampToValueAtTime(
      .04,
      t + .48
    );

  },650);
}


function stopTension(){

  if(pulseTimer){
    clearInterval(pulseTimer);
    pulseTimer = null;
  }

  try{
    tensionOsc1?.stop();
  }catch(e){}

  try{
    tensionOsc2?.stop();
  }catch(e){}

  tensionOsc1 = null;
  tensionOsc2 = null;
  tensionGain = null;
}


/* =========================
   カウント音
========================= */

function countSound(number){

  initAudio();

  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sine";

  const frequencies = {
    3:115,
    2:98,
    1:80
  };

  osc.frequency.setValueAtTime(
    frequencies[number],
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    45,
    now + .45
  );

  gain.gain.setValueAtTime(
    .0001,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .55,
    now + .015
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now + .55
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + .6);
}


/* =========================
   切り裂きSE
========================= */

function slashSound(){

  initAudio();

  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "sawtooth";

  osc.frequency.setValueAtTime(
    1600,
    now
  );

  osc.frequency.exponentialRampToValueAtTime(
    170,
    now + .15
  );

  gain.gain.setValueAtTime(
    .32,
    now
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now + .18
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now + .2);


  const bass = audioCtx.createOscillator();
  const bassGain = audioCtx.createGain();

  bass.type = "sine";

  bass.frequency.setValueAtTime(
    95,
    now
  );

  bass.frequency.exponentialRampToValueAtTime(
    32,
    now + .5
  );

  bassGain.gain.setValueAtTime(
    .75,
    now
  );

  bassGain.gain.exponentialRampToValueAtTime(
    .0001,
    now + .5
  );

  bass.connect(bassGain);
  bassGain.connect(audioCtx.destination);

  bass.start(now);
  bass.stop(now + .55);
}


/* =========================
   等級抽選音
========================= */

function lotteryTick(){

  initAudio();

  const now = audioCtx.currentTime;

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "square";
  osc.frequency.value = 520;

  gain.gain.setValueAtTime(.13,now);
  gain.gain.exponentialRampToValueAtTime(.0001,now+.08);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start(now);
  osc.stop(now+.09);
}


/* =========================
   当たり曲
========================= */

async function playHitMusic(){

  try{

    hitMusic.pause();
    hitMusic.currentTime = 0;
    hitMusic.muted = false;
    hitMusic.volume = 1;

    await hitMusic.play();

  }catch(e){

    console.log("HIT MUSIC ERROR:",e);

  }
}


/* =========================
   等級抽選
   1等 10%
   2等 30%
   3等 60%
========================= */

function drawPrize(){

  const r = Math.random();

  if(r < .10){
    return {
      label:"1等",
      className:"first"
    };
  }

  if(r < .40){
    return {
      label:"2等",
      className:"second"
    };
  }

  return {
    label:"3等",
    className:"third"
  };
}


/* =========================
   数字表示
========================= */

function showNumber(n){

  const el = $("#number");

  el.className = "";
  el.textContent = n;

  void el.offsetWidth;

  el.className = "show";

  countSound(n);
}


/* =========================
   フラッシュ
========================= */

function flash(){

  const el = $("#flash");

  el.className = "";

  void el.offsetWidth;

  el.className = "go";
}


/* =========================
   等級抽選演出
========================= */

async function runPrizeLottery(){

  /*
    当たりを少し見せてから
    2段目の抽選へ
  */

  await sleep(1800);

  $("#hit").className = "";

  $("#lotteryBox").className = "show";


  const roll = $("#lotteryRoll");

  const fakeResults = [
    "1等",
    "3等",
    "2等",
    "3等",
    "1等",
    "2等",
    "3等"
  ];


  /*
    最初は速く
    後半はゆっくり
  */

  const delays = [
    90,90,100,110,130,
    150,180,210,250,
    300,360,450
  ];


  for(let i = 0; i < delays.length; i++){

    roll.textContent =
      fakeResults[
        Math.floor(
          Math.random() * fakeResults.length
        )
      ];

    lotteryTick();

    await sleep(delays[i]);
  }


  /*
    ★ここで本当の等級決定
  */

  const prize = drawPrize();


  await sleep(450);


  $("#lotteryBox").className = "";


  const prizeBox = $("#prizeBox");

  prizeBox.className =
    "show " + prize.className;


  $("#prizeLabel").textContent =
    prize.label;


  /*
    最終結果で強フラッシュ
  */

  flash();


  /*
    結果を見せたあとNEXTを表示
  */

  await sleep(1200);

  $("#next").style.display = "block";

  /*
    NEXTを等級画面の上に移動
  */

  prizeBox.appendChild($("#next"));
}


/* =========================
   当たり
========================= */

async function showHit(){

  $("#hit").className = "show";

  await playHitMusic();

  /*
    当たり後の等級抽選へ
  */

  runPrizeLottery();
}


/* =========================
   切り裂き
========================= */

async function slashHit(){

  stopTension();

  await sleep(180);

  slashSound();

  $("#slash").className = "go";

  await sleep(170);

  flash();

  await sleep(300);

  $("#slash").className = "";

  await showHit();
}


/* =========================
   暗転
========================= */

async function blackoutHit(){

  stopTension();

  $("#black").style.display = "block";

  await sleep(1300);

  $("#black").style.display = "none";

  await slashHit();
}


/* =========================
   復活
========================= */

async function revivalHit(){

  $("#number").textContent = "";

  await sleep(1200);

  stopTension();

  $("#black").style.display = "block";

  await sleep(900);

  $("#black").style.display = "none";

  await slashHit();
}


/* =========================
   START
========================= */

async function play(){

  if(busy) return;

  busy = true;


  /*
    iPhone音声解禁
  */

  initAudio();

  await unlockHitMusic();


  $("#start").style.display = "none";


  startTension();


  /*
    今は100%当たりテスト

    0 = 3途中
    1 = 2途中
    2 = 1途中
    3 = 1後
    4 = 暗転
    5 = 復活
  */

  const pattern =
    Math.floor(Math.random() * 6);


  /* 3 */

  showNumber(3);

  if(pattern === 0){

    await sleep(1450);

    await slashHit();

    return;
  }

  await sleep(2100);


  /* 2 */

  showNumber(2);

  if(pattern === 1){

    await sleep(1550);

    await slashHit();

    return;
  }

  await sleep(2250);


  /* 1 */

  showNumber(1);

  if(pattern === 2){

    await sleep(1750);

    await slashHit();

    return;
  }

  await sleep(2450);


  $("#number").textContent = "";


  if(pattern === 3){

    await sleep(700);

    await slashHit();

  }

  else if(pattern === 4){

    await blackoutHit();

  }

  else{

    await revivalHit();

  }

}


/* =========================
   NEXT
========================= */

function reset(){

  stopTension();

  hitMusic.pause();

  try{
    hitMusic.currentTime = 0;
  }catch(e){}


  $("#hit").className = "";
  $("#lotteryBox").className = "";
  $("#prizeBox").className = "";

  $("#slash").className = "";
  $("#black").style.display = "none";


  $("#number").textContent = "3";
  $("#number").className = "";


  $("#start").style.display = "block";


  /*
    NEXTを当たり画面へ戻す
  */

  $("#hit").appendChild($("#next"));

  $("#next").style.display = "none";


  busy = false;
}


$("#start").addEventListener(
  "click",
  play
);

$("#next").addEventListener(
  "click",
  reset
);

</script>

</body>
</html>
