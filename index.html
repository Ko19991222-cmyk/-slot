<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FREEZE CHANCE</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#000;color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

#main,#freeze{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}

#main{
  background:radial-gradient(circle,#171717 0%,#050505 60%,#000 100%);
}

#number{
  font-size:clamp(150px,50vw,250px);
  font-weight:900;
  line-height:1;
}

#start{
  margin-top:60px;
  width:min(78vw,340px);
  padding:20px;
  border:1px solid #555;
  border-radius:100px;
  background:linear-gradient(#242424,#090909);
  color:#fff;
  font-size:20px;
  font-weight:900;
  letter-spacing:5px;
}

#start:active{transform:scale(.97)}
#start:disabled{opacity:.25}

#freeze{
  display:none;
  z-index:20;
  background:#000;
}

#freeze.show{display:flex}

#noise{
  position:absolute;inset:0;
  opacity:0;
  pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 3px,
    rgba(255,255,255,.14) 4px
  );
}

#freeze.show #noise{
  animation:noise .08s 15 alternate;
}

@keyframes noise{
  from{opacity:.05;transform:translateX(-5px)}
  to{opacity:.65;transform:translateX(5px)}
}

#freezeText{
  opacity:0;
  font-size:clamp(55px,18vw,110px);
  font-weight:1000;
  letter-spacing:2px;
  text-shadow:0 0 10px #fff,0 0 40px #fff;
}

#freezeText.go{
  animation:freezeText 1.1s forwards;
}

@keyframes freezeText{
  0%{
    opacity:0;
    transform:scale(.15);
    filter:blur(15px);
  }
  35%{
    opacity:1;
    transform:scale(1.4);
    filter:blur(0);
  }
  50%{transform:scale(.9)}
  65%{transform:scale(1.1)}
  100%{
    opacity:1;
    transform:scale(1);
    text-shadow:0 0 15px #fff,0 0 60px #fff;
  }
}

.flash{
  animation:flash .08s 8 alternate;
}

@keyframes flash{
  from{background:#000}
  to{background:#fff}
}

.shake{
  animation:shake .055s 14;
}

@keyframes shake{
  0%{transform:translate(0)}
  25%{transform:translate(-12px,4px)}
  50%{transform:translate(10px,-5px)}
  75%{transform:translate(-7px,-3px)}
  100%{transform:translate(0)}
}

#congrats{
  display:none;
  position:absolute;
  inset:0;
  z-index:40;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  background:
    radial-gradient(circle,#541000 0%,#160000 48%,#000 100%);
}

#congrats.show{
  display:flex;
  animation:congratsIn .7s ease-out;
}

@keyframes congratsIn{
  from{opacity:0;transform:scale(.6)}
  to{opacity:1;transform:scale(1)}
}

#congrats .big{
  font-size:clamp(38px,11vw,70px);
  font-weight:1000;
  letter-spacing:2px;
  text-shadow:
    0 0 10px #fff,
    0 0 25px #ffb000,
    0 0 60px #ff3b00;
}

#congrats .jp{
  margin-top:22px;
  font-size:clamp(25px,8vw,42px);
  font-weight:900;
}

#next{
  margin-top:55px;
  padding:15px 40px;
  border:1px solid #ffffff55;
  border-radius:100px;
  background:#111;
  color:#fff;
  font-size:15px;
}
</style>
</head>

<body>

<div id="main">
  <div id="number">3</div>
  <button id="start">START</button>
</div>

<div id="freeze">
  <div id="noise"></div>
  <div id="freezeText">FREEZE</div>
</div>

<div id="congrats">
  <div class="big">CONGRATULATIONS</div>
  <div class="jp">おめでとうございます！</div>
  <button id="next">NEXT</button>
</div>

<script>
const number = document.getElementById("number");
const start = document.getElementById("start");
const main = document.getElementById("main");
const freeze = document.getElementById("freeze");
const freezeText = document.getElementById("freezeText");
const congrats = document.getElementById("congrats");
const next = document.getElementById("next");

let ctx;

function getAudio(){
  if(!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(ctx.state==="suspended") ctx.resume();
  return ctx;
}

function tone(freq,duration,volume=.2,type="sine"){
  const c=getAudio();
  const o=c.createOscillator();
  const g=c.createGain();

  o.type=type;
  o.frequency.value=freq;

  g.gain.setValueAtTime(volume,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);

  o.connect(g);
  g.connect(c.destination);

  o.start();
  o.stop(c.currentTime+duration);
}

function speak(text,rate=.85,pitch=.8){
  return new Promise(resolve=>{
    speechSynthesis.cancel();

    const u=new SpeechSynthesisUtterance(text);
    u.lang="ja-JP";
    u.rate=rate;
    u.pitch=pitch;
    u.volume=1;

    u.onend=resolve;
    u.onerror=resolve;

    speechSynthesis.speak(u);
  });
}

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

async function countdown(){
  for(const n of [3,2,1]){
    number.textContent=n;

    /* 数字は動かさず声だけ */
    speak(String(n),.75,.75);

    await sleep(1000);
  }
}

function deepFreezeSound(){
  const c=getAudio();
  const now=c.currentTime;

  /* ゴゴゴ…系の低音 */
  const sub=c.createOscillator();
  const gain=c.createGain();

  sub.type="sawtooth";
  sub.frequency.setValueAtTime(75,now);
  sub.frequency.exponentialRampToValueAtTime(28,now+2);

  gain.gain.setValueAtTime(.001,now);
  gain.gain.exponentialRampToValueAtTime(.45,now+.08);
  gain.gain.exponentialRampToValueAtTime(.001,now+2);

  sub.connect(gain);
  gain.connect(c.destination);

  sub.start(now);
  sub.stop(now+2.1);

  /* ドンッ */
  setTimeout(()=>tone(55,.8,.9,"sine"),500);
  setTimeout(()=>tone(38,1,.8,"sine"),900);

  /* FREEZE確定音 */
  setTimeout(()=>tone(850,.18,.25,"square"),1300);
  setTimeout(()=>tone(1250,.22,.22,"square"),1500);
}

async function freezeEffect(){
  /* 一瞬の完全停止 */
  number.textContent="";
  await sleep(650);

  /* ブラックアウト */
  main.style.display="none";
  freeze.classList.add("show");

  await sleep(450);

  deepFreezeSound();

  freeze.classList.add("shake");

  await sleep(650);

  freeze.classList.add("flash");

  await sleep(350);

  freezeText.classList.add("go");

  await sleep(2300);

  congrats.classList.add("show");

  tone(523,.25,.18);
  setTimeout(()=>tone(659,.25,.18),200);
  setTimeout(()=>tone(784,.5,.2),400);

  await sleep(600);

  speak("おめでとうございます",.82,1);
}

async function play(){
  start.disabled=true;
  getAudio();

  await countdown();

  /*
    ★★★ 確認モード ★★★
    今は必ず当たります
  */
  const win = true;

  if(win){
    await freezeEffect();
  }else{
    number.textContent="3";
    start.disabled=false;
  }
}

start.addEventListener("click",play);

next.addEventListener("click",()=>{
  speechSynthesis.cancel();

  congrats.classList.remove("show");
  freeze.classList.remove("show","shake","flash");
  freezeText.classList.remove("go");

  main.style.display="flex";
  number.textContent="3";
  start.disabled=false;
});
</script>

</body>
</html>
