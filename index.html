<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COUNTDOWN IMPACT TEST</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

body{
  user-select:none;
}

/* ===== MAIN ===== */

#stage{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 48%, #1c1c1c 0%, #090909 42%, #000 78%);
}

#ambientGlow{
  position:absolute;
  inset:-20%;
  background:
    radial-gradient(circle at center,
      rgba(110,0,0,.22) 0%,
      rgba(30,0,0,.12) 28%,
      transparent 60%);
  opacity:.2;
  transform:scale(1);
  transition:1s;
}

#vignette{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle,
      transparent 30%,
      rgba(0,0,0,.2) 56%,
      rgba(0,0,0,.9) 100%);
}

#number{
  position:relative;
  z-index:2;
  font-size:min(47vw,290px);
  font-weight:1000;
  line-height:.85;
  letter-spacing:-.06em;
  text-shadow:
    0 0 18px rgba(255,255,255,.22),
    0 0 55px rgba(255,0,0,.05);
  transform:scale(1);
  transition:
    transform .25s ease,
    opacity .25s ease,
    text-shadow .4s ease;
}

#number.active{
  transform:scale(1.035);
}

#number.tense{
  text-shadow:
    0 0 20px rgba(255,255,255,.28),
    0 0 65px rgba(180,0,0,.28);
}

#label{
  position:absolute;
  bottom:16%;
  font-size:11px;
  letter-spacing:.32em;
  opacity:.35;
  z-index:4;
}

button{
  border:1px solid rgba(255,255,255,.35);
  background:rgba(15,15,15,.9);
  color:#fff;
  border-radius:999px;
  padding:16px 42px;
  font-size:16px;
  font-weight:900;
  letter-spacing:.14em;
}

#start{
  position:absolute;
  bottom:7%;
  z-index:10;
}

/* ===== FX ===== */

#fx{
  position:fixed;
  inset:0;
  z-index:20;
  overflow:hidden;
  display:none;
  background:#000;
}

#fx.show{
  display:block;
}

#fxGlow{
  position:absolute;
  inset:-20%;
  opacity:0;
  background:
    radial-gradient(circle at 50% 50%,
      #fff 0%,
      #ffdf8a 6%,
      #ff4a00 16%,
      #8d0000 32%,
      #120000 58%,
      #000 78%);
}

#fxGlow.burst{
  animation:burstGlow 1.2s ease-out forwards;
}

@keyframes burstGlow{
  0%{opacity:0;transform:scale(.7)}
  10%{opacity:1;transform:scale(.9)}
  35%{opacity:.85;transform:scale(1.08)}
  100%{opacity:.36;transform:scale(1.25)}
}

/* slicing flash */
#cutFlash{
  position:absolute;
  left:-30%;
  top:49%;
  width:160%;
  height:16px;
  z-index:9;
  opacity:0;
  transform:rotate(-15deg) scaleX(.05);
  transform-origin:left center;
  background:#fff;
  box-shadow:
    0 0 15px #fff,
    0 0 38px #fff,
    0 0 70px #ff7600,
    0 0 110px #ff0000;
}

#cutFlash.go{
  animation:cut .19s cubic-bezier(.1,.8,.1,1) forwards;
}

@keyframes cut{
  0%{
    opacity:0;
    transform:rotate(-15deg) scaleX(.02);
  }
  15%{opacity:1}
  100%{
    opacity:1;
    transform:rotate(-15deg) scaleX(1);
  }
}

/* torn panels */
#upper,#lower{
  position:absolute;
  inset:-12%;
  z-index:6;
  background:
    radial-gradient(circle at 50% 50%,#141414 0%,#050505 55%,#000 100%);
  transition:transform .58s cubic-bezier(.15,.82,.12,1);
}

#upper{
  clip-path:polygon(0 0,100% 0,100% 41%,0 66%);
}

#lower{
  clip-path:polygon(0 66%,100% 41%,100% 100%,0 100%);
}

#fx.torn #upper{
  transform:translate(-10%,-15%) rotate(-1.5deg);
}

#fx.torn #lower{
  transform:translate(10%,15%) rotate(1.5deg);
}

#hitText{
  position:absolute;
  inset:0;
  z-index:5;
  display:grid;
  place-items:center;
  text-align:center;
  opacity:0;
  transform:scale(.48);
  font-size:min(24vw,170px);
  font-weight:1000;
  letter-spacing:.04em;
  text-shadow:
    0 0 15px #fff,
    0 0 40px rgba(255,160,0,.85),
    0 0 80px rgba(255,0,0,.8);
}

#hitText.show{
  animation:hitIn .62s cubic-bezier(.08,1.35,.15,1) forwards;
}

@keyframes hitIn{
  0%{opacity:0;transform:scale(.45)}
  50%{opacity:1;transform:scale(1.12)}
  100%{opacity:1;transform:scale(1)}
}

#whiteFlash{
  position:fixed;
  inset:0;
  z-index:50;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

#whiteFlash.flash{
  animation:whiteFlash .26s ease-out;
}

@keyframes whiteFlash{
  0%{opacity:0}
  12%{opacity:1}
  100%{opacity:0}
}

#blackout{
  position:fixed;
  inset:0;
  z-index:40;
  background:#000;
  display:none;
}

/* ===== WIN ===== */

#win{
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  place-items:center;
  text-align:center;
  background:
    radial-gradient(circle at center,#2b0b00 0%,#080000 38%,#000 78%);
}

#winInner{
  transform:scale(.7);
  opacity:0;
}

#win.show #winInner{
  animation:winPop .7s cubic-bezier(.1,1.2,.2,1) forwards;
}

@keyframes winPop{
  to{
    transform:scale(1);
    opacity:1;
  }
}

#winTitle{
  font-size:min(13vw,90px);
  font-weight:1000;
  letter-spacing:.02em;
  text-shadow:
    0 0 20px rgba(255,255,255,.45),
    0 0 50px rgba(255,140,0,.5);
}

#winSub{
  margin-top:18px;
  font-size:min(7vw,38px);
  font-weight:900;
}

#next{
  position:absolute;
  bottom:7%;
}

/* shake */
.shakeHeavy{
  animation:shakeHeavy .32s linear;
}

@keyframes shakeHeavy{
  0%{transform:translate(0,0)}
  15%{transform:translate(-8px,4px)}
  30%{transform:translate(9px,-4px)}
  45%{transform:translate(-7px,-2px)}
  60%{transform:translate(7px,4px)}
  75%{transform:translate(-4px,-3px)}
  100%{transform:translate(0,0)}
}
</style>
</head>

<body>

<div id="stage">
  <div id="ambientGlow"></div>
  <div id="number">3</div>
  <div id="label">TEST MODE / 100% HIT</div>
  <button id="start">START</button>
  <div id="vignette"></div>
</div>

<div id="fx">
  <div id="fxGlow"></div>
  <div id="hitText">当たり</div>
  <div id="upper"></div>
  <div id="lower"></div>
  <div id="cutFlash"></div>
</div>

<div id="blackout"></div>
<div id="whiteFlash"></div>

<div id="win">
  <div id="winInner">
    <div id="winTitle">CONGRATULATIONS</div>
    <div id="winSub">おめでとうございます</div>
  </div>
  <button id="next">NEXT</button>
</div>


<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r,ms));

let ctx;
let busy = false;

let ambienceNodes = [];
let tensionLevel = 0;


/* =========================
   AUDIO
========================= */

function initAudio(){
  if(!ctx){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
  }

  if(ctx.state === "suspended"){
    ctx.resume();
  }
}

function osc(freq, duration, volume, type="sine", startDelay=0){
  const o = ctx.createOscillator();
  const g = ctx.createGain();

  const start = ctx.currentTime + startDelay;

  o.type = type;
  o.frequency.setValueAtTime(freq,start);

  g.gain.setValueAtTime(Math.max(volume,.0001),start);
  g.gain.exponentialRampToValueAtTime(.0001,start+duration);

  o.connect(g);
  g.connect(ctx.destination);

  o.start(start);
  o.stop(start+duration+.05);

  return {o,g};
}

function noiseBurst(duration=.18, volume=.12){
  const length = Math.floor(ctx.sampleRate * duration);
  const buffer = ctx.createBuffer(1,length,ctx.sampleRate);
  const data = buffer.getChannelData(0);

  for(let i=0;i<length;i++){
    data[i]=(Math.random()*2-1);
  }

  const src=ctx.createBufferSource();
  const filter=ctx.createBiquadFilter();
  const gain=ctx.createGain();

  src.buffer=buffer;

  filter.type="bandpass";
  filter.frequency.value=1400;
  filter.Q.value=.7;

  gain.gain.setValueAtTime(volume,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+duration);

  src.connect(filter);
  filter.connect(gain);
  gain.connect(ctx.destination);

  src.start();
}

function startAmbience(){

  stopAmbience();

  const master = ctx.createGain();
  master.gain.value=.035;

  const low = ctx.createOscillator();
  low.type="sine";
  low.frequency.value=42;

  const lowGain = ctx.createGain();
  lowGain.gain.value=.45;

  const mid = ctx.createOscillator();
  mid.type="triangle";
  mid.frequency.value=84;

  const midGain = ctx.createGain();
  midGain.gain.value=.06;

  const filter = ctx.createBiquadFilter();
  filter.type="lowpass";
  filter.frequency.value=160;

  low.connect(lowGain);
  mid.connect(midGain);

  lowGain.connect(filter);
  midGain.connect(filter);

  filter.connect(master);
  master.connect(ctx.destination);

  low.start();
  mid.start();

  ambienceNodes=[low,mid,master,filter,lowGain,midGain];
}

function raiseTension(level){

  tensionLevel=level;

  const master=ambienceNodes[2];
  const filter=ambienceNodes[3];
  const lowGain=ambienceNodes[4];

  if(!master)return;

  const now=ctx.currentTime;

  master.gain.cancelScheduledValues(now);
  master.gain.linearRampToValueAtTime(
    level===1 ? .045 :
    level===2 ? .062 :
    .082,
    now+.4
  );

  filter.frequency.linearRampToValueAtTime(
    level===1 ? 160 :
    level===2 ? 210 :
    290,
    now+.4
  );

  lowGain.gain.linearRampToValueAtTime(
    level===1 ? .45 :
    level===2 ? .58 :
    .72,
    now+.4
  );
}

function stopAmbience(){
  ambienceNodes.forEach(n=>{
    try{
      if(n.stop)n.stop();
    }catch(e){}
  });

  ambienceNodes=[];
}

function heartbeat(level=1){

  const base =
    level===1 ? 48 :
    level===2 ? 52 :
    56;

  osc(base,.22,.18,"sine");
  osc(base*2,.12,.045,"triangle");

  setTimeout(()=>{
    osc(base-5,.18,.11,"sine");
  },180);
}

function countImpact(n){

  let f =
    n===3 ? 65 :
    n===2 ? 72 :
    82;

  osc(f,.35,.24,"sine");
  osc(f*2,.20,.055,"triangle");

  noiseBurst(.04,.022);
}

function slashSound(){

  noiseBurst(.12,.23);

  osc(1100,.09,.11,"sawtooth");
  osc(720,.14,.08,"sawtooth",.03);

  setTimeout(()=>{
    osc(62,.55,.38,"sine");
    osc(124,.3,.08,"triangle");
  },65);
}

function impactBoom(){

  osc(48,.75,.48,"sine");
  osc(96,.38,.10,"triangle");

  setTimeout(()=>{
    osc(36,1,.33,"sine");
  },55);
}

function confirmSound(){

  const now = ctx.currentTime;

  const o = ctx.createOscillator();
  const g = ctx.createGain();

  o.type="sine";

  o.frequency.setValueAtTime(520,now);
  o.frequency.exponentialRampToValueAtTime(1800,now+.42);
  o.frequency.exponentialRampToValueAtTime(2350,now+.7);

  g.gain.setValueAtTime(.001,now);
  g.gain.linearRampToValueAtTime(.18,now+.05);
  g.gain.exponentialRampToValueAtTime(.001,now+.8);

  o.connect(g);
  g.connect(ctx.destination);

  o.start();
  o.stop(now+.82);

  setTimeout(()=>{
    osc(1040,.32,.08,"triangle");
  },150);
}

function victoryJingle(){

  osc(392,.38,.12);
  setTimeout(()=>osc(523,.38,.13),170);
  setTimeout(()=>osc(659,.4,.14),340);
  setTimeout(()=>osc(784,.75,.13),520);
}


/* =========================
   VISUAL FX
========================= */

function flash(){

  const f=$("#whiteFlash");

  f.classList.remove("flash");
  void f.offsetWidth;
  f.classList.add("flash");
}

function shake(){

  document.body.classList.remove("shakeHeavy");
  void document.body.offsetWidth;
  document.body.classList.add("shakeHeavy");

  setTimeout(()=>{
    document.body.classList.remove("shakeHeavy");
  },380);
}

function resetFX(){

  $("#fx").className="";
  $("#cutFlash").className="";
  $("#fxGlow").className="";
  $("#hitText").className="";
  $("#blackout").style.display="none";
}

async function cutHit(){

  stopAmbience();

  /* tiny silence before impact */
  await sleep(280);

  const fx=$("#fx");

  fx.className="show";

  await sleep(130);

  $("#cutFlash").className="go";

  slashSound();

  await sleep(120);

  flash();

  fx.classList.add("torn");
  $("#fxGlow").className="burst";

  impactBoom();
  shake();

  await sleep(300);

  $("#hitText").className="show";

  await sleep(170);

  confirmSound();

  await sleep(1450);
}

async function blackoutHit(){

  stopAmbience();

  $("#blackout").style.display="block";

  /* intentionally uncomfortable silence */
  await sleep(1250);

  osc(33,.8,.2,"sine");

  await sleep(500);

  $("#blackout").style.display="none";

  await cutHit();
}

async function silentHit(){

  stopAmbience();

  $("#number").textContent="";

  await sleep(1900);

  await cutHit();
}

async function fakeRevival(){

  stopAmbience();

  $("#number").textContent="";
  $("#start").style.display="block";

  /* looks fully over */
  await sleep(1700);

  $("#start").style.display="none";

  $("#blackout").style.display="block";

  await sleep(500);

  heartbeat(3);

  await sleep(620);

  $("#blackout").style.display="none";

  await cutHit();
}


/* =========================
   COUNTDOWN
========================= */

async function showNumber(n,level){

  const number=$("#number");
  const glow=$("#ambientGlow");

  number.textContent=n;
  number.className="active";

  if(level>=2){
    number.classList.add("tense");
  }

  glow.style.opacity =
    level===1 ? ".24" :
    level===2 ? ".40" :
    ".58";

  glow.style.transform =
    `scale(${1 + level*.06})`;

  raiseTension(level);

  countImpact(n);
  heartbeat(level);

  /*
    slower countdown:
    3 = ~1.6 sec
    2 = ~1.75 sec
    1 = ~2.0 sec
  */

  const hold =
    n===3 ? 1200 :
    n===2 ? 1320 :
    1500;

  await sleep(hold);

  number.classList.remove("active");

  await sleep(380);
}


/* =========================
   MAIN PLAY
========================= */

async function play(){

  if(busy)return;

  busy=true;

  initAudio();
  resetFX();

  $("#start").style.display="none";
  $("#win").style.display="none";

  startAmbience();

  /*
    TEST MODE:
    100% HIT

    event:
    0 = cut during 3
    1 = cut during 2
    2 = cut during 1
    3 = after 1 blackout
    4 = after 1 long silence
    5 = fake miss revival
  */

  const event=Math.floor(Math.random()*6);

  /* 3 */
  $("#number").textContent="3";

  if(event===0){

    raiseTension(1);
    countImpact(3);
    heartbeat(1);

    await sleep(900);

    await cutHit();
    return finishWin();
  }

  await showNumber(3,1);


  /* 2 */

  if(event===1){

    $("#number").textContent="2";

    raiseTension(2);
    countImpact(2);
    heartbeat(2);

    await sleep(1050);

    await cutHit();
    return finishWin();
  }

  await showNumber(2,2);


  /* 1 */

  if(event===2){

    $("#number").textContent="1";

    raiseTension(3);
    countImpact(1);
    heartbeat(3);

    await sleep(1250);

    await cutHit();
    return finishWin();
  }

  await showNumber(1,3);


  $("#number").textContent="";

  /* after countdown variations */

  if(event===3){

    await blackoutHit();

  }else if(event===4){

    await silentHit();

  }else{

    await fakeRevival();
  }

  finishWin();
}


/* =========================
   WIN
========================= */

async function finishWin(){

  await sleep(650);

  resetFX();

  $("#win").style.display="grid";

  requestAnimationFrame(()=>{
    $("#win").classList.add("show");
  });

  victoryJingle();
}


/* =========================
   RESET
========================= */

function reset(){

  stopAmbience();

  $("#win").style.display="none";
  $("#win").className="";

  resetFX();

  $("#number").textContent="3";
  $("#number").className="";

  $("#ambientGlow").style.opacity=".2";
  $("#ambientGlow").style.transform="scale(1)";

  $("#start").style.display="block";

  busy=false;
}

$("#start").onclick=play;
$("#next").onclick=reset;

</script>
</body>
</html>
