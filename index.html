<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>COUNTDOWN TEST</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}

button{font:inherit}

#stage{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  background:radial-gradient(circle at 50% 45%,#191919 0,#050505 55%,#000 100%);
  transition:.12s;
}

#count{
  font-size:min(44vw,260px);
  font-weight:900;
  line-height:1;
  text-shadow:0 0 28px #fff3;
  user-select:none;
}

.small{
  position:absolute;
  bottom:15%;
  opacity:.55;
  letter-spacing:.28em;
  font-size:12px;
}

#start,#next{
  position:absolute;
  bottom:7%;
  border:1px solid #ffffff50;
  background:#111;
  color:#fff;
  border-radius:999px;
  padding:15px 38px;
  font-weight:800;
  letter-spacing:.12em;
}

#fx{
  position:fixed;
  inset:0;
  display:none;
  overflow:hidden;
  z-index:5;
  background:#000;
}

#fx.on{display:block}

#slash{
  position:absolute;
  left:-30%;
  top:48%;
  width:160%;
  height:7px;
  background:#fff;
  box-shadow:0 0 18px #fff,0 0 45px #fff;
  transform:rotate(-18deg) scaleX(0);
  transform-origin:left;
  z-index:4;
}

#slash.go{
  animation:slash .18s ease-out forwards;
}

@keyframes slash{
  to{
    transform:rotate(-18deg) scaleX(1);
  }
}

#tearA,#tearB{
  position:absolute;
  inset:-10%;
  background:#050505;
  z-index:3;
  transition:transform .55s cubic-bezier(.2,.9,.2,1);
}

#tearA{
  clip-path:polygon(0 0,100% 0,100% 40%,0 72%);
}

#tearB{
  clip-path:polygon(0 72%,100% 40%,100% 100%,0 100%);
}

#fx.torn #tearA{
  transform:translate(-9%,-12%);
}

#fx.torn #tearB{
  transform:translate(9%,12%);
}

#glow{
  position:absolute;
  inset:0;
  background:radial-gradient(circle,#fff 0,#a00000 18%,#250000 48%,#000 75%);
  opacity:0;
  z-index:1;
}

#fx.torn #glow{
  animation:glow 1s forwards;
}

@keyframes glow{
  20%{opacity:1}
  100%{opacity:.55}
}

#hit{
  position:absolute;
  inset:0;
  z-index:2;
  display:grid;
  place-items:center;
  font-size:min(20vw,140px);
  font-weight:1000;
  letter-spacing:.08em;
  opacity:0;
  transform:scale(.55);
}

#fx.torn #hit{
  animation:hit .65s .18s cubic-bezier(.1,1.3,.2,1) forwards;
}

@keyframes hit{
  to{
    opacity:1;
    transform:scale(1);
  }
}

#black{
  position:fixed;
  inset:0;
  background:#000;
  z-index:6;
  display:none;
}

#win{
  position:fixed;
  inset:0;
  z-index:10;
  background:#000;
  display:none;
  place-items:center;
  text-align:center;
}

.winbig{
  font-weight:1000;
  font-size:min(14vw,90px);
  letter-spacing:.04em;
}

.winjp{
  margin-top:18px;
  font-size:min(7vw,38px);
  font-weight:800;
}

.shake{
  animation:shake .18s 3;
}

@keyframes shake{
  25%{transform:translate(7px,2px)}
  50%{transform:translate(-6px,-3px)}
  75%{transform:translate(4px,-2px)}
}
</style>
</head>

<body>

<div id="stage">
  <div id="count">3</div>
  <div class="small">TEST MODE / 100% HIT</div>
  <button id="start">START</button>
</div>

<div id="fx">
  <div id="glow"></div>
  <div id="hit">当たり</div>
  <div id="tearA"></div>
  <div id="tearB"></div>
  <div id="slash"></div>
</div>

<div id="black"></div>

<div id="win">
  <div>
    <div class="winbig">CONGRATULATIONS</div>
    <div class="winjp">おめでとうございます</div>
  </div>
  <button id="next">NEXT</button>
</div>

<script>
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r,ms));

let ctx;
let busy = false;

function audio(){
  ctx ||= new (window.AudioContext || window.webkitAudioContext)();

  if(ctx.state === 'suspended'){
    ctx.resume();
  }
}

function tone(f,d=.15,v=.12,type='sine'){
  let o = ctx.createOscillator();
  let g = ctx.createGain();

  o.type = type;
  o.frequency.value = f;

  g.gain.setValueAtTime(v,ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);

  o.connect(g).connect(ctx.destination);

  o.start();
  o.stop(ctx.currentTime+d);
}

function boom(){
  tone(52,.7,.5);
  tone(104,.45,.16,'triangle');

  setTimeout(()=>{
    tone(39,.9,.35);
  },40);
}

function tick(n){
  tone(n===1 ? 72 : 62,.18,.16);
  tone(n===1 ? 144 : 124,.12,.045,'triangle');
}

async function slashHit(){

  let fx = $('#fx');

  fx.className = 'on';

  await sleep(280);

  $('#slash').className = 'go';

  tone(850,.08,.11,'sawtooth');

  await sleep(120);

  fx.classList.add('torn');

  boom();

  document.body.classList.add('shake');

  await sleep(1500);

  document.body.classList.remove('shake');
}

async function blackoutHit(){

  let b = $('#black');

  b.style.display = 'block';

  await sleep(1200);

  boom();

  b.style.display = 'none';

  await slashHit();
}

async function fakeRevival(){

  await sleep(700);

  $('#count').textContent = '3';
  $('#start').style.display = 'block';

  await sleep(1450);

  $('#start').style.display = 'none';

  await slashHit();
}

async function play(){

  if(busy)return;

  busy = true;

  audio();

  $('#start').style.display = 'none';

  // TEST MODE
  // 必ず当たり。
  // 毎回ランダムで演出が変わる。

  let kind = Math.floor(Math.random()*5);
  let cut = Math.floor(Math.random()*3);

  for(let i=0;i<3;i++){

    let n = 3-i;

    $('#count').textContent = n;

    tick(n);

    await sleep(620);

    // カウント途中で突然切り裂き
    if(kind===0 && i===cut){

      $('#count').textContent = '';

      await slashHit();

      return finish();
    }

    await sleep(310);
  }

  $('#count').textContent = '';

  // ブラックアウト
  if(kind===1){

    await blackoutHit();

  // 復活
  }else if(kind===2){

    await fakeRevival();

  // 長い間
  }else{

    await sleep(kind===3 ? 1800 : 350);

    await slashHit();
  }

  finish();
}

async function finish(){

  await sleep(850);

  $('#fx').className = '';
  $('#slash').className = '';

  $('#win').style.display = 'grid';

  tone(392,.35,.14);

  setTimeout(()=>{
    tone(523,.35,.14);
  },180);

  setTimeout(()=>{
    tone(659,.6,.15);
  },360);
}

function reset(){

  $('#win').style.display = 'none';

  $('#fx').className = '';
  $('#slash').className = '';

  $('#count').textContent = '3';

  $('#start').style.display = 'block';

  busy = false;
}

$('#start').onclick = play;
$('#next').onclick = reset;
</script>

</body>
</html>
