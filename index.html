　<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>COUNTDOWN LOTTERY</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#100008;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  color:#fff;
}

body{
  position:fixed;
  inset:0;
}

/* =========================
   背景
========================= */

#bg{
  position:fixed;
  inset:0;
  z-index:0;

  background-color:#16000c;
  background-image:url("./AAECEFCC-FDEB-4353-9E97-53CA100DE812.png");

  /*
    縦方向を全部見せる。
    前の cover よりロゴが切れにくい。
  */
  background-size:auto 100%;
  background-position:center top;
  background-repeat:no-repeat;
}

#shade{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  background:
    radial-gradient(
      circle at 50% 52%,
      rgba(255,20,130,.02) 0%,
      rgba(20,0,12,.04) 48%,
      rgba(0,0,0,.28) 100%
    );
}

/* =========================
   羽
========================= */

#featherLayer{
  position:fixed;
  inset:0;
  z-index:4;
  overflow:hidden;
  pointer-events:none;
}

.featherWrap{
  position:absolute;
  top:-45vh;
  left:0;
  pointer-events:none;
  will-change:transform;
}

.featherSway{
  width:100%;
  height:100%;
  will-change:transform;
}

.feather{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
  will-change:transform,opacity;
}

/* =========================
   メイン
========================= */

#game{
  position:fixed;
  inset:0;
  z-index:10;
}

/* =========================
   スタート画面
========================= */

#startScreen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding-bottom:max(8vh,55px);
  z-index:30;
}

#startInfo{
  text-align:center;
  margin-bottom:18px;
  font-weight:800;
  letter-spacing:.14em;
  text-shadow:0 2px 5px #000;
}

#startInfo .main{
  font-size:18px;
}

#startInfo .sub{
  margin-top:5px;
  font-size:11px;
  opacity:.82;
}

#startButton{
  width:min(78vw,330px);
  height:72px;
  border:2px solid rgba(255,255,255,.85);
  border-radius:18px;
  color:#fff;
  font-size:27px;
  font-weight:900;
  letter-spacing:.16em;
  background:
    linear-gradient(
      180deg,
      rgba(255,105,178,.96),
      rgba(218,0,99,.96)
    );
  box-shadow:
    0 7px 0 #790037,
    0 12px 25px rgba(0,0,0,.5),
    inset 0 2px 0 rgba(255,255,255,.45);
}

#startButton:active{
  transform:translateY(4px);
  box-shadow:
    0 3px 0 #790037,
    0 8px 18px rgba(0,0,0,.5);
}

/* =========================
   カウント数字
========================= */

#number{
  position:absolute;
  left:50%;
  top:61%;
  transform:translate(-50%,-50%);

  z-index:20;

  font-size:min(45vw,220px);
  line-height:.8;
  font-weight:1000;
  font-family:Impact,"Arial Black",sans-serif;

  color:#fff7fb;

  -webkit-text-stroke:
    clamp(4px,1.4vw,8px)
    #ff4b9d;

  text-shadow:
    0 5px 0 #d82779,
    0 10px 0 #a80052,
    0 15px 7px rgba(60,0,28,.72);

  opacity:0;
  pointer-events:none;
  user-select:none;
}

#number.show{
  opacity:1;
  animation:numberIn .16s ease-out;
}

@keyframes numberIn{
  0%{
    transform:translate(-50%,-50%) scale(.88);
  }
  100%{
    transform:translate(-50%,-50%) scale(1);
  }
}

#number.red{
  color:#fff0f3;
  -webkit-text-stroke:7px #ff153e;
  text-shadow:
    0 5px 0 #d00029,
    0 10px 0 #830016,
    0 15px 7px rgba(0,0,0,.7);
}

#number.gold{
  color:#fffde6;
  -webkit-text-stroke:7px #ffd200;
  text-shadow:
    0 5px 0 #e59b00,
    0 10px 0 #9c5900,
    0 15px 7px rgba(0,0,0,.7);
}

#number.small{
  transform:translate(-50%,-50%) scale(.76);
}

/* =========================
   メッセージ
========================= */

#message{
  position:absolute;
  left:50%;
  top:73%;
  transform:translateX(-50%);
  z-index:21;
  width:100%;
  text-align:center;
  font-size:24px;
  font-weight:900;
  letter-spacing:.1em;
  text-shadow:0 3px 8px #000;
  pointer-events:none;
}

/* =========================
   ブラックアウト
========================= */

#blackout{
  position:fixed;
  inset:0;
  z-index:50;
  background:#000;
  opacity:0;
  pointer-events:none;
  transition:opacity .06s linear;
}

#blackout.on{
  opacity:1;
}

/* =========================
   フラッシュ
========================= */

#flash{
  position:fixed;
  inset:0;
  z-index:70;
  background:#fff;
  opacity:0;
  pointer-events:none;
}

#flash.on{
  animation:flashAnim .32s ease-out;
}

@keyframes flashAnim{
  0%{opacity:1}
  100%{opacity:0}
}

/* =========================
   斬撃
========================= */

#slashLayer{
  position:fixed;
  inset:0;
  z-index:65;
  pointer-events:none;
  overflow:hidden;
}

.slash{
  position:absolute;
  left:-35vw;
  top:50%;
  width:170vw;
  height:12px;

  transform:
    translateY(-50%)
    rotate(-25deg)
    scaleX(0);

  transform-origin:center;

  background:#fff;

  box-shadow:
    0 0 7px #fff,
    0 0 18px #ff3b96,
    0 0 40px #ff006e,
    0 0 70px #ff006e;

  animation:slashGo .38s cubic-bezier(.1,.8,.2,1) forwards;
}

.slash.two{
  transform:
    translateY(-50%)
    rotate(24deg)
    scaleX(0);
}

@keyframes slashGo{
  0%{
    opacity:0;
    transform:
      translateY(-50%)
      rotate(-25deg)
      scaleX(0);
  }
  22%{
    opacity:1;
  }
  55%{
    transform:
      translateY(-50%)
      rotate(-25deg)
      scaleX(1);
  }
  100%{
    opacity:0;
    transform:
      translateY(-50%)
      rotate(-25deg)
      scaleX(1);
  }
}

/* =========================
   当たり
========================= */

#hitText{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.4);
  z-index:80;

  font-size:min(22vw,110px);
  white-space:nowrap;
  font-weight:1000;
  font-family:Impact,"Arial Black",sans-serif;

  color:#fff;

  -webkit-text-stroke:5px #ff2486;

  text-shadow:
    0 5px 0 #d00064,
    0 10px 0 #780032,
    0 0 25px #ff1680;

  opacity:0;
  pointer-events:none;
}

#hitText.on{
  animation:hitPop .7s cubic-bezier(.12,.8,.15,1) forwards;
}

@keyframes hitPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.3);
  }
  35%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.18);
  }
  55%{
    transform:translate(-50%,-50%) scale(.96);
  }
  100%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }
}

/* =========================
   宝箱
========================= */

#treasureScreen{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  padding:30px 14px;

  background:
    radial-gradient(
      circle at 50% 38%,
      rgba(255,20,130,.42),
      rgba(28,0,16,.92) 55%,
      rgba(0,0,0,.97)
    );
}

#treasureScreen.show{
  display:flex;
}

#treasureIntro{
  font-size:14px;
  font-weight:800;
  letter-spacing:.12em;
  margin-bottom:8px;
}

#treasureTitle{
  text-align:center;
  font-size:27px;
  font-weight:1000;
  letter-spacing:.06em;
  text-shadow:0 0 15px #ff1680;
}

#treasureSub{
  margin-top:8px;
  font-size:13px;
  opacity:.88;
  text-align:center;
}

#chests{
  width:100%;
  max-width:500px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:8px;
  margin-top:42px;
}

.chestWrap{
  flex:1;
  max-width:150px;
  min-width:0;
  text-align:center;
}

.chest{
  position:relative;
  width:100%;
  aspect-ratio:1.08/1;
  cursor:pointer;
  transform-origin:center bottom;
}

/* 蓋 */
.chestLid{
  position:absolute;
  left:7%;
  top:16%;
  width:86%;
  height:34%;
  border-radius:18px 18px 7px 7px;

  background:
    linear-gradient(
      180deg,
      #ffdd79 0%,
      #d78a17 20%,
      #754008 22%,
      #b85b16 40%,
      #6f2b08 100%
    );

  border:3px solid #ffd96b;

  box-shadow:
    inset 0 4px 4px rgba(255,255,255,.3),
    0 5px 8px rgba(0,0,0,.5);

  transform-origin:center bottom;
  transition:transform .45s ease;
}

/* 本体 */
.chestBody{
  position:absolute;
  left:7%;
  bottom:7%;
  width:86%;
  height:52%;
  border-radius:5px 5px 14px 14px;

  background:
    linear-gradient(
      90deg,
      #5f2107,
      #c26a1c 22%,
      #7b2b08 50%,
      #c36c1d 77%,
      #5d2007
    );

  border:3px solid #ffc94f;

  box-shadow:
    inset 0 0 12px rgba(0,0,0,.6),
    0 8px 14px rgba(0,0,0,.6);
}

.chestLock{
  position:absolute;
  left:50%;
  top:43%;
  transform:translateX(-50%);
  width:25%;
  height:30%;

  border-radius:5px;

  background:
    linear-gradient(#fff1a3,#d49315);

  border:2px solid #704000;

  z-index:3;
}

.chest.open .chestLid{
  transform:
    translateY(-24%)
    rotateX(72deg);
}

.chest.shake{
  animation:chestShake .48s linear;
}

@keyframes chestShake{
  0%,100%{transform:translateX(0) rotate(0)}
  15%{transform:translateX(-7px) rotate(-3deg)}
  30%{transform:translateX(7px) rotate(3deg)}
  45%{transform:translateX(-6px) rotate(-2deg)}
  60%{transform:translateX(6px) rotate(2deg)}
  75%{transform:translateX(-3px)}
}

.rankLabel{
  margin-top:9px;
  min-height:29px;
  font-size:22px;
  font-weight:1000;
  opacity:0;
}

.rankLabel.show{
  opacity:1;
}

.rank1{
  color:#ffe36b;
  text-shadow:0 0 12px #ffb300;
}

.rank2{
  color:#f4f4f4;
  text-shadow:0 0 10px #aab6c7;
}

.rank3{
  color:#ff9c4a;
  text-shadow:0 0 10px #c94d00;
}

/* =========================
   等級結果
========================= */

#rankResult{
  position:fixed;
  inset:0;
  z-index:130;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;

  background:rgba(0,0,0,.77);
}

#rankResult.show{
  display:flex;
}

#rankBig{
  font-size:min(24vw,120px);
  font-weight:1000;
  line-height:1;
  text-align:center;
}

#rankWin{
  margin-top:15px;
  font-size:31px;
  font-weight:1000;
}

/* =========================
   NEXT
========================= */

#nextButton{
  display:none;
  margin-top:32px;
  width:min(72vw,300px);
  height:60px;

  border:2px solid #fff;
  border-radius:16px;

  color:#fff;
  background:linear-gradient(#ff5fa8,#bc0055);

  font-size:22px;
  font-weight:1000;
  letter-spacing:.12em;
}

/* =========================
   小さい画面
========================= */

@media(max-width:380px){
  #treasureTitle{
    font-size:23px;
  }

  #chests{
    gap:4px;
  }

  .rankLabel{
    font-size:19px;
  }
}
</style>
</head>

<body>

<div id="bg"></div>
<div id="shade"></div>
<div id="featherLayer"></div>

<div id="game">

  <div id="startScreen">
    <div id="startInfo">
      <div class="main">完全抽選 1/30</div>
      <div class="sub">毎回独立抽選</div>
    </div>

    <button id="startButton">START</button>
  </div>

  <div id="number"></div>
  <div id="message"></div>

</div>

<div id="slashLayer"></div>
<div id="blackout"></div>
<div id="flash"></div>
<div id="hitText">当たり</div>

<div id="treasureScreen">

  <div id="treasureIntro">ここからが本番。</div>

  <div id="treasureTitle">
    運命の宝箱を選べ！
  </div>

  <div id="treasureSub">
    この一箱が、結果を決める。
  </div>

  <div id="chests">

    <div class="chestWrap">
      <div class="chest" data-index="0">
        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestLock"></div>
      </div>
      <div class="rankLabel"></div>
    </div>

    <div class="chestWrap">
      <div class="chest" data-index="1">
        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestLock"></div>
      </div>
      <div class="rankLabel"></div>
    </div>

    <div class="chestWrap">
      <div class="chest" data-index="2">
        <div class="chestLid"></div>
        <div class="chestBody"></div>
        <div class="chestLock"></div>
      </div>
      <div class="rankLabel"></div>
    </div>

  </div>

  <button id="nextButton">NEXT</button>

</div>

<div id="rankResult">
  <div id="rankBig"></div>
  <div id="rankWin">当選！</div>
</div>

<audio
  id="hitMusic"
  src="./hit_music_final.mp3"
  preload="auto">
</audio>

<script>

/* =========================================================
   基本
========================================================= */

const sleep = ms =>
  new Promise(resolve => setTimeout(resolve,ms));

const number =
  document.getElementById("number");

const message =
  document.getElementById("message");

const startScreen =
  document.getElementById("startScreen");

const startButton =
  document.getElementById("startButton");

const blackout =
  document.getElementById("blackout");

const flash =
  document.getElementById("flash");

const hitText =
  document.getElementById("hitText");

const hitMusic =
  document.getElementById("hitMusic");

const featherLayer =
  document.getElementById("featherLayer");

const treasureScreen =
  document.getElementById("treasureScreen");

const treasureTitle =
  document.getElementById("treasureTitle");

const treasureSub =
  document.getElementById("treasureSub");

const nextButton =
  document.getElementById("nextButton");

const rankResult =
  document.getElementById("rankResult");

const rankBig =
  document.getElementById("rankBig");

let playing = false;
let featherTimer = null;
let audioCtx = null;


/* =========================================================
   羽8種類
========================================================= */

const FEATHERS = [

  "./2861EE44-6874-491B-9FD1-2EAD12340DBA.png",

  "./3A7430CF-FCCE-4ABF-B1A8-3AF6D2641A18.png",

  "./6472D0CA-C75B-419B-9484-7F6985FA2BB6.png",

  "./6B4FEC6B-D466-47DC-8BAF-444CB71B5152.png",

  "./8B652B5F-DC95-4A84-9795-2924E56DC8CF.png",

  "./A73F0553-5069-4F38-8332-68D332E85F4B.png",

  "./E2C84B27-312E-485B-B77B-8E0A9B6B36B6.png",

  "./F0922A9C-70CA-49B0-A7C4-38B69A670AF9.png"

];


/* =========================================================
   羽生成
========================================================= */

function rand(min,max){
  return Math.random() * (max-min) + min;
}

function randomItem(arr){
  return arr[
    Math.floor(Math.random()*arr.length)
  ];
}

function createFeather(
  intensity = 1,
  burst = false
){

  const wrap =
    document.createElement("div");

  wrap.className =
    "featherWrap";


  const sway =
    document.createElement("div");

  sway.className =
    "featherSway";


  const img =
    document.createElement("img");

  img.className =
    "feather";

  img.src =
    randomItem(FEATHERS);


  /*
    通常時は小〜中サイズ。
    当たり時だけ大きい羽も混ぜる。
  */

  let size;

  if(burst){

    size =
      rand(45,145);

  }else{

    size =
      rand(28,88) *
      (0.85 + intensity*.13);

  }


  wrap.style.width =
    size+"px";

  wrap.style.height =
    size*1.35+"px";


  /*
    左右の画面外からも入る
  */

  const startX =
    rand(-12,100);

  wrap.style.left =
    startX+"vw";


  /*
    奥行き感
  */

  const opacity =
    burst
      ? rand(.58,.96)
      : rand(.30,.78);

  img.style.opacity =
    opacity;


  /*
    左右反転を混ぜる
  */

  if(Math.random()<.5){
    img.style.transform =
      "scaleX(-1)";
  }


  sway.appendChild(img);
  wrap.appendChild(sway);
  featherLayer.appendChild(wrap);


  /*
    落下速度
  */

  const duration =
    burst
      ? rand(2800,5200)
      : rand(6000,11500);


  /*
    横移動
  */

  const drift =
    rand(-38,38);


  /*
    回転
  */

  const startRot =
    rand(-100,100);

  const rotations =
    rand(90,420) *
    (Math.random()<.5 ? -1 : 1);


  /*
    落下
  */

  wrap.animate(
    [
      {
        transform:
          `translate3d(0,-15vh,0)
           rotate(${startRot}deg)`
      },

      {
        transform:
          `translate3d(${drift*.45}vw,55vh,0)
           rotate(${startRot + rotations*.45}deg)`
      },

      {
        transform:
          `translate3d(${drift}vw,150vh,0)
           rotate(${startRot + rotations}deg)`
      }
    ],
    {
      duration,
      easing:"linear",
      fill:"forwards"
    }
  );


  /*
    羽独特の左右揺れ
  */

  const swayAmount =
    rand(12,42);

  const swayTime =
    rand(1200,2600);

  sway.animate(
    [
      {
        transform:
          `translateX(${-swayAmount}px)
           rotate(-7deg)`
      },

      {
        transform:
          `translateX(${swayAmount}px)
           rotate(8deg)`
      },

      {
        transform:
          `translateX(${-swayAmount*.7}px)
           rotate(-5deg)`
      }
    ],
    {
      duration:swayTime,
      iterations:Infinity,
      direction:"alternate",
      easing:"ease-in-out"
    }
  );


  /*
    少しふわっと出て消える
  */

  img.animate(
    [
      {opacity:0},
      {opacity:opacity,offset:.08},
      {opacity:opacity,offset:.84},
      {opacity:0}
    ],
    {
      duration,
      easing:"linear",
      fill:"forwards"
    }
  );


  setTimeout(()=>{
    wrap.remove();
  },duration+300);
}


/* =========================================================
   羽量
========================================================= */

function featherBurst(count=16){

  for(let i=0;i<count;i++){

    setTimeout(()=>{

      createFeather(
        3,
        true
      );

    },Math.random()*600);

  }
}


function featherStage(level){

  clearInterval(featherTimer);

  let interval;

  if(level===1){

    interval = 1150;

  }else if(level===2){

    interval = 720;

  }else{

    interval = 420;

  }


  /*
    ステージ開始直後にも数枚
  */

  const first =
    level===1 ? 2 :
    level===2 ? 4 : 7;

  for(let i=0;i<first;i++){

    setTimeout(()=>{

      createFeather(level);

    },i*120);

  }


  featherTimer =
    setInterval(()=>{

      createFeather(level);

      if(
        level===3 &&
        Math.random()<.35
      ){
        createFeather(level);
      }

    },interval);

}


function stopFeathers(){

  clearInterval(featherTimer);
  featherTimer = null;

}


/* =========================================================
   iPhone用オーディオ解除
========================================================= */

function unlockAudio(){

  try{

    if(!audioCtx){

      audioCtx =
        new(
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(audioCtx.state==="suspended"){
      audioCtx.resume();
    }

    hitMusic.volume = 0;

    hitMusic.play()
      .then(()=>{

        hitMusic.pause();
        hitMusic.currentTime=0;
        hitMusic.volume=1;

      })
      .catch(()=>{});

  }catch(e){}

}


/* =========================================================
   オリジナル効果音
========================================================= */

function tone(
  freq=120,
  duration=.1,
  volume=.12,
  type="sine"
){

  if(!audioCtx)return;

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type = type;
  osc.frequency.value = freq;

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime + duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(
    audioCtx.currentTime + duration
  );

}


function countSound(n){

  if(n===3){
    tone(92,.14,.11,"sine");
  }

  if(n===2){
    tone(105,.15,.13,"sine");

    tone(122,.18,.15,"sine");
  }

}

    options.silence || 130

/* =========================================================

let selectedRank = null;
let chestRanks = [];
let treasureLocked = false;

  1等 5%
  2等 20%
  3等 75%
*/

  }

  treasureTitle.textContent =

    .querySelectorAll(".chest")

      label.textContent="";
      label.className="rankLabel";

    });


  treasureScreen.classList.add("show");

}


/* =========================================================
   シャッフル
========================================================= */

function shuffle(arr){

  const a=[...arr];

  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    const j =
      Math.floor(
        Math.random()*(i+1)
      );

    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];

  }

  return a;

}


/* =========================================================
   宝箱選択
========================================================= */

document
  .querySelectorAll(".chest")
  .forEach(chest=>{

    chest.addEventListener(
      "click",
      async()=>{

        if(treasureLocked)return;

        treasureLocked=true;


        const chosen =
          Number(
            chest.dataset.index
          );


        /*
          選んだ箱に
          事前抽選済み等級を配置。
        */

        chestRanks =
          [null,null,null];

        chestRanks[chosen] =
          selectedRank;


        /*
          残り2つは
          残った2等級をランダム配置。
        */

        const remainingRanks =
          shuffle(
            [1,2,3].filter(
              rank =>
                rank !== selectedRank
            )
          );


        const otherIndexes =
          shuffle(
            [0,1,2].filter(
              i => i !== chosen
            )
          );


        chestRanks[
          otherIndexes[0]
        ] =
          remainingRanks[0];

        chestRanks[
          otherIndexes[1]
        ] =
          remainingRanks[1];


        /* 選んだ箱揺れ */

        chest.classList.add("shake");

        await sleep(600);

        chest.classList.remove("shake");

        chest.classList.add("open");


        flash.classList.remove("on");

        void flash.offsetWidth;

        flash.classList.add("on");


        featherBurst(11);

        await sleep(550);


        showRankLabel(
          chosen,
          selectedRank
        );


        await sleep(450);


        await showBigRank(
          selectedRank
        );


        treasureTitle.textContent =
          "残りの宝箱は…";

        treasureSub.textContent =
          "選ばなかった箱もオープン";


        /*
          残りの開封順もランダム
        */

        const revealOrder =
          shuffle(otherIndexes);


        await sleep(650);


        for(
          const index of revealOrder
        ){

          const otherChest =
            document
              .querySelector(
                `.chest[data-index="${index}"]`
              );

          otherChest
            .classList.add("shake");

          await sleep(420);

          otherChest
            .classList.remove("shake");

          otherChest
            .classList.add("open");

          flash.classList.remove("on");

          void flash.offsetWidth;

          flash.classList.add("on");

          await sleep(300);

          showRankLabel(
            index,
            chestRanks[index]
          );

          await sleep(650);

        }


        nextButton.style.display =
          "block";

      }
    );

  });
